# ============================================================================
# SANCHALA OS - Kernel Module Blacklist
# ============================================================================
# Version: 2.0 | Disables dangerous/unnecessary kernel modules
# Attack surface reduction - exceeds macOS module restrictions
# ============================================================================

# ============================================================================
# UNCOMMON NETWORK PROTOCOLS (Attack Surface Reduction)
# ============================================================================
# These protocols have had numerous vulnerabilities and are rarely needed

install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
install n-hdlc /bin/false
install ax25 /bin/false
install netrom /bin/false
install x25 /bin/false
install rose /bin/false
install decnet /bin/false
install econet /bin/false
install af_802154 /bin/false
install ipx /bin/false
install appletalk /bin/false
install psnap /bin/false
install p8023 /bin/false
install p8022 /bin/false
install can /bin/false
install atm /bin/false

# ============================================================================
# UNCOMMON FILESYSTEMS (Attack Surface Reduction)
# ============================================================================
# Legacy/exotic filesystems often have unpatched vulnerabilities

install cramfs /bin/false
install freevxfs /bin/false
install jffs2 /bin/false
install hfs /bin/false
install hfsplus /bin/false
install udf /bin/false
install cifs /bin/false
install nfs /bin/false
install nfsv3 /bin/false
install nfsv4 /bin/false
install gfs2 /bin/false
install vivid /bin/false
install ksmbd /bin/false

# Note: squashfs needed for Flatpak/snaps - DO NOT blacklist
# Note: overlayfs needed for containers - DO NOT blacklist

# ============================================================================
# FIREWIRE (IEEE 1394) - DMA ATTACKS
# ============================================================================
# FireWire allows direct memory access - major security risk

install firewire-core /bin/false
install firewire-ohci /bin/false
install firewire-sbp2 /bin/false
install firewire-net /bin/false
install firewire_core /bin/false
install firewire_ohci /bin/false
install firewire_sbp2 /bin/false
install ohci1394 /bin/false
install sbp2 /bin/false
install dv1394 /bin/false
install raw1394 /bin/false
install video1394 /bin/false

# ============================================================================
# THUNDERBOLT (Optional - DMA Protection)
# ============================================================================
# Uncomment if Thunderbolt not needed - prevents DMA attacks
# Modern systems with IOMMU are protected, but extra defense-in-depth

# install thunderbolt /bin/false

# ============================================================================
# WIRELESS LEGACY PROTOCOLS
# ============================================================================

install af_802154 /bin/false
install ieee802154 /bin/false

# ============================================================================
# BLUETOOTH (Optional)
# ============================================================================
# Uncomment to disable Bluetooth entirely

# install bluetooth /bin/false
# install btusb /bin/false
# install btrtl /bin/false
# install btbcm /bin/false
# install btintel /bin/false
# install bnep /bin/false
# install rfcomm /bin/false

# ============================================================================
# VIRTUALIZATION GUEST MODULES (if not in VM)
# ============================================================================
# Disable if running on bare metal

# install virtio /bin/false
# install virtio_pci /bin/false
# install virtio_blk /bin/false
# install vmw_balloon /bin/false
# install vmw_vmci /bin/false
# install vmw_vsock_vmci_transport /bin/false
# install vmwgfx /bin/false
# install hyperv_fb /bin/false

# ============================================================================
# MISC DANGEROUS/UNNECESSARY MODULES
# ============================================================================

# Webcam (uncomment to disable)
# install uvcvideo /bin/false

# USB Storage (uncomment to disable USB drives)
# install usb-storage /bin/false
# install uas /bin/false

# PCMCIA (legacy, attack surface)
install pcmcia /bin/false
install yenta_socket /bin/false

# Floppy (legacy)
install floppy /bin/false

# CD-ROM burning (often unnecessary)
# install cdrom /bin/false
# install sr_mod /bin/false

# Hardware RNG trust (use software entropy)
# install intel-rng /bin/false
# install amd-rng /bin/false

# MEI (Intel Management Engine Interface) - potential backdoor
# Uncomment only if you don't need Intel AMT/vPro
# install mei /bin/false
# install mei_me /bin/false

# ============================================================================
# PREVENT MODULE AUTO-LOADING FOR SPECIFIC DEVICES
# ============================================================================

blacklist dccp
blacklist sctp
blacklist rds
blacklist tipc
blacklist n-hdlc
blacklist cramfs
blacklist freevxfs
blacklist jffs2
blacklist hfs
blacklist hfsplus
blacklist firewire-core
blacklist firewire-ohci
blacklist floppy
