# ============================================================================
# SANCHALA OS - Kernel Security Hardening Configuration
# ============================================================================
# Version: 2.0 | Security Level: MAXIMUM (exceeds macOS XNU hardening)
# Part of the 8-layer security architecture
# ============================================================================

# ============================================================================
# SECTION 1: KERNEL SELF-PROTECTION
# ============================================================================

# Restrict kernel pointer exposure (prevents KASLR bypass)
kernel.kptr_restrict = 2

# Restrict dmesg access to root only
kernel.dmesg_restrict = 1

# Restrict perf events (prevents side-channel attacks)
kernel.perf_event_paranoid = 3

# Disable kexec (prevents kernel replacement attacks)
kernel.kexec_load_disabled = 1

# Restrict ptrace - admin-only attach (Yama LSM)
kernel.yama.ptrace_scope = 2

# Disable SysRq key completely
kernel.sysrq = 0

# Restrict unprivileged BPF
kernel.unprivileged_bpf_disabled = 1

# BPF JIT hardening (constant blinding)
net.core.bpf_jit_harden = 2

# Full ASLR
kernel.randomize_va_space = 2

# Restrict TTY line discipline loading
dev.tty.ldisc_autoload = 0

# Restrict io_uring (attack surface reduction)
kernel.io_uring_disabled = 2

# Panic on kernel oops (prevents exploitation)
kernel.panic_on_oops = 1
kernel.panic = 10

# Restrict printk
kernel.printk = 3 3 3 3

# ============================================================================
# SECTION 2: MEMORY PROTECTION
# ============================================================================

# Restrict core dumps from SUID binaries
fs.suid_dumpable = 0

# Protect symlinks (prevents symlink attacks)
fs.protected_symlinks = 1
fs.protected_hardlinks = 1

# Protect FIFOs in sticky directories
fs.protected_fifos = 2

# Protect regular files in sticky directories
fs.protected_regular = 2

# Restrict userfaultfd (used in exploits)
vm.unprivileged_userfaultfd = 0

# Restrict mmap minimum address (null pointer exploit prevention)
vm.mmap_min_addr = 65536

# Maximize mmap randomization
vm.mmap_rnd_bits = 32
vm.mmap_rnd_compat_bits = 16

# Disable coredumps via pattern
kernel.core_pattern = |/bin/false
kernel.core_uses_pid = 1

# ============================================================================
# SECTION 3: NETWORK SECURITY
# ============================================================================

# Disable IP forwarding (not a router)
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# Enable SYN cookies (SYN flood protection)
net.ipv4.tcp_syncookies = 1

# Disable source routing (prevents IP spoofing)
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Disable ICMP redirects (prevents MITM)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0

# Don't send ICMP redirects
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Strict reverse path filtering (anti-spoofing)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Log martian packets
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Ignore ICMP broadcasts (Smurf attack prevention)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore bogus ICMP errors
net.ipv4.icmp_ignore_bogus_error_responses = 1

# TCP RFC 1337 (TIME-WAIT assassination protection)
net.ipv4.tcp_rfc1337 = 1

# Disable TCP timestamps (reduces info leakage)
net.ipv4.tcp_timestamps = 0

# Disable IPv6 router advertisements
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0

# IPv6 privacy extensions (RFC 4941)
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2

# TCP hardening
net.ipv4.tcp_syn_retries = 3
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_max_syn_backlog = 4096
net.ipv4.tcp_max_orphans = 16384

# ============================================================================
# SECTION 4: USER NAMESPACE (Sandboxing Support)
# ============================================================================

# Enable user namespaces for Flatpak/Bubblewrap sandboxing
kernel.unprivileged_userns_clone = 1

# Namespace limits (DoS prevention)
user.max_user_namespaces = 15000
user.max_pid_namespaces = 15000
user.max_net_namespaces = 15000

# ============================================================================
# SECTION 5: MODULE & IPC SECURITY
# ============================================================================

# Disable module loading after boot (uncomment for maximum security)
# kernel.modules_disabled = 1

# IPC hardening
fs.mqueue.msg_max = 10
fs.mqueue.msgsize_max = 8192
fs.mqueue.queues_max = 256

