# Sanchala Browser Default Configuration
# Maximum security settings enabled by default

[General]
ProductName=Sanchala
Version=1.0.0
Vendor=Sanchala OS
DefaultSearchEngine=DuckDuckGo
Homepage=about:blank
NewTabPage=sanchala://newtab

[Security]
# Security Level: Standard, Strict, Max (default)
SecurityLevel=Max

# Site Isolation
StrictSiteIsolation=true
IsolateOrigins=true

# HTTPS
HTTPSOnlyMode=true
HTTPSFirstMode=true
MixedContentBlocking=strict

# DNS
DoHEnabled=true
DoHProvider=Cloudflare
DoHSecureMode=true
ECHEnabled=true

# Certificate Transparency
CertificateTransparency=true
CTPolicyEnforcement=true

[Privacy]
# Fingerprint Protection
FingerprintProtection=true
CanvasFingerprintProtection=true
WebGLFingerprintProtection=true
AudioFingerprintProtection=true
FontFingerprintProtection=true
HardwareFingerprintProtection=true

# WebRTC
WebRTCIPHandlingPolicy=disable_non_proxied_udp
WebRTCLocalIPsBlocked=true

# Tracking
ThirdPartyCookiesBlocked=true
TrackingProtection=strict
ReferrerPolicy=strict-origin-when-cross-origin
UserAgentRandomization=true

# Permissions
ClipboardProtection=true
LocationPermission=ask
CameraPermission=ask
MicrophonePermission=ask
NotificationsPermission=ask
SensorsPermission=blocked

[Shield]
Enabled=true
AdsBlocked=true
TrackersBlocked=true
ScriptsBlocked=false
CookiesControlled=true
HTTPSUpgrades=true
FingerprintBlocked=true

# Filter Lists
EasyListEnabled=true
EasyPrivacyEnabled=true
FanboyAnnoyances=true
MalwareDomainsEnabled=true

[Tor]
Enabled=false
AutoConnect=false
BridgesEnabled=false

[VPN]
Enabled=false
KillSwitch=true
Protocol=WireGuard

[Sync]
Enabled=false
EncryptionEnabled=true
BookmarksSync=true
HistorySync=false
PasswordsSync=true
SettingsSync=true

[UI]
VerticalTabs=true
SidebarEnabled=true
TabGroupsEnabled=true
ReaderModeEnabled=true
DarkModeAuto=true
KDEThemeIntegration=true

[Keychain]
IntegrationEnabled=true
BiometricUnlock=true
AutoFill=true

[Guardian]
IntegrationEnabled=true
RealtimeProtection=true
DownloadScanning=true
PhishingProtection=true
MalwareProtection=true
