<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Sanchala Privacy D-Bus Policy -->
  
  <!-- Only root can own the service -->
  <policy user="root">
    <allow own="id.sanchala.Privacy"/>
  </policy>

  <!-- Allow all users to call methods -->
  <policy context="default">
    <allow send_destination="id.sanchala.Privacy"/>
    <allow receive_sender="id.sanchala.Privacy"/>
  </policy>

  <!-- Restrict sensitive methods to admin group -->
  <policy group="wheel">
    <allow send_destination="id.sanchala.Privacy"
           send_interface="id.sanchala.Privacy"
           send_member="SetTelemetryOption"/>
    <allow send_destination="id.sanchala.Privacy"
           send_interface="id.sanchala.Privacy"
           send_member="ResetPrivacySettings"/>
  </policy>
</busconfig>
