# ============================================
# SANCHALA OS - Open With Menu Configuration
# ============================================
# Defines applications shown in "Open With" context menus
# Location: /usr/share/sanchala/file-associations/
# ============================================

[General]
Version=1.0
ShowRecommended=true
ShowAllApps=false
MaxRecentApps=5
GroupByCategory=true

# ====================
# Image Applications
# ====================
[image/*]
Recommended=org.kde.gwenview.desktop;gimp.desktop;org.inkscape.Inkscape.desktop
Additional=krita.desktop;darktable.desktop;rawtherapee.desktop

[image/svg+xml]
Recommended=org.inkscape.Inkscape.desktop;org.kde.gwenview.desktop
Additional=brave-browser.desktop

# ====================
# Document Applications
# ====================
[application/pdf]
Recommended=org.kde.okular.desktop;brave-browser.desktop
Additional=libreoffice-draw.desktop;gimp.desktop

[application/epub+zip]
Recommended=org.kde.okular.desktop;calibre-ebook-viewer.desktop
Additional=calibre-gui.desktop

[text/plain]
Recommended=org.kde.kate.desktop;org.kde.kwrite.desktop
Additional=libreoffice-writer.desktop;code.desktop

[text/markdown]
Recommended=org.kde.kate.desktop;ghostwriter.desktop
Additional=brave-browser.desktop;code.desktop

# ====================
# Office Applications
# ====================
[application/vnd.oasis.opendocument.text]
Recommended=libreoffice-writer.desktop;calligrawords.desktop
Additional=org.kde.kate.desktop

[application/vnd.oasis.opendocument.spreadsheet]
Recommended=libreoffice-calc.desktop;calligrasheets.desktop
Additional=gnumeric.desktop

[application/vnd.oasis.opendocument.presentation]
Recommended=libreoffice-impress.desktop;calligrastage.desktop

[application/msword]
Recommended=libreoffice-writer.desktop;calligrawords.desktop
Additional=org.kde.kate.desktop

[application/vnd.openxmlformats-officedocument.wordprocessingml.document]
Recommended=libreoffice-writer.desktop;calligrawords.desktop

[application/vnd.ms-excel]
Recommended=libreoffice-calc.desktop;calligrasheets.desktop

[application/vnd.openxmlformats-officedocument.spreadsheetml.sheet]
Recommended=libreoffice-calc.desktop;calligrasheets.desktop

# ====================
# Video Applications
# ====================
[video/*]
Recommended=vlc.desktop;org.kde.haruna.desktop;mpv.desktop
Additional=celluloid.desktop;totem.desktop

# ====================
# Audio Applications
# ====================
[audio/*]
Recommended=vlc.desktop;org.kde.elisa.desktop;audacious.desktop
Additional=org.kde.amarok.desktop;rhythmbox.desktop;lollypop.desktop

# ====================
# Archive Applications
# ====================
[application/zip]
Recommended=org.kde.ark.desktop;org.kde.dolphin.desktop
Additional=file-roller.desktop;xarchiver.desktop

[application/x-compressed-tar]
Recommended=org.kde.ark.desktop;org.kde.dolphin.desktop

[application/x-7z-compressed]
Recommended=org.kde.ark.desktop
Additional=p7zip.desktop

[application/x-rar]
Recommended=org.kde.ark.desktop
Additional=file-roller.desktop

# ====================
# Web Content
# ====================
[text/html]
Recommended=brave-browser.desktop;firefox.desktop
Additional=org.kde.kate.desktop;code.desktop

[application/xhtml+xml]
Recommended=brave-browser.desktop;firefox.desktop

# ====================
# Code/Development
# ====================
[text/x-python]
Recommended=org.kde.kate.desktop;code.desktop
Additional=idle.desktop;spyder.desktop

[text/x-csrc]
Recommended=org.kde.kate.desktop;code.desktop
Additional=qtcreator.desktop

[text/x-c++src]
Recommended=org.kde.kate.desktop;code.desktop
Additional=qtcreator.desktop;kdevelop.desktop

[text/javascript]
Recommended=org.kde.kate.desktop;code.desktop

[application/json]
Recommended=org.kde.kate.desktop;code.desktop
Additional=brave-browser.desktop

[application/x-yaml]
Recommended=org.kde.kate.desktop;code.desktop

[text/x-rust]
Recommended=org.kde.kate.desktop;code.desktop

# ====================
# Sanchala Custom Types
# ====================
[application/x-sanchala-config]
Recommended=org.kde.kate.desktop;sanchala-settings.desktop

[application/x-sanchala-theme]
Recommended=sanchala-theme-installer.desktop;org.kde.ark.desktop

[application/x-sanchala-backup]
Recommended=sanchala-backup.desktop;org.kde.ark.desktop

[application/x-sanchala-extension]
Recommended=sanchala-extension-installer.desktop;org.kde.ark.desktop

[application/x-sanchala-policy]
Recommended=sanchala-guardian.desktop;org.kde.kate.desktop
