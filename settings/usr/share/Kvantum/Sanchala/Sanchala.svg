<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="760">
  <defs>
    <!-- Sanchala Color Palette -->
    <linearGradient id="button-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F0F0"/>
      <stop offset="100%" style="stop-color:#E6E6E6"/>
    </linearGradient>
    <linearGradient id="button-hover" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFAFA"/>
      <stop offset="100%" style="stop-color:#F0F0F0"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3949AB"/>
      <stop offset="100%" style="stop-color:#303F9F"/>
    </linearGradient>
    <linearGradient id="progress-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3949AB"/>
      <stop offset="100%" style="stop-color:#536DFE"/>
    </linearGradient>
  </defs>
  
  <!-- PushButton normal -->
  <g id="PushButton-normal">
    <rect x="0" y="0" width="100" height="30" rx="8" fill="url(#button-gradient)" stroke="#E0E0E0"/>
  </g>
  
  <!-- PushButton hover -->
  <g id="PushButton-hover">
    <rect x="100" y="0" width="100" height="30" rx="8" fill="url(#button-hover)" stroke="#BDBDBD"/>
  </g>
  
  <!-- PushButton pressed -->
  <g id="PushButton-pressed">
    <rect x="200" y="0" width="100" height="30" rx="8" fill="#E0E0E0" stroke="#BDBDBD"/>
  </g>
  
  <!-- PushButton focus -->
  <g id="PushButton-focus">
    <rect x="300" y="0" width="100" height="30" rx="8" fill="url(#button-gradient)" stroke="#3949AB" stroke-width="2"/>
  </g>
  
  <!-- PushButton suggested -->
  <g id="PushButton-suggested">
    <rect x="400" y="0" width="100" height="30" rx="8" fill="url(#accent-gradient)" stroke="#1A237E"/>
  </g>
  
  <!-- LineEdit normal -->
  <g id="LineEdit-normal">
    <rect x="0" y="40" width="200" height="32" rx="8" fill="#FFFFFF" stroke="#E0E0E0"/>
  </g>
  
  <!-- LineEdit focus -->
  <g id="LineEdit-focus">
    <rect x="200" y="40" width="200" height="32" rx="8" fill="#FFFFFF" stroke="#3949AB" stroke-width="2"/>
  </g>
  
  <!-- ComboBox -->
  <g id="ComboBox-normal">
    <rect x="0" y="80" width="150" height="32" rx="8" fill="#FFFFFF" stroke="#E0E0E0"/>
  </g>
  
  <!-- CheckBox unchecked -->
  <g id="CheckBox-unchecked">
    <rect x="0" y="120" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>
  </g>
  
  <!-- CheckBox checked -->
  <g id="CheckBox-checked">
    <rect x="20" y="120" width="18" height="18" rx="4" fill="#3949AB" stroke="#3949AB"/>
    <path d="M24,129 L27,132 L34,125" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  </g>
  
  <!-- RadioButton unchecked -->
  <g id="RadioButton-unchecked">
    <circle cx="59" cy="129" r="9" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>
  </g>
  
  <!-- RadioButton checked -->
  <g id="RadioButton-checked">
    <circle cx="79" cy="129" r="9" fill="#3949AB" stroke="#3949AB"/>
    <circle cx="79" cy="129" r="4" fill="#FFFFFF"/>
  </g>
  
  <!-- ProgressBar trough -->
  <g id="ProgressBar-trough">
    <rect x="0" y="150" width="200" height="6" rx="3" fill="#E0E0E0"/>
  </g>
  
  <!-- ProgressBar progress -->
  <g id="ProgressBar-progress">
    <rect x="0" y="160" width="120" height="6" rx="3" fill="url(#progress-gradient)"/>
  </g>
  
  <!-- Slider trough -->
  <g id="Slider-trough">
    <rect x="0" y="180" width="200" height="6" rx="3" fill="#E0E0E0"/>
  </g>
  
  <!-- Slider handle -->
  <g id="Slider-handle">
    <circle cx="100" cy="183" r="10" fill="#FFFFFF" stroke="#E0E0E0"/>
  </g>
  
  <!-- ScrollBar groove -->
  <g id="ScrollBar-groove">
    <rect x="0" y="200" width="12" height="100" rx="6" fill="#F5F5F5"/>
  </g>
  
  <!-- ScrollBar slider -->
  <g id="ScrollBar-slider">
    <rect x="2" y="220" width="8" height="40" rx="4" fill="#BDBDBD"/>
  </g>
  
  <!-- TabBar tab -->
  <g id="TabBar-tab">
    <rect x="0" y="310" width="100" height="36" rx="8" ry="8" fill="#F5F5F5"/>
  </g>
  
  <!-- TabBar tab selected -->
  <g id="TabBar-tab-selected">
    <rect x="100" y="310" width="100" height="36" fill="#FFFFFF"/>
    <rect x="100" y="344" width="100" height="2" fill="#3949AB"/>
  </g>
  
  <!-- Menu background -->
  <g id="Menu-background">
    <rect x="0" y="360" width="200" height="150" rx="12" fill="#FFFFFF" stroke="#E0E0E0"/>
  </g>
  
  <!-- MenuItem hover -->
  <g id="MenuItem-hover">
    <rect x="4" y="364" width="192" height="32" rx="8" fill="#3949AB"/>
  </g>
  
  <!-- ToolTip -->
  <g id="ToolTip">
    <rect x="0" y="520" width="150" height="40" rx="8" fill="#FAFAFA" stroke="#E0E0E0"/>
  </g>
  
  <!-- Switch off -->
  <g id="Switch-off">
    <rect x="0" y="570" width="48" height="24" rx="12" fill="#BDBDBD"/>
    <circle cx="14" cy="582" r="10" fill="#FFFFFF"/>
  </g>
  
  <!-- Switch on -->
  <g id="Switch-on">
    <rect x="60" y="570" width="48" height="24" rx="12" fill="#3949AB"/>
    <circle cx="94" cy="582" r="10" fill="#FFFFFF"/>
  </g>
</svg>
