# Sanchala Cloud - Dolphin Integration
# Places panel configuration for cloud folders

[Places]
Name=Cloud
Name[id]=Cloud
Icon=folder-cloud
URL=file://$HOME/Cloud
IsSystemItem=true

[Google Drive]
Name=Google Drive
Icon=google-drive
URL=file://$HOME/Cloud/Google_Drive
Group=Cloud

[Dropbox]
Name=Dropbox
Icon=dropbox
URL=file://$HOME/Cloud/Dropbox
Group=Cloud

[OneDrive]
Name=OneDrive
Icon=onedrive
URL=file://$HOME/Cloud/OneDrive
Group=Cloud
