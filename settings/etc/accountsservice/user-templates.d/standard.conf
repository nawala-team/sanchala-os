# Sanchala OS - Standard User Template
# /etc/accountsservice/user-templates.d/standard.conf
# Default template for new user accounts

[User]
SystemAccount=false
IconFile=/usr/share/sanchala/avatars/default.png

[Template]
Name=Standard User
Description=Default user with balanced settings
ApplyOnCreate=true

[Sanchala]
UserType=standard
SecurityLevel=default
CanInstallApps=true
CanUseTerminal=true
CanChangeSettings=true

[Desktop]
DefaultSession=plasma
WallpaperPath=/usr/share/wallpapers/sanchala-default/
Theme=SanchalaBreeze
IconTheme=SanchalaPapirus
CursorTheme=breeze_cursors

[Privacy]
TelemetryEnabled=false
RecentFilesEnabled=true
LocationEnabled=ask
AnalyticsEnabled=false

[Applications]
DefaultBrowser=brave
DefaultFileManager=dolphin
DefaultTerminal=konsole
