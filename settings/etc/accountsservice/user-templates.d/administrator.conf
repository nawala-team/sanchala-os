# Sanchala OS - Administrator Template
# /etc/accountsservice/user-templates.d/administrator.conf

[User]
SystemAccount=false
IconFile=/usr/share/sanchala/avatars/admin.png

[Template]
Name=Administrator
Description=Full system access with security tools
ApplyOnCreate=true

[Sanchala]
UserType=administrator
SecurityLevel=elevated
CanInstallApps=true
CanUseTerminal=true
CanChangeSettings=true
CanManageUsers=true
CanAccessLogs=true

[Desktop]
DefaultSession=plasma
Theme=SanchalaDark
ShowSystemTools=true

[Security]
RequirePasswordForAdmin=true
SudoTimeout=15
AuditActions=true
