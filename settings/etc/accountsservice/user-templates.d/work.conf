# Sanchala OS - Work/Professional User Template
# /etc/accountsservice/user-templates.d/work.conf

[User]
SystemAccount=false
IconFile=/usr/share/sanchala/avatars/work.png

[Template]
Name=Work Profile
Description=Professional setup with productivity focus
ApplyOnCreate=true

[Sanchala]
UserType=standard
SecurityLevel=elevated
CanInstallApps=true
CanUseTerminal=true

[Desktop]
DefaultSession=plasma
Theme=SanchalaDark
PanelLayout=professional
EnableVirtualDesktops=true
VirtualDesktopCount=4

[Productivity]
FocusModeAvailable=true
NotificationSchedule=work_hours
CalendarIntegration=true

[Applications]
PreInstall=["libreoffice", "thunderbird", "nextcloud-client"]
PinToTaskbar=["dolphin", "firefox", "libreoffice-writer"]
