# Sanchala OS - Child User Template (Supervised)
# /etc/accountsservice/user-templates.d/child.conf

[User]
SystemAccount=false
IconFile=/usr/share/sanchala/avatars/child.png

[Template]
Name=Child Account
Description=Supervised account with parental controls
ApplyOnCreate=true
RequiresParentalSetup=true

[Sanchala]
UserType=child
SecurityLevel=restricted
CanInstallApps=false
CanUseTerminal=false
CanChangeSettings=false
ParentalControlsEnabled=true

[ParentalControls]
DefaultProfile=preteen
ScreenTimeEnabled=true
ContentFilterEnabled=true
ActivityTrackingEnabled=true

[Desktop]
DefaultSession=plasma
Theme=SanchalaLight
HideSystemApps=true
SimplifiedMenu=true

[Applications]
BlockedCategories=["admin", "development", "system"]
