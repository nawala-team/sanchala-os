# ============================================
# SANCHALA OS - NetworkManager Configuration
# ============================================
# Secure-by-default networking
# Privacy-first with MAC randomization
# ============================================

[main]
# Use plugins for managing connections
plugins=keyfile

# Systemd-resolved for DNS (enables DoH/DoT)
dns=systemd-resolved

# Hostname handling
hostname-mode=none

# Enable connectivity checking (privacy-respecting endpoint)
# Uses Arch Linux connectivity check by default
[connectivity]
uri=http://ping.archlinux.org/nm-check.txt
interval=300
response=NetworkManager is online

[device]
# Global WiFi settings - MAC randomization enabled
wifi.scan-rand-mac-address=yes

# Apply to all Ethernet devices
match-device=type:ethernet

[connection]
# Default connection settings
connection.llmnr=2
connection.mdns=2

# IPv6 privacy extensions (RFC 4941)
ipv6.ip6-privacy=2

# Stable privacy addressing for IPv6
ipv6.addr-gen-mode=stable-privacy

[logging]
# Moderate logging - increase to debug for troubleshooting
level=WARN
domains=ALL

[keyfile]
# Store connections with restrictive permissions
path=/etc/NetworkManager/system-connections
