# ============================================
# SANCHALA OS - Network Privacy Configuration
# ============================================
# MAC Address Randomization & Privacy Settings
# Part of Layer 8: Zero Trust Network
# ============================================

[device]
# Randomize MAC during WiFi scans (prevents tracking)
wifi.scan-rand-mac-address=yes

[connection]
# ----------------------------------------
# MAC Address Randomization
# ----------------------------------------
# Modes:
#   0 = Use permanent MAC (no privacy)
#   1 = Use random MAC per connection
#   2 = Use stable MAC per network (recommended)
# ----------------------------------------

# WiFi: Stable random MAC per network SSID
# This prevents cross-network tracking while maintaining
# consistent behavior on trusted networks
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=stable

# ----------------------------------------
# IPv6 Privacy Extensions (RFC 4941)
# ----------------------------------------
# 0 = Disabled
# 1 = Enabled, prefer public address
# 2 = Enabled, prefer temporary address (recommended)
# ----------------------------------------
ipv6.ip6-privacy=2

# ----------------------------------------
# IPv6 Address Generation
# ----------------------------------------
# stable-privacy = Stable addresses derived from network
# This prevents correlation across networks
# ----------------------------------------
ipv6.addr-gen-mode=stable-privacy

# ----------------------------------------
# Link-Local Multicast Name Resolution
# ----------------------------------------
# Disabled by default to prevent information leakage
# 0 = default, 1 = no, 2 = resolve, 3 = yes
# ----------------------------------------
connection.llmnr=1
connection.mdns=1

# ----------------------------------------
# Connection Stability
# ----------------------------------------
# Auto-reconnect with exponential backoff
connection.autoconnect-retries=3
