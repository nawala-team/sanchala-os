# ============================================
# SANCHALA OS - Network Security Configuration
# ============================================
# Hardened network security settings
# Part of Layer 8: Zero Trust Network
# ============================================

[main]
# Disable systemd-resolved fallback to prevent DNS leaks
systemd-resolved=true

# Disable autoconnect to open networks
no-auto-default=*

[connection]
# ----------------------------------------
# WiFi Security Defaults
# ----------------------------------------
# Require WPA2/WPA3 for all connections
# Open networks will prompt for confirmation
wifi-sec.key-mgmt=wpa-psk

# ----------------------------------------
# Timeout Settings
# ----------------------------------------
# Prevent hanging connections
connection.auth-retries=3

# ----------------------------------------
# Metered Connection Detection
# ----------------------------------------
# Auto-detect metered connections (mobile hotspots)
connection.metered=unknown

[device]
# ----------------------------------------
# Device Security
# ----------------------------------------
# Disable WiFi powersave to prevent deauth attacks
wifi.powersave=2

# Wake-on-WLAN disabled by default
wifi.wake-on-wlan=0x1

[ethernet]
# Wake-on-LAN: Disabled by default (security)
# Enable per-connection if needed
wake-on-lan=0

[wifi]
# Prefer 5GHz bands when available (less congested, harder to intercept)
band=a

# Background scan interval (seconds)
scan-rand-mac-address=yes
