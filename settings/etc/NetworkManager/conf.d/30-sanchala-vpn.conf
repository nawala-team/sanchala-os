# ============================================
# SANCHALA OS - VPN Integration Configuration
# ============================================
# WireGuard and OpenVPN integration
# Part of Layer 8: Zero Trust Network
# ============================================

[main]
# Enable VPN plugins
plugins=keyfile,ifcfg-rh

[connection]
# ----------------------------------------
# VPN Kill Switch Support
# ----------------------------------------
# When VPN is active, block all non-VPN traffic
# This is implemented via nftables rules
# See: /security/firewall/nftables-sanchala.conf

# ----------------------------------------
# DNS Handling with VPN
# ----------------------------------------
# Priority for VPN DNS servers
# Lower number = higher priority
ipv4.dns-priority=-100
ipv6.dns-priority=-100

# ----------------------------------------
# VPN Autoconnect
# ----------------------------------------
# VPN connections can be set to auto-connect
# when specific networks are detected
# See dispatcher scripts for implementation

[device]
# ----------------------------------------
# WireGuard Device Settings
# ----------------------------------------
# WireGuard interfaces are handled natively
# No special device configuration needed

[wireguard]
# IP forwarding for WireGuard
# Required for split-tunnel configurations
# ip4-auto-default-route=true
# ip6-auto-default-route=true
