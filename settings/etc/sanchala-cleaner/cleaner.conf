# Sanchala Cleaner Configuration
# /etc/sanchala-cleaner/cleaner.conf
# SPDX-License-Identifier: GPL-3.0

# ============================================
# AUTOMATIC CLEANUP
# ============================================
AUTO_CLEAN_ENABLED=true

# ============================================
# PACKAGE CACHE (paccache)
# ============================================
CLEAN_PACKAGE_CACHE=true
# Keep this many versions of each package
PACKAGE_CACHE_KEEP=2

# ============================================
# ORPHAN PACKAGES
# ============================================
CLEAN_ORPHANS=true

# ============================================
# SYSTEMD JOURNAL
# ============================================
CLEAN_JOURNAL=true
# Maximum journal size to keep
JOURNAL_MAX_SIZE="500M"
# Maximum age of journal entries
JOURNAL_MAX_AGE="30days"

# ============================================
# THUMBNAIL CACHE
# ============================================
CLEAN_THUMBNAILS=true
# Delete thumbnails older than (days)
THUMBNAIL_MAX_AGE=30

# ============================================
# TRASH
# ============================================
CLEAN_TRASH=true
# Delete trash items older than (days), 0 = all
TRASH_MAX_AGE=30

# ============================================
# DOWNLOADS FOLDER
# ============================================
# WARNING: Disabled by default for safety
CLEAN_DOWNLOADS=false
# Delete downloads older than (days)
DOWNLOADS_MAX_AGE=90

# ============================================
# BROWSER CACHE
# ============================================
CLEAN_BROWSER_CACHE=true
# Maximum cache age (days)
BROWSER_CACHE_MAX_AGE=7

# ============================================
# STORAGE OPTIMIZATION
# ============================================
# Disk usage percentage to trigger warnings
STORAGE_THRESHOLD=90

# ============================================
# BEHAVIOR
# ============================================
# Preview mode (no actual deletion)
DRY_RUN=false
# Ask for confirmation before cleanup
INTERACTIVE=true
