# ============================================
# SANCHALA OS - Bluetooth Audio Configuration
# ============================================
# High quality Bluetooth audio with codec support
# ============================================

context.modules = [
    # Bluetooth/BlueZ5 support
    { name = libpipewire-module-bluetooth-monitor
        args = { }
        flags = [ ifexists nofail ]
    }
]

# Bluetooth audio properties
bluez5.properties = {
    # Enable all roles
    bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source hfp_hf hfp_ag ]
    
    # Codec preferences (highest quality first)
    bluez5.codecs = [ ldac aac aptx_hd aptx sbc_xq sbc ]
    
    # Enable hardware volume
    bluez5.enable-hw-volume = true
    
    # Disable software volume for headsets
    bluez5.hfphsp-backend = native
    
    # Enable MSBC for HFP wideband
    bluez5.enable-msbc = true
    
    # Enable SBC XQ for better SBC quality
    bluez5.enable-sbc-xq = true
    
    # Auto-switch to headset profile for calls
    bluez5.autoswitch-profile = true
    
    # Media-specific settings
    bluez5.a2dp.ldac.quality = auto
    bluez5.a2dp.aac.bitratemode = 0
}

# Bluetooth device rules
bluez5.rules = [
    # AirPods and similar TWS earbuds
    {
        matches = [ { device.name = "~bluez_card.*AirPods*" } ]
        actions = {
            update-props = {
                bluez5.auto-connect = [ a2dp_sink ]
                bluez5.codecs = [ aac sbc ]
            }
        }
    }
    
    # Sony LDAC headphones
    {
        matches = [
            { device.name = "~bluez_card.*Sony*WH*" }
            { device.name = "~bluez_card.*Sony*WF*" }
        ]
        actions = {
            update-props = {
                bluez5.codecs = [ ldac aac sbc ]
                bluez5.a2dp.ldac.quality = hq
            }
        }
    }
    
    # Generic high-quality headphones (prefer aptX HD)
    {
        matches = [ { device.name = "~bluez_card.*" } ]
        actions = {
            update-props = {
                bluez5.codecs = [ ldac aptx_hd aptx aac sbc_xq sbc ]
            }
        }
    }
]
