# ============================================
# SANCHALA OS - ALSA Configuration
# ============================================
# Hardware audio device settings
# ============================================

# ALSA monitor configuration
context.objects = [
    # ALSA PCM device factory
    { factory = adapter
        args = {
            factory.name = api.alsa.pcm.source
            node.name = alsa-source
            node.description = "ALSA Source"
            media.class = Audio/Source
            api.alsa.path = "hw:0"
        }
        flags = [ nofail ]
    }
]

# ALSA stream properties
stream.properties = {
    # High quality resampling
    resample.quality = 10
    
    # Buffer settings for stability
    node.latency = 256/48000
    
    # ALSA period configuration
    api.alsa.period-size = 256
    api.alsa.period-num = 4
    api.alsa.headroom = 1024
    
    # Disable batch mode for lower latency
    api.alsa.disable-batch = false
    api.alsa.disable-tsched = false
    
    # Use mmap if available
    api.alsa.disable-mmap = false
    
    # Soft volume (can be disabled for bit-perfect)
    api.alsa.soft-mixer = true
    api.alsa.soft-volume = true
}

# UCM (Use Case Manager) for complex hardware
alsa.rules = [
    # USB audio class compliant devices - lower latency
    {
        matches = [ { api.alsa.card.driver = "USB-Audio" } ]
        actions = {
            update-props = {
                api.alsa.period-size = 128
                api.alsa.headroom = 512
            }
        }
    }
    
    # Intel HDA - conservative settings
    {
        matches = [ { api.alsa.card.driver = "snd_hda_intel" } ]
        actions = {
            update-props = {
                api.alsa.period-size = 256
                api.alsa.headroom = 1024
                api.alsa.disable-tsched = false
            }
        }
    }
    
    # AMD ACP - modern AMD audio
    {
        matches = [ { api.alsa.card.driver = "snd_acp*" } ]
        actions = {
            update-props = {
                api.alsa.period-size = 256
                api.alsa.headroom = 768
            }
        }
    }
    
    # Pro audio interfaces (common names)
    {
        matches = [
            { api.alsa.card.driver = "Focusrite*" }
            { api.alsa.card.driver = "Scarlett*" }
            { api.alsa.card.driver = "PreSonus*" }
            { api.alsa.card.driver = "MOTU*" }
            { api.alsa.card.driver = "RME*" }
            { api.alsa.card.driver = "Universal*Audio*" }
        ]
        actions = {
            update-props = {
                api.alsa.period-size = 64
                api.alsa.headroom = 256
                api.alsa.disable-batch = true
                session.suspend-timeout-seconds = 0
            }
        }
    }
]
