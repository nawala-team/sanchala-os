# ============================================
# SANCHALA OS - Low Latency Audio Configuration
# ============================================
# For gaming, music production, real-time audio
# ============================================

context.properties = {
    # Low latency quantum settings
    default.clock.quantum = 256
    default.clock.min-quantum = 32
    default.clock.max-quantum = 512
    
    # Sample rate
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 44100 48000 96000 ]
}

context.modules = [
    # Aggressive RT scheduling
    { name = libpipewire-module-rt
        args = {
            nice.level = -15
            rt.prio = 95
            rt.time.soft = 200000
            rt.time.hard = 200000
        }
        flags = [ ifexists nofail ]
    }
]
