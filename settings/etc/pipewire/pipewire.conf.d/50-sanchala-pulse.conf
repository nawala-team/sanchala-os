# ============================================
# SANCHALA OS - PulseAudio Compatibility
# ============================================
# PipeWire's PulseAudio replacement settings
# ============================================

context.exec = [
    # Start PulseAudio compatibility daemon
    { path = "pipewire-pulse" args = "" }
]

# PulseAudio server properties
pulse.properties = {
    # Server identification
    server.address = [ "unix:native" ]
    
    # Enable flat volumes (more intuitive)
    pulse.flat.volumes = false
    
    # Default sample spec
    pulse.default.req = 256/48000
    
    # Allow module loading
    pulse.modules.allow = true
}

# PulseAudio stream rules
pulse.rules = [
    # Media players - standard latency
    {
        matches = [
            { application.process.binary = "firefox" }
            { application.process.binary = "chromium" }
            { application.process.binary = "chrome" }
            { application.process.binary = "vlc" }
            { application.process.binary = "mpv" }
        ]
        actions = {
            update-props = {
                node.latency = 512/48000
                resample.quality = 7
            }
        }
    }
    
    # Voice/video calls - low latency
    {
        matches = [
            { application.process.binary = "discord" }
            { application.process.binary = "teams" }
            { application.process.binary = "zoom" }
            { application.process.binary = "skype" }
            { application.process.binary = "signal-desktop" }
            { application.process.binary = "telegram-desktop" }
        ]
        actions = {
            update-props = {
                node.latency = 128/48000
                resample.quality = 4
            }
        }
    }
    
    # Games - balanced latency
    {
        matches = [
            { application.process.binary = "~.*steam.*" }
            { application.process.binary = "~.*wine.*" }
            { application.process.binary = "~.*proton.*" }
            { media.role = "game" }
        ]
        actions = {
            update-props = {
                node.latency = 256/48000
                resample.quality = 4
            }
        }
    }
    
    # Music production apps - ultra low latency
    {
        matches = [
            { application.process.binary = "ardour*" }
            { application.process.binary = "bitwig*" }
            { application.process.binary = "reaper" }
            { application.process.binary = "lmms" }
            { application.process.binary = "audacity" }
            { application.process.binary = "carla*" }
            { application.name = "JACK*" }
        ]
        actions = {
            update-props = {
                node.latency = 64/48000
                resample.quality = 10
            }
        }
    }
    
    # System sounds - immediate response
    {
        matches = [
            { media.role = "event" }
            { media.role = "notification" }
        ]
        actions = {
            update-props = {
                node.latency = 128/48000
            }
        }
    }
]

# Volume restore rules
pulse.cmd = [
    # Load default sink/source modules
    { cmd = "load-module" args = "module-always-sink" flags = [ ] }
    { cmd = "load-module" args = "module-switch-on-connect" flags = [ ] }
]
