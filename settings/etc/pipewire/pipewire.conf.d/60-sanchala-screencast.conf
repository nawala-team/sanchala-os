# ============================================
# SANCHALA OS - Screen Recording/Capture
# ============================================
# PipeWire portal for screen sharing
# ============================================

# Screen capture module
context.modules = [
    # Portal module for screen sharing
    { name = libpipewire-module-portal
        flags = [ ifexists nofail ]
    }
]

# V4L2 loopback for virtual cameras
v4l2.properties = {
    # Enable V4L2 source
    v4l2.monitor = true
    
    # V4L2 loopback support
    v4l2.loopback.enable = true
}

# Screen capture properties
screencast.properties = {
    # Default capture resolution
    node.rate = 60/1
    
    # Capture with GPU (DMA-BUF)
    screencast.enable-dmabuf = true
    
    # Cursor handling
    screencast.cursor.mode = embedded
    
    # Restore mode
    screencast.restore.mode = auto
}

# Portal rules for apps
portal.rules = [
    # OBS Studio - high quality capture
    {
        matches = [
            { application.process.binary = "obs" }
            { application.process.binary = "obs-studio" }
        ]
        actions = {
            update-props = {
                screencast.enable-dmabuf = true
                node.rate = 60/1
            }
        }
    }
    
    # Video conferencing - balanced quality
    {
        matches = [
            { application.process.binary = "zoom" }
            { application.process.binary = "teams" }
            { application.process.binary = "discord" }
            { application.process.binary = "firefox" }
            { application.process.binary = "chromium" }
        ]
        actions = {
            update-props = {
                screencast.enable-dmabuf = true
                node.rate = 30/1
            }
        }
    }
    
    # KDE Spectacle screenshot tool
    {
        matches = [
            { application.process.binary = "spectacle" }
        ]
        actions = {
            update-props = {
                screencast.enable-dmabuf = true
            }
        }
    }
]
