# ============================================
# SANCHALA OS - Pro Audio Configuration
# ============================================
# Ultra-low latency for music production
# Activate with: sanchala-audio-mode pro
# ============================================

# Pro audio context properties
context.properties = {
    # Pro audio sample rates
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
    
    # Ultra-low latency quantum
    # 64 samples @ 48kHz = 1.33ms latency
    default.clock.quantum = 64
    default.clock.min-quantum = 16
    default.clock.max-quantum = 1024
    
    # Strict timing
    default.clock.quantum-floor = 16
}

# ALSA node properties for pro audio
stream.properties = {
    # Disable resampling where possible
    resample.disable = false
    resample.quality = 10
    
    # Channel mixing
    channelmix.disable = false
    channelmix.normalize = false
    channelmix.mix-lfe = false
    
    # Dither for high quality conversion
    dither.noise = 0
    dither.method = wannamaker3
    
    # Session management
    node.latency = 64/48000
    node.lock-quantum = true
}

# ALSA device settings
alsa.properties = {
    # Use ALSA period/buffer for timing
    alsa.period-size = 64
    alsa.buffer-size = 256
    alsa.headroom = 0
    
    # Disable software mixing in ALSA
    alsa.disable-mmap = false
    alsa.disable-batch = false
    
    # Hardware timestamping
    api.alsa.use-hw-volume = true
    api.alsa.use-hw-params = true
    api.alsa.soft-mixer = false
}

# JACK compatibility properties
jack.properties = {
    # JACK server name
    jack.server-name = default
    
    # JACK transport
    jack.show-monitor = true
    jack.merge-monitor = false
    jack.show-midi = true
    jack.short-name = false
    jack.filter-name = false
    
    # Promiscuous JACK mode
    jack.promiscuous-mode = true
    
    # Lock to quantum
    jack.locked-process = true
    jack.default-as-system = true
}

# Real-time priority for pro audio
context.modules = [
    { name = libpipewire-module-rt
        args = {
            nice.level = -19
            rt.prio = 95
            rt.time.soft = 2000000
            rt.time.hard = 2000000
        }
        flags = [ ifexists nofail ]
    }
]
