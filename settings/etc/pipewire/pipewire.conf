# ============================================
# SANCHALA OS - PipeWire Master Configuration
# ============================================
# High-quality audio processing pipeline
# Optimized for low latency and best quality
# ============================================

context.properties = {
    # Core settings
    core.daemon = true
    core.name = pipewire-sanchala
    
    # Memory settings
    mem.allow-mlock = true
    mem.mlock-all = false
    
    # Support settings
    support.dbus = true
    
    # Link settings  
    link.max-buffers = 16
    
    # Clock settings for sync
    clock.power-of-two-quantum = true
    
    # Default audio settings (high quality)
    default.clock.rate = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
    default.clock.quantum = 1024
    default.clock.min-quantum = 32
    default.clock.max-quantum = 2048
    
    # Video settings (for screen sharing, etc.)
    default.video.width = 1920
    default.video.height = 1080
    default.video.rate.num = 60
    default.video.rate.denom = 1
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    avb.* = avb/libspa-avb
    api.alsa.* = alsa/libspa-alsa
    api.v4l2.* = v4l2/libspa-v4l2
    api.libcamera.* = libcamera/libspa-libcamera
    api.bluez5.* = bluez5/libspa-bluez5
    api.vulkan.* = vulkan/libspa-vulkan
    api.jack.* = jack/libspa-jack
    support.* = support/libspa-support
}

context.modules = [
    # Real-time kit for priority
    { name = libpipewire-module-rt
        args = {
            nice.level = -11
            rt.prio = 88
            rt.time.soft = -1
            rt.time.hard = -1
        }
        flags = [ ifexists nofail ]
    }
    
    # Protocol for local connections
    { name = libpipewire-module-protocol-native }
    
    # Profiler for performance monitoring
    { name = libpipewire-module-profiler }
    
    # Metadata storage
    { name = libpipewire-module-metadata }
    
    # SPA device and node factories
    { name = libpipewire-module-spa-device-factory }
    { name = libpipewire-module-spa-node-factory }
    
    # Client support
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-client-device }
    
    # Portal for sandboxed applications
    { name = libpipewire-module-portal
        flags = [ ifexists nofail ]
    }
    
    # Access control
    { name = libpipewire-module-access
        args = {
            access.allowed = [ audio video ]
            access.force = flatpak
        }
    }
    
    # Adapter for format conversion
    { name = libpipewire-module-adapter }
    
    # Link factory
    { name = libpipewire-module-link-factory }
    
    # Session manager support
    { name = libpipewire-module-session-manager }
    
    # Filter chain for EQ/effects
    { name = libpipewire-module-filter-chain
        flags = [ ifexists nofail ]
    }
    
    # Echo cancellation
    { name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            aec.args = {
                webrtc.gain_control = true
                webrtc.extended_filter = true
            }
            capture.props = {
                node.name = "Echo Cancellation Capture"
            }
            playback.props = {
                node.name = "Echo Cancellation Playback"
            }
        }
        flags = [ ifexists nofail ]
    }
]

context.objects = [
    # Null sink for audio routing
    { factory = spa-node-factory
        args = {
            factory.name = support.null-audio-sink
            node.name = "Sanchala-Null-Sink"
            node.description = "Null Output"
            media.class = "Audio/Sink"
            audio.position = [ FL FR ]
        }
    }
    
    # Default audio properties
    { factory = spa-node-factory
        args = {
            factory.name = support.node.driver
            node.name = "Sanchala-Audio-Driver"
            priority.driver = 20000
        }
    }
]

context.exec = [
    # Start WirePlumber session manager
    { path = "/usr/bin/wireplumber" args = "" }
]
