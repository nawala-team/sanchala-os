# ============================================
# SANCHALA OS - PipeWire Pulse Configuration
# ============================================
# PulseAudio compatibility layer
# Drop-in replacement with enhanced features
# ============================================

context.properties = {
    # Server name for PA clients
    server.address = [ "unix:native" ]
}

context.modules = [
    { name = libpipewire-module-rt
        args = {
            nice.level = -11
            rt.prio = 88
        }
        flags = [ ifexists nofail ]
    }
    
    { name = libpipewire-module-protocol-native }
    
    # PulseAudio protocol server
    { name = libpipewire-module-protocol-pulse
        args = {
            # Pulse server properties
            server.address = [
                "unix:native"
                "unix:/tmp/pulse-sanchala"
            ]
            
            # Virtual streams
            pulse.min.req = 128/48000
            pulse.default.req = 960/48000
            pulse.min.frag = 128/48000
            pulse.default.frag = 96000/48000
            pulse.default.tlength = 96000/48000
            pulse.min.quantum = 128/48000
        }
    }
]

# Stream properties for Pulse clients
stream.properties = {
    # Restore stream properties
    restore.props = true
    restore.target = true
    
    # Channel map
    channelmap = [ FL FR ]
    
    # Media properties
    media.type = Audio
    media.category = Playback
}

# Pulse-specific rules
pulse.rules = [
    # Match all Pulse clients
    {
        matches = [
            { client.name = "~.*" }
        ]
        actions = {
            update-props = {
                # Enable echo cancellation for voice apps
                pulse.echo-cancel = false
            }
        }
    }
    
    # Voice applications - enable echo cancel
    {
        matches = [
            { application.name = "~.*zoom.*" }
            { application.name = "~.*discord.*" }
            { application.name = "~.*teams.*" }
            { application.name = "~.*skype.*" }
        ]
        actions = {
            update-props = {
                pulse.echo-cancel = true
            }
        }
    }
    
    # Firefox - handle media properly
    {
        matches = [
            { application.name = "Firefox" }
            { application.process.binary = "firefox" }
        ]
        actions = {
            update-props = {
                pulse.idle-timeout = 3
            }
        }
    }
    
    # Music players - no auto-cork
    {
        matches = [
            { application.name = "~.*spotify.*" }
            { application.name = "~.*vlc.*" }
            { application.name = "~.*rhythmbox.*" }
        ]
        actions = {
            update-props = {
                pulse.auto-cork = false
            }
        }
    }
]
