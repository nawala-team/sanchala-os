# ============================================
# SANCHALA OS - PipeWire Filter Chain for EQ
# ============================================
# System-wide parametric EQ using filter-chain
# Loaded by default, user can enable/disable
# ============================================

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Sanchala Equalizer"
            media.name = "Sanchala Equalizer"
            filter.graph = {
                nodes = [
                    {
                        type = builtin
                        name = eq_band_1
                        label = bq_lowshelf
                        control = { "Freq" = 60.0 "Q" = 0.7 "Gain" = 0.0 }
                    }
                    {
                        type = builtin
                        name = eq_band_2
                        label = bq_peaking
                        control = { "Freq" = 150.0 "Q" = 1.0 "Gain" = 0.0 }
                    }
                    {
                        type = builtin
                        name = eq_band_3
                        label = bq_peaking
                        control = { "Freq" = 400.0 "Q" = 1.0 "Gain" = 0.0 }
                    }
                    {
                        type = builtin
                        name = eq_band_4
                        label = bq_peaking
                        control = { "Freq" = 1000.0 "Q" = 1.0 "Gain" = 0.0 }
                    }
                    {
                        type = builtin
                        name = eq_band_5
                        label = bq_peaking
                        control = { "Freq" = 2500.0 "Q" = 1.0 "Gain" = 0.0 }
                    }
                    {
                        type = builtin
                        name = eq_band_6
                        label = bq_peaking
                        control = { "Freq" = 6000.0 "Q" = 1.0 "Gain" = 0.0 }
                    }
                    {
                        type = builtin
                        name = eq_band_7
                        label = bq_highshelf
                        control = { "Freq" = 12000.0 "Q" = 0.7 "Gain" = 0.0 }
                    }
                ]
                links = [
                    { output = "eq_band_1:Out" input = "eq_band_2:In" }
                    { output = "eq_band_2:Out" input = "eq_band_3:In" }
                    { output = "eq_band_3:Out" input = "eq_band_4:In" }
                    { output = "eq_band_4:Out" input = "eq_band_5:In" }
                    { output = "eq_band_5:Out" input = "eq_band_6:In" }
                    { output = "eq_band_6:Out" input = "eq_band_7:In" }
                ]
            }
            capture.props = {
                node.name = "sanchala_eq_capture"
                media.class = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name = "sanchala_eq_playback"
                node.passive = true
                audio.channels = 2
                audio.position = [ FL FR ]
            }
        }
    }
]
