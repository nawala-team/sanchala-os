# ============================================
# SANCHALA OS - aria2 Download Manager Config
# ============================================
# High-performance download accelerator
# ============================================

# ===========================================
# Basic Settings
# ===========================================
# Download directory
dir=${HOME}/Downloads

# Disk cache (reduce disk I/O)
disk-cache=64M

# File allocation (faster on ext4/btrfs)
file-allocation=falloc

# Continue downloads
continue=true

# ===========================================
# Connection Settings
# ===========================================
# Max concurrent downloads
max-concurrent-downloads=5

# Connections per server (per file)
max-connection-per-server=16

# Split file into segments
split=16

# Minimum split size
min-split-size=10M

# Max overall download speed (0 = unlimited)
max-overall-download-limit=0

# Max download speed per file (0 = unlimited)
max-download-limit=0

# Max overall upload speed (for torrents)
max-overall-upload-limit=100K

# ===========================================
# Retry Settings
# ===========================================
# Max retries (0 = unlimited)
max-tries=5

# Retry wait time (seconds)
retry-wait=30

# Timeout settings
connect-timeout=60
timeout=60

# ===========================================
# HTTP/FTP Settings
# ===========================================
# User agent (avoid blocks)
user-agent=Mozilla/5.0 (X11; Linux x86_64; rv:120.0) Gecko/20100101 Firefox/120.0

# Enable HTTP pipelining
enable-http-pipelining=true

# HTTP accept gzip
http-accept-gzip=true

# Check SSL certificates
check-certificate=true

# ===========================================
# BitTorrent Settings
# ===========================================
# Enable DHT (IPv4)
enable-dht=true

# Enable DHT (IPv6)
enable-dht6=true

# DHT listen port
dht-listen-port=6881-6999

# Listen port for BitTorrent
listen-port=6881-6999

# Enable Peer Exchange
enable-peer-exchange=true

# Enable Local Peer Discovery
bt-enable-lpd=true

# Require encryption
bt-require-crypto=true

# Seed ratio (stop seeding after this ratio)
seed-ratio=1.0

# Seed time (minutes, 0 = seed forever until ratio)
seed-time=60

# Max peers per torrent
bt-max-peers=100

# ===========================================
# Metalink Settings
# ===========================================
# Follow metalink
follow-metalink=true

# Metalink preferred protocol
metalink-preferred-protocol=https

# ===========================================
# RPC Settings (for GUI integration)
# ===========================================
# Enable RPC
enable-rpc=true

# RPC listen port
rpc-listen-port=6800

# Listen on all interfaces (localhost only for security)
rpc-listen-all=false

# RPC secret token (change this!)
rpc-secret=sanchala_aria2_secret

# Allow origin (for web interfaces)
rpc-allow-origin-all=false

# Max request size
rpc-max-request-size=10M

# ===========================================
# Session Management
# ===========================================
# Session file (resume downloads on restart)
input-file=${HOME}/.config/aria2/session.txt
save-session=${HOME}/.config/aria2/session.txt

# Save session interval (seconds)
save-session-interval=60

# ===========================================
# Logging
# ===========================================
# Log file
log=${HOME}/.config/aria2/aria2.log

# Log level (debug, info, notice, warn, error)
log-level=notice

# Console output level
console-log-level=notice

# ===========================================
# Advanced Settings
# ===========================================
# Force save (save control file even if download is complete)
force-save=false

# Auto file renaming
auto-file-renaming=true

# Allow overwrite
allow-overwrite=false

# Always resume (try to resume even if server doesn't support it)
always-resume=true

# Async DNS
async-dns=true

# Conditional GET (use timestamps)
conditional-get=true

# Remote time (use server's timestamp)
remote-time=true

# ===========================================
# Bandwidth Scheduling (via systemd timer)
# ===========================================
# These are baseline settings. Use sanchala-bandwidth-scheduler
# for time-based bandwidth management.

# ===========================================
# Privacy Settings
# ===========================================
# Disable tracking
bt-tracker=

# Use proxy if configured system-wide
# all-proxy=
# all-proxy-user=
# all-proxy-passwd=

# No referrer
referer=
