<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- ============================================
     SANCHALA OS - Arabic Font Configuration
     Location: /etc/fonts/conf.d/65-sanchala-arabic.conf
     ============================================ -->
<fontconfig>

  <!-- Arabic language -->
  <match>
    <test name="lang" compare="contains">
      <string>ar</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Naskh Arabic</string>
      <string>Noto Sans Arabic</string>
    </edit>
  </match>

  <!-- Persian/Farsi -->
  <match>
    <test name="lang" compare="contains">
      <string>fa</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Naskh Arabic</string>
      <string>Noto Sans Arabic</string>
    </edit>
  </match>

  <!-- Urdu -->
  <match>
    <test name="lang" compare="contains">
      <string>ur</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Nastaliq Urdu</string>
      <string>Noto Naskh Arabic</string>
    </edit>
  </match>

  <!-- Hebrew -->
  <match>
    <test name="lang" compare="contains">
      <string>he</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Sans Hebrew</string>
      <string>Noto Serif Hebrew</string>
    </edit>
  </match>

</fontconfig>
