<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- ============================================
     SANCHALA OS - CJK Font Configuration
     Location: /etc/fonts/conf.d/64-sanchala-cjk.conf
     ============================================ -->
<fontconfig>

  <!-- Japanese: prefer JP variant -->
  <match>
    <test name="lang" compare="contains">
      <string>ja</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>

  <!-- Korean: prefer KR variant -->
  <match>
    <test name="lang" compare="contains">
      <string>ko</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Sans CJK KR</string>
    </edit>
  </match>

  <!-- Simplified Chinese: prefer SC variant -->
  <match>
    <test name="lang" compare="contains">
      <string>zh-CN</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  
  <match>
    <test name="lang" compare="contains">
      <string>zh-Hans</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <!-- Traditional Chinese: prefer TC variant -->
  <match>
    <test name="lang" compare="contains">
      <string>zh-TW</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>
  
  <match>
    <test name="lang" compare="contains">
      <string>zh-Hant</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>

  <!-- Hong Kong Chinese: prefer HK variant -->
  <match>
    <test name="lang" compare="contains">
      <string>zh-HK</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Sans CJK HK</string>
    </edit>
  </match>

</fontconfig>
