<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- ============================================
     SANCHALA OS - Default Font Configuration
     Location: /etc/fonts/conf.d/60-sanchala-defaults.conf
     ============================================ -->
<fontconfig>

  <!-- Default sans-serif fallback chain -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans Arabic</family>
      <family>Noto Sans Hebrew</family>
      <family>Noto Sans Devanagari</family>
      <family>Noto Sans Thai</family>
      <family>Noto Sans Bengali</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <!-- Default serif fallback chain -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif CJK SC</family>
      <family>Noto Naskh Arabic</family>
      <family>Noto Serif Hebrew</family>
      <family>Noto Serif Devanagari</family>
      <family>DejaVu Serif</family>
    </prefer>
  </alias>

  <!-- Default monospace fallback chain -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>Fira Code</family>
      <family>Noto Sans Mono</family>
      <family>Noto Sans Mono CJK SC</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>

  <!-- System UI font -->
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

</fontconfig>
