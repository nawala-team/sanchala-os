<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- ============================================
     SANCHALA OS - Font Rendering Configuration
     Location: /etc/fonts/conf.d/10-sanchala-rendering.conf
     ============================================ -->
<fontconfig>

  <!-- Global rendering defaults -->
  <match target="font">
    <!-- Enable antialiasing -->
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
    
    <!-- Enable hinting -->
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    
    <!-- Use slight hinting for best balance -->
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
    
    <!-- Subpixel rendering for LCD -->
    <edit name="rgba" mode="assign">
      <const>rgb</const>
    </edit>
    
    <!-- LCD filter -->
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>
  </match>

  <!-- Disable embedded bitmaps in scalable fonts -->
  <match target="font">
    <edit name="embeddedbitmap" mode="assign">
      <bool>false</bool>
    </edit>
  </match>

  <!-- Enable autohinter for fonts without good hints -->
  <match target="font">
    <test name="family" qual="any">
      <string>Noto Sans CJK</string>
    </test>
    <edit name="autohint" mode="assign">
      <bool>true</bool>
    </edit>
  </match>

</fontconfig>
