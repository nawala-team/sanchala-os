<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- ============================================
     SANCHALA OS - Indic Scripts Configuration
     Location: /etc/fonts/conf.d/66-sanchala-indic.conf
     ============================================ -->
<fontconfig>

  <!-- Hindi (Devanagari) -->
  <match>
    <test name="lang" compare="contains">
      <string>hi</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Sans Devanagari</string>
    </edit>
  </match>

  <!-- Bengali -->
  <match>
    <test name="lang" compare="contains">
      <string>bn</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Sans Bengali</string>
    </edit>
  </match>

  <!-- Tamil -->
  <match>
    <test name="lang" compare="contains">
      <string>ta</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Sans Tamil</string>
    </edit>
  </match>

  <!-- Telugu -->
  <match>
    <test name="lang" compare="contains">
      <string>te</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Sans Telugu</string>
    </edit>
  </match>

  <!-- Malayalam -->
  <match>
    <test name="lang" compare="contains">
      <string>ml</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Sans Malayalam</string>
    </edit>
  </match>

  <!-- Kannada -->
  <match>
    <test name="lang" compare="contains">
      <string>kn</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Sans Kannada</string>
    </edit>
  </match>

  <!-- Gujarati -->
  <match>
    <test name="lang" compare="contains">
      <string>gu</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Sans Gujarati</string>
    </edit>
  </match>

  <!-- Thai -->
  <match>
    <test name="lang" compare="contains">
      <string>th</string>
    </test>
    <edit name="family" mode="prepend">
      <string>Noto Sans Thai</string>
    </edit>
  </match>

</fontconfig>
