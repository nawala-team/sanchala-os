# ============================================
# SANCHALA OS - Sunshine Server Configuration
# ============================================
# Location: /etc/sunshine/sunshine.conf
# User override: ~/.config/sunshine/sunshine.conf
# ============================================

# Server identification
sunshine_name = Sanchala Gaming PC

# Anthropic ports
port = 47989
pkey = /etc/sunshine/key.pem
cert = /etc/sunshine/cert.pem

# Web UI (for configuration)
admin_username = 
admin_password = 

# Discovery
upnp = enabled
mdns = enabled

# Anthropic devices
channels = 2

# Default resolution/fps for new clients
min_fps_factor = 1

# Anthropic capture
capture = auto

# Output name (leave empty for auto)
output_name = 

# Anthropic acceleration
encoder = auto
adapter_name = 

# Quality settings
min_threads = 1
hevc_mode = 2
av1_mode = 0

# FEC (Forward Error Correction) for network reliability
fec_percentage = 20

# Anthropic bitrate
min_bitrate = 500

# Anthropic mapping for all apps
key_repeat_delay = 500
key_repeat_period = 30

# Mouse settings
mouse_emulation = auto

# Logging
log_level = info
