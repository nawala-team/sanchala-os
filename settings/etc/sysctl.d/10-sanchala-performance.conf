# ============================================================================
# SANCHALA OS - Performance Sysctl Configuration
# ============================================================================
# Version: 1.0 | Target: <3s boot, responsive desktop
# Priority: 10 (loaded early, can be overridden)
# ============================================================================

# ============================================================================
# VIRTUAL MEMORY - Optimized for Desktop Responsiveness
# ============================================================================

# Swappiness: How aggressively kernel swaps memory pages
# Lower = prefer keeping apps in RAM, higher = more aggressive swap
# Default: 60, Desktop optimal: 10-20 (keeps apps snappy)
vm.swappiness = 10

# VFS cache pressure: How aggressively kernel reclaims dentries/inodes
# Lower = keep filesystem cache longer (good for repeated file access)
# Default: 100, Desktop: 50 (balance between RAM for apps and cache)
vm.vfs_cache_pressure = 50

# Dirty page writeback thresholds
# dirty_ratio: % of RAM that can be dirty before forced writeback
# dirty_background_ratio: % where background writeback starts
# Lower values = more frequent small writes (better for responsiveness)
# Higher values = larger batched writes (better for throughput)
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Writeback timing (centiseconds)
# dirty_expire_centisecs: Age after which dirty data is eligible for writeback
# dirty_writeback_centisecs: Interval between writeback daemon wakeups
vm.dirty_expire_centisecs = 1500
vm.dirty_writeback_centisecs = 500

# Memory overcommit behavior
# 0 = heuristic (default), 1 = always, 2 = never
# Keep default heuristic for desktop workloads
vm.overcommit_memory = 0

# Minimum free memory (KB) before reclaim starts aggressively
# Prevents system from becoming unresponsive under memory pressure
vm.min_free_kbytes = 65536

# Watermark scale factor (0.1% units)
# Higher = more aggressive memory reclaim (prevents OOM)
vm.watermark_scale_factor = 200

# Page-cluster: Pages read ahead during swap-in
# Lower = faster swap response, higher = better throughput
vm.page-cluster = 0

# Compact memory proactively to reduce fragmentation
vm.compaction_proactiveness = 20

# ============================================================================
# KERNEL - Responsiveness & Scheduling
# ============================================================================

# Disable kernel.nmi_watchdog for power savings (re-enable for debugging)
kernel.nmi_watchdog = 0

# Sched_autogroup: Automatic process grouping for desktop responsiveness
# Ensures one busy process doesn't starve others (great for desktop)
kernel.sched_autogroup_enabled = 1

# Maximum number of watched files (for IDEs, file managers)
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
fs.inotify.max_queued_events = 32768

# File handle limits
fs.file-max = 2097152

# ============================================================================
# NETWORK - Low Latency & Desktop Use
# ============================================================================

# TCP buffer sizes (min, default, max) for better throughput
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.ipv4.tcp_rmem = 4096 1048576 16777216
net.ipv4.tcp_wmem = 4096 1048576 16777216

# Connection handling
net.core.somaxconn = 8192
net.core.netdev_max_backlog = 16384

# TCP optimizations
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1

# ============================================================================
# SECURITY (Maintained from hardened kernel philosophy)
# ============================================================================

# Restrict kernel pointer exposure
kernel.kptr_restrict = 2

# Restrict dmesg access
kernel.dmesg_restrict = 1

# Restrict unprivileged BPF
kernel.unprivileged_bpf_disabled = 1

# Enable BPF JIT hardening
net.core.bpf_jit_harden = 2

# ASLR fully enabled
kernel.randomize_va_space = 2

# Restrict ptrace scope (Yama LSM)
kernel.yama.ptrace_scope = 1

# Restrict kernel profiling
kernel.perf_event_paranoid = 3

# SysRq: Allow only sync,remount-ro,reboot (safer subset)
kernel.sysrq = 176
