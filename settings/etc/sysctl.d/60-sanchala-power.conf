# ============================================================================
# SANCHALA OS - Power-Related Kernel Parameters
# ============================================================================
# Version: 1.0 | Kernel-level power optimizations
# Location: /etc/sysctl.d/60-sanchala-power.conf
# ============================================================================

# ============================================================================
# VIRTUAL MEMORY - REDUCE DISK WRITES
# ============================================================================

# Reduce swap usage (keep more in RAM, less disk I/O)
vm.swappiness=10

# How long dirty pages stay in memory before write (centiseconds)
# Higher values = fewer writes = better battery
vm.dirty_writeback_centisecs=6000

# Percentage of memory that can be dirty before writes start
vm.dirty_ratio=20
vm.dirty_background_ratio=5

# Laptop mode - delay writes when on battery
vm.laptop_mode=5

# ============================================================================
# KERNEL SCHEDULING
# ============================================================================

# Enable power-aware scheduling
# Keeps processes on same CPU to allow other CPUs to sleep
kernel.sched_energy_aware=1

# Reduce timer frequency impact
kernel.timer_migration=0

# ============================================================================
# NETWORK POWER SAVING
# ============================================================================

# Reduce network interface polling
net.core.netdev_budget=300
net.core.netdev_budget_usecs=2000

# ============================================================================
# NMI WATCHDOG (DISABLE FOR POWER SAVING)
# ============================================================================

# Disable NMI watchdog (saves ~1W)
kernel.nmi_watchdog=0

# ============================================================================
# AUDIO POWER SAVING
# ============================================================================

# Handled by TLP/module params, but backup setting
# Controlled via: /sys/module/snd_hda_intel/parameters/power_save
