# ============================================
# SANCHALA OS - Gaming Kernel Parameters
# ============================================
# Location: /etc/sysctl.d/99-sanchala-gaming.conf
# ============================================

# Reduce swappiness for gaming (keep more in RAM)
vm.swappiness = 10

# Increase inotify watches (for large game libraries)
fs.inotify.max_user_watches = 524288

# Network optimizations for game streaming
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# Reduce network latency
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_slow_start_after_idle = 0

# Process scheduling (helps with game responsiveness)
kernel.sched_autogroup_enabled = 0
