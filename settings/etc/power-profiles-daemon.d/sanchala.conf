# ============================================================================
# SANCHALA OS - Power Profiles Daemon Configuration
# ============================================================================
# Version: 1.0 | Integration with GNOME/KDE power profiles
# Location: /etc/power-profiles-daemon.d/sanchala.conf
# ============================================================================
# 
# power-profiles-daemon provides three profiles:
# - power-saver: Maximum battery life
# - balanced: Default, good mix of performance and efficiency
# - performance: Maximum performance, higher power consumption
#
# KDE Plasma and GNOME integrate with this daemon automatically
# ============================================================================

[Daemon]
# Default profile when no user preference is set
DefaultProfile=balanced

# Automatically switch to power-saver on battery
AutoPowerSaver=true

# Threshold for auto power-saver (percentage)
AutoPowerSaverThreshold=20

# ============================================================================
# POWER-SAVER PROFILE
# ============================================================================
[Profile power-saver]
# CPU governor
Driver=platform_profile
PlatformProfile=low-power

# Additional tuning
CpuBoost=false
EnergyPerformancePreference=power

# ============================================================================
# BALANCED PROFILE
# ============================================================================
[Profile balanced]
Driver=platform_profile
PlatformProfile=balanced

CpuBoost=true
EnergyPerformancePreference=balance_power

# ============================================================================
# PERFORMANCE PROFILE
# ============================================================================
[Profile performance]
Driver=platform_profile
PlatformProfile=performance

CpuBoost=true
EnergyPerformancePreference=balance_performance
