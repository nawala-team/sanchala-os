# ============================================================================
# SANCHALA OS - CUPS Browsed Configuration
# ============================================================================
# Location: /etc/cups/cups-browsed.conf
# Purpose: Automatic network printer discovery and setup
# ============================================================================

# ===========================================
# Browsing Protocols
# ===========================================
# Enable mDNS/DNS-SD discovery (Bonjour/Avahi)
BrowseRemoteProtocols dnssd cups

# Local protocol for sharing
BrowseLocalProtocols dnssd

# ===========================================
# Polling (for CUPS servers without broadcasting)
# ===========================================
# Uncomment to poll specific servers
# BrowsePoll cups-server.local:631

# ===========================================
# Automatic Queue Creation
# ===========================================
# Create local queues for discovered printers
CreateIPPPrinterQueues All
CreateRemoteCUPSPrinterQueues Yes

# How long to wait before creating queue (seconds)
CreateRemoteRawPrinterQueues No

# ===========================================
# Queue Naming
# ===========================================
# Use printer's DNS-SD name
LocalQueueNamingRemoteCUPS RemoteName

# ===========================================
# Load Balancing (Implicit Classes)
# ===========================================
# Combine identical printers into one queue
AutoClustering No

# ===========================================
# Default Options
# ===========================================
# Apply these options to all auto-created queues
# DefaultOptions "media=A4 sides=two-sided-long-edge"

# ===========================================
# Filtering
# ===========================================
# Only discover printers on local network
BrowseFilter type CUPS
BrowseFilter type IPP
BrowseFilter type IPPS

# Ignore certain printers by name (regex)
# BrowseDeny printer-name regex "^HPFAX"

# ===========================================
# Timeouts
# ===========================================
# Remove queue if printer disappears (seconds)
BrowseTimeout 300

# ===========================================
# IPP Printer Options
# ===========================================
# Use driverless printing when possible
IPPPrinterQueueType Driverless

# ===========================================
# Debugging
# ===========================================
DebugLogging file
LogDir /var/log/cups
