# ============================================================================
# SANCHALA OS - CUPS Print Server Configuration
# ============================================================================
# Location: /etc/cups/cupsd.conf
# Purpose: Secure, user-friendly printing with network discovery
# ============================================================================

# ===========================================
# Server Identity
# ===========================================
ServerName localhost
ServerAdmin root@localhost

# ===========================================
# Network Listening
# ===========================================
# Listen on localhost for security (change for network sharing)
Listen localhost:631
Listen /run/cups/cups.sock

# ===========================================
# Browsing & Discovery
# ===========================================
# Enable automatic printer discovery
Browsing Yes
BrowseLocalProtocols dnssd

# Share printers on local network (disabled by default for privacy)
# Uncomment to enable network sharing
# BrowseWebIF Yes
# BrowseRemoteProtocols dnssd

# ===========================================
# Web Interface
# ===========================================
WebInterface Yes

# ===========================================
# Security Settings
# ===========================================
# Default authentication type
DefaultAuthType Basic

# Encryption policy
DefaultEncryption IfRequested

# ===========================================
# Access Control - Root Location
# ===========================================
<Location />
  # Allow local access
  Order allow,deny
  Allow localhost
  Allow @LOCAL
</Location>

# ===========================================
# Access Control - Admin Pages
# ===========================================
<Location /admin>
  # Require authentication for admin tasks
  Order allow,deny
  Allow localhost
  Allow @LOCAL
  AuthType Default
  Require user @SYSTEM
</Location>

# ===========================================
# Access Control - Admin Configuration
# ===========================================
<Location /admin/conf>
  # Require authentication for config changes
  Order allow,deny
  Allow localhost
  AuthType Default
  Require user @SYSTEM
</Location>

# ===========================================
# Access Control - Log Files
# ===========================================
<Location /admin/log>
  Order allow,deny
  Allow localhost
  AuthType Default
  Require user @SYSTEM
</Location>

# ===========================================
# Logging Configuration
# ===========================================
LogLevel warn
PageLogFormat

# Maximum log file size (rotate at 10MB)
MaxLogSize 10m

# ===========================================
# Job Settings
# ===========================================
# Keep completed jobs for 1 day
PreserveJobHistory Yes
PreserveJobFiles 1d
MaxJobs 500
MaxJobsPerUser 100
MaxJobsPerPrinter 100

# Automatic job cleanup
AutoPurgeJobs Yes

# ===========================================
# Timeout Settings
# ===========================================
Timeout 300
JobKillDelay 60

# ===========================================
# Policy Definitions
# ===========================================
<Policy default>
  # Job-related operations
  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job CUPS-Get-Document>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  # Printer admin operations require auth
  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  # Subscription operations
  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  # Read-only operations - allow all
  <Limit Cancel-Job CUPS-Authenticate-Job>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>

# ===========================================
# Sanchala OS Optimizations
# ===========================================
# Fast USB printer detection
FileDevice Yes

# Color management support
ColorManagement Yes

# Sandboxed printing (security)
Sandboxing relaxed
