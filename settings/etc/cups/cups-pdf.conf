# ============================================================================
# SANCHALA OS - CUPS-PDF Virtual Printer Configuration
# ============================================================================
# Location: /etc/cups/cups-pdf.conf
# Purpose: Print-to-PDF functionality
# ============================================================================

# ===========================================
# Output Directory
# ===========================================
# Where PDFs are saved (per-user)
Out ${HOME}/Documents/PDF

# Anonymous/shared directory
AnonDirName /var/spool/cups-pdf/ANONYMOUS

# ===========================================
# File Naming
# ===========================================
# Label for output files
Label 0

# Truncate filenames to this length (0 = no limit)
TruncateTitle 0

# ===========================================
# PDF Settings
# ===========================================
# Ghostscript PDF version
PDFVer 1.7

# Resolution (DPI)
Resolution 600

# ===========================================
# User Permissions
# ===========================================
# Output file permissions (octal)
UserUMask 0077

# ===========================================
# Directories
# ===========================================
# Spool directory
Spool /var/spool/cups-pdf/SPOOL

# Ghostscript binary
GSBin /usr/bin/gs

# ===========================================
# Post-Processing
# ===========================================
# Command to run after creating PDF (optional)
# PostProcessing /usr/local/bin/notify-pdf-created

# ===========================================
# Logging
# ===========================================
Log /var/log/cups/cups-pdf_log
LogType 3

# ===========================================
# Ghostscript Options
# ===========================================
GhostscriptOptions -dPDFSETTINGS=/prepress -dColorImageResolution=300
