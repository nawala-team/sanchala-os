# ============================================
# SANCHALA OS - GPU Kernel Module Options
# ============================================
# Optimized settings for various GPU vendors
# ============================================

# ===========================================
# AMD GPU (amdgpu)
# ===========================================
# Enable deep color (10-bit+) support
options amdgpu deep_color=1
# Enable FreeSync/VRR support
options amdgpu freesync_video=1
# Enable GPU reset on hang (stability)
options amdgpu gpu_recovery=1
# DC (Display Core) features
options amdgpu dc=1
# Audio over HDMI/DP
options amdgpu audio=1

# ===========================================
# Intel GPU (i915)
# ===========================================
# Enable Panel Self Refresh for power savings
options i915 enable_psr=1
# Enable frame buffer compression
options i915 enable_fbc=1
# Enable GuC/HuC firmware (3 = GuC + HuC)
options i915 enable_guc=3
# Enable fastboot for faster boot
options i915 fastboot=1
# Disable output poll for Wayland
options i915 disable_power_well=0

# ===========================================
# NVIDIA (nvidia-drm)
# ===========================================
# Enable kernel modesetting for Wayland
options nvidia-drm modeset=1
# Enable framebuffer device
options nvidia-drm fbdev=1

# ===========================================
# Generic DRM
# ===========================================
# Enable atomic modesetting
options drm_kms_helper poll=0
