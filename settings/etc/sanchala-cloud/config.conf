# Sanchala Cloud - Default Configuration
# /etc/sanchala-cloud/config.conf

[General]
# Sync interval in seconds (default: 5 minutes)
sync_interval = 300

# Cloud mount root directory
cloud_root = ~/Cloud

# Enable automatic sync on file changes
auto_sync = true

# Maximum concurrent uploads/downloads
max_transfers = 4

# Bandwidth limit (0 = unlimited, format: 10M, 1G)
bandwidth_limit = 0

[Cache]
# VFS cache mode: off, minimal, writes, full
cache_mode = full

# Maximum cache size
cache_max_size = 10G

# Cache file max age
cache_max_age = 24h

# Read-ahead buffer size
read_ahead = 128M

[Sync]
# Sync mode: sync (one-way), bisync (two-way)
mode = bisync

# Delete files that don't exist on source
delete_excluded = false

# Skip files newer on destination
skip_newer = false

# Create empty source dirs on destination
create_empty_dirs = true

[Privacy]
# Client-side encryption (requires setup per account)
encryption_enabled = false

# Store credentials in KWallet
use_kwallet = true

# Clear OAuth tokens on logout
clear_tokens_on_logout = true

[Notifications]
# Show desktop notifications
enabled = true

# Notify on sync complete
notify_sync_complete = true

# Notify on errors
notify_errors = true

# Notify on large file uploads
notify_large_uploads = true
large_upload_threshold = 100M

[Advanced]
# Log level: debug, info, warning, error
log_level = info

# Check file hashes after transfer
checksum = true

# Number of low-level retries
retries = 3

# Timeout for connections
connect_timeout = 60

# Ignore specific file patterns (comma-separated)
ignore_patterns = .DS_Store, Thumbs.db, .git, .svn, *.tmp, ~*
