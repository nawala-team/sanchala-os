<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Sanchala Backup D-Bus Policy -->
  
  <policy user="root">
    <allow own="id.sanchala.Backup"/>
    <allow send_destination="id.sanchala.Backup"/>
    <allow receive_sender="id.sanchala.Backup"/>
  </policy>

  <policy group="wheel">
    <allow send_destination="id.sanchala.Backup"/>
    <allow receive_sender="id.sanchala.Backup"/>
  </policy>

  <policy context="default">
    <allow send_destination="id.sanchala.Backup"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="id.sanchala.Backup"
           send_interface="org.freedesktop.DBus.Properties"/>
    <!-- Allow reading status but not modifying -->
    <allow send_destination="id.sanchala.Backup"
           send_interface="id.sanchala.Backup"
           send_member="ListSnapshots"/>
    <allow send_destination="id.sanchala.Backup"
           send_interface="id.sanchala.Backup"
           send_member="GetBackupStatus"/>
  </policy>
</busconfig>
