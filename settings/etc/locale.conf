# ============================================================================
# SANCHALA OS - Default Locale Configuration
# ============================================================================
# Location: /etc/locale.conf
# System-wide locale defaults
# Users can override in ~/.config/locale.conf
# ============================================================================

# Primary language/locale
LANG=en_US.UTF-8

# Sorting behavior (C = ASCII order, faster)
LC_COLLATE=C

# Date/time format
LC_TIME=en_US.UTF-8

# Number formatting
LC_NUMERIC=en_US.UTF-8

# Currency formatting
LC_MONETARY=en_US.UTF-8

# Paper size (Letter for US, A4 for most others)
LC_PAPER=en_US.UTF-8

# Measurement units
LC_MEASUREMENT=en_US.UTF-8

# UI Messages - follows LANG
# LC_MESSAGES=en_US.UTF-8
