# ============================================================================
# SANCHALA OS - mkinitcpio Configuration
# ============================================================================
# Version: 1.0 | Optimized for fast boot with LUKS + Btrfs
#
# Purpose: Configure initramfs generation for Sanchala OS
# Install: /etc/mkinitcpio.conf
# Regenerate: mkinitcpio -P
# ============================================================================

# ============================================================================
# MODULES - Loaded at initramfs start
# ============================================================================
# Include modules needed BEFORE udev can detect hardware
# Keep minimal - most hardware detection happens via udev

MODULES=(
    # Filesystem (Btrfs required for root)
    btrfs
    
    # Encryption (for LUKS boot)
    dm_crypt
    
    # Crypto acceleration (Intel AES-NI)
    aesni_intel
    cryptd
    
    # Early KMS for faster display (choose based on GPU)
    # Uncomment ONE based on your hardware:
    # i915        # Intel integrated graphics
    # amdgpu      # AMD graphics
    # nouveau     # NVIDIA (open source)
)

# ============================================================================
# BINARIES - Additional binaries in initramfs
# ============================================================================
# Only if needed for custom hooks
BINARIES=()

# ============================================================================
# FILES - Additional files in initramfs
# ============================================================================
# Only if needed (e.g., custom keys)
FILES=()

# ============================================================================
# HOOKS - Processing order during init
# ============================================================================
# Order matters! Each hook sets up capabilities for the next.
#
# Recommended for Sanchala OS (LUKS + Btrfs + systemd boot):
# - systemd: Use systemd in initramfs (faster than busybox)
# - autodetect: Include only modules for this system (smaller initramfs)
# - microcode: Early CPU microcode loading (security)
# - modconf: Module configuration from /etc/modprobe.d
# - kms: Kernel Mode Setting for early display
# - keyboard: USB/PS2 keyboard support (for LUKS passphrase)
# - sd-vconsole: Console font/keymap (systemd)
# - block: Block device support
# - sd-encrypt: LUKS decryption (systemd)
# - filesystems: Filesystem modules
# - fsck: Filesystem check (optional, Btrfs does its own)

HOOKS=(
    base
    systemd
    autodetect
    microcode
    modconf
    kms
    keyboard
    sd-vconsole
    block
    sd-encrypt
    filesystems
)

# ============================================================================
# COMPRESSION
# ============================================================================
# LZ4 provides fastest decompression (boot speed priority)
# Alternatives: zstd (better ratio), gzip (compatible), xz (smallest)
COMPRESSION="lz4"

# Compression options (empty for defaults)
COMPRESSION_OPTIONS=()

# ============================================================================
# MODULES_DECOMPRESS
# ============================================================================
# Decompress kernel modules in initramfs for faster loading
# Uses more space but speeds up boot
MODULES_DECOMPRESS="yes"
