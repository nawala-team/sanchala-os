# ============================================================================
# SANCHALA OS - Thunderbolt Security Configuration
# ============================================================================
# Location: /etc/bolt/boltd.conf
# Purpose: Configure Thunderbolt device authorization behavior
# ============================================================================

[device]
# Security policy: user, secure, or dponly
# user   - Authorize on user consent (recommended for desktops)
# secure - Require key verification (recommended for laptops)  
# dponly - Only allow DisplayPort, block PCIe (most secure)
policy=user

# Auto-enroll authorized devices to the database
enroll-mode=auto

# ===========================================
# Auto-authorization for known device types
# ===========================================
[auto]
# Automatically authorize docks (convenience vs security tradeoff)
# Set to false for high-security environments
docks=true

# Automatically authorize displays (usually safe)
displays=true

# Never auto-authorize storage devices (DMA risk)
storage=false

# Never auto-authorize eGPUs by default (DMA risk)
egpu=false

# ===========================================
# Enrolled devices
# ===========================================
# Devices authorized here will be auto-connected
# Add device UUIDs from: boltctl list

# [enrolled]
# CalDigit-TS3-Plus=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
# OWC-Dock=yyyyyyyy-yyyy-yyyy-yyyy-yyyyyyyyyyyy
