# ============================================
# SANCHALA OS - qBittorrent Configuration
# ============================================
# Modern torrent client with privacy focus
# ============================================

[AutoRun]
enabled=false
program=

[BitTorrent]
Session\AddExtensionToIncompleteFiles=true
Session\AddTrackersEnabled=false
Session\AlternativeGlobalDLSpeedLimit=1024
Session\AlternativeGlobalUPSpeedLimit=512
Session\AnonymousModeEnabled=true
Session\BandwidthSchedulerEnabled=true
Session\DefaultSavePath=/home/@USER@/Downloads/Torrents
Session\DHTEnabled=true
Session\DisableAutoTMMByDefault=false
Session\Encryption=1
Session\GlobalDLSpeedLimit=0
Session\GlobalMaxRatio=2
Session\GlobalMaxSeedingMinutes=1440
Session\GlobalUPSpeedLimit=0
Session\IgnoreLimitsOnLAN=true
Session\IgnoreSlowTorrentsForQueueing=true
Session\IncludeOverheadInLimits=false
Session\IPFilter\Enabled=true
Session\IPFilter\File=/home/@USER@/.config/qBittorrent/ipfilter.dat
Session\LSDEnabled=true
Session\MaxActiveDownloads=5
Session\MaxActiveTorrents=10
Session\MaxActiveUploads=5
Session\MaxConnections=500
Session\MaxConnectionsPerTorrent=100
Session\MaxRatioAction=0
Session\MaxUploads=20
Session\MaxUploadsPerTorrent=5
Session\PeXEnabled=true
Session\Port=6881
Session\Preallocation=true
Session\QueueingSystemEnabled=true
Session\TempPath=/home/@USER@/Downloads/Torrents/Incomplete
Session\TempPathEnabled=true
Session\UseAlternativeGlobalSpeedLimits=false

[Core]
AutoDeleteAddedTorrentFile=IfAdded

[LegalNotice]
Accepted=true

[Meta]
MigrationVersion=4

[Network]
PortForwardingEnabled=true
Proxy\OnlyForTorrents=true
Proxy\Port=8080
Proxy\Type=None
