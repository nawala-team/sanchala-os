# ============================================================================
# SANCHALA OS - BlueZ Audio Configuration
# ============================================================================
# Optimized for high-quality Bluetooth audio with LDAC, aptX HD, AAC
# ============================================================================

[General]
# Enable audio support
Enable = Source,Sink,Media,Socket

# Auto-connect audio devices
AutoConnect = true

# ============================================================================
# A2DP Source (Computer sends audio to headphones)
# ============================================================================

[A2DP]
# Preferred codec order (best quality first)
# LDAC: Up to 990kbps (Sony hi-res)
# aptX HD: 576kbps 24-bit (Qualcomm)
# aptX: 352kbps low-latency (Qualcomm)
# AAC: 256kbps (Apple preferred)
# SBC-XQ: 345kbps (enhanced standard)
# SBC: 198kbps (universal fallback)
SBCChannelMode = joint_stereo
SBCAllocationMethod = loudness
SBCSubbands = 8
SBCBlockLength = 16
SBCMinBitpool = 35
SBCMaxBitpool = 53

# High-quality SBC settings (SBC-XQ)
SBCXQ = true

# LDAC quality mode: auto, hq (990), sq (660), mq (330)
LDACQuality = auto
LDACEQMVS = true

# aptX HD enable
AptXHD = true

# aptX Low Latency mode
AptXLL = true

# AAC settings
AACVBRMode = 5

# FastStream for low-latency gaming
FastStream = true

# ============================================================================
# HFP/HSP (Hands-Free/Headset Profile for calls)
# ============================================================================

[HFP]
# Wide-band speech (mSBC codec - 16kHz)
MSBC = true

# Noise reduction and echo cancellation (handled by PipeWire)
NREC = false

# Volume control
RemoteVolume = true

# Auto-answer (for automotive)
AutoAnswer = false

# Voice recognition
VoiceRecognition = true

# ============================================================================
# AVRCP (Media Controls)
# ============================================================================

[AVRCP]
# Enable all media control features
PlayerControl = true
MetadataPlayer = true
BrowsePlayer = true

# Absolute volume control
AbsoluteVolume = true

# ============================================================================
# Latency Optimization
# ============================================================================

[Latency]
# Default audio latency offset (microseconds)
# Negative = reduce latency, may cause dropouts
# Positive = increase buffer, more stable
OffsetDefault = 0

# Latency for different use cases
OffsetMusic = 0
OffsetVoice = -5000
OffsetGaming = -10000

# ============================================================================
# Battery Reporting
# ============================================================================

[Battery]
# Enable battery level reporting
ReportingEnabled = true

# Polling interval (seconds)
PollInterval = 60

# Low battery threshold (show warning)
LowThreshold = 20

# Critical battery threshold
CriticalThreshold = 10
