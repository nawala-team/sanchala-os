# ============================================================================
# SANCHALA OS - BlueZ Main Configuration
# ============================================================================
# Optimized for seamless, Apple-like Bluetooth experience
# Fast pairing, auto-reconnect, high-quality audio, BLE support
# ============================================================================

[General]
# Controller name shown to other devices
Name = Sanchala OS

# Device class: Computer (Desktop/Laptop)
# Bits: 0x1C0000 = Computer, 0x000104 = Audio
Class = 0x1c0104

# Discoverable timeout (0 = always discoverable when enabled)
DiscoverableTimeout = 180

# Pairable timeout (0 = always pairable)
PairableTimeout = 0

# Always use LE (Low Energy) for better battery
AlwaysPaturable = false
Privacy = device

# Fast discovery for quick device listing
DiscoveryTimeout = 0

# Enable all controllers (internal + USB dongles)
MultiProfile = multiple

# Automatically connect to known devices
AutoConnect = true

# Enable battery reporting for connected devices
BatteryEnabled = true

# Maximum number of controllers
MaxControllers = 16

# ============================================================================
# Bluetooth LE (Low Energy) Settings
# ============================================================================

[LE]
# Minimum and maximum advertising intervals (slots of 0.625ms)
MinAdvertisingInterval = 30
MaxAdvertisingInterval = 60

# Enable LE for all capable devices
MultiAdvertisingRotationInterval = 15
MultiAdvertisingInstance = 5

# Preferred LE scanning parameters
ScanIntervalAutoConnect = 160
ScanWindowAutoConnect = 80

# ============================================================================
# BR/EDR (Classic Bluetooth) Settings
# ============================================================================

[BR]
# Page scan and inquiry scan settings for fast discovery
PageScanType = interlaced
PageScanInterval = 0x0800
PageScanWindow = 0x0012

InquiryScanType = interlaced
InquiryScanInterval = 0x0800
InquiryScanWindow = 0x0012

# Link supervision timeout (seconds)
LinkSupervisionTimeout = 5

# Enable Secure Simple Pairing
SecureSimplePairing = true

# ============================================================================
# GATT (Generic Attribute Profile) Settings
# ============================================================================

[GATT]
# Cache for faster reconnection
Cache = always

# Maximum transmission unit
Channels = 3
ReconnectIntervals = 1,2,4,8,16,32,64

# Key size for encrypted connections
KeySize = 16

# Exchange MTU request after connection
ExchangeMTU = 517

# ============================================================================
# A2DP (Advanced Audio Distribution Profile) Settings  
# ============================================================================

[A2DP]
# Source role for sending audio
SourceRole = true

# Sink role for receiving audio
SinkRole = true

# Enable high-quality audio codecs
# Priority: LDAC > aptX HD > aptX > AAC > SBC-XQ > SBC
Codecs = ldac:aptx_hd:aptx:aac:sbc_xq:sbc

# ============================================================================
# AVRCP (Audio/Video Remote Control Profile) Settings
# ============================================================================

[AVRCP]
# Enable media controls
ControllerEnabled = true
TargetEnabled = true

# Features
VolumeCategory = 2
VolumeWithoutCategory = true

# ============================================================================
# Policy Settings
# ============================================================================

[Policy]
# Auto-enable adapter at boot
AutoEnable = true

# Reconnect to known devices automatically
ReconnectAttempts = 7
ReconnectIntervals = 1,2,4,8,16,32,64

# UUIDs for profiles to auto-connect
ReconnectUUIDs = 0x110b,0x110a,0x1108,0x111f,0x111e,0x1112,0x1116

# Trust known devices
AutoConnect = true
