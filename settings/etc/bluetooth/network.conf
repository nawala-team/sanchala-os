# ============================================================================
# SANCHALA OS - BlueZ Network Configuration
# ============================================================================
# Bluetooth tethering and networking (PAN, NAP, GN)
# ============================================================================

[General]
# Disable by default - enable when needed
DisableSecurity = false

[Network]
# Personal Area Networking (tethering)
# NAP = Network Access Point (share internet)
# GN = Group Network
# PANU = PAN User (connect to shared internet)

# Default connection timeout
ConnectionTimeout = 30000

[NAP]
# Network interface for tethering
Interface = pan0

# Use DHCP for clients
DHCP = true

# IP range for PAN clients
# Note: Actual IP config done via NetworkManager/systemd-networkd
