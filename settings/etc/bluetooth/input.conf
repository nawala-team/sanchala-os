# ============================================================================
# SANCHALA OS - BlueZ Input Device Configuration
# ============================================================================
# Settings for Bluetooth keyboards, mice, trackpads, game controllers
# ============================================================================

[General]
# Use uHID for input devices (modern, faster)
UserspaceHID = true

# Idle timeout for input devices (0 = no timeout)
IdleTimeout = 0

# Classic HID settings
ClassicBondedOnly = false

# ============================================================================
# Keyboard Settings
# ============================================================================

[Keyboard]
# Allow legacy pairing for older keyboards
LEAutoSecurity = true

# Input report protocol
ProtocolMode = report

# ============================================================================
# Mouse/Trackpad Settings  
# ============================================================================

[Mouse]
# Enable high-resolution scroll
HighResolutionScroll = true

# Polling rate optimization
PollInterval = 8

# ============================================================================
# Game Controller Settings
# ============================================================================

[GameController]
# Enable game controller support
Enabled = true

# Low-latency mode for gaming
LowLatency = true

# Rumble/vibration support
RumbleEnabled = true
