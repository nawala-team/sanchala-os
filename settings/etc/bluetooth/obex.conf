# ============================================================================
# SANCHALA OS - OBEX File Transfer Configuration
# ============================================================================
# Bluetooth file transfer (send/receive files)
# ============================================================================

[General]
# Auto-accept files from paired/trusted devices
AutoAccept = true

# Where to save received files
Root = ~/Downloads/Bluetooth

# Capability exchange
Capability = /etc/bluetooth/obex-capability.xml

[FTP]
# File browsing via Bluetooth
Enable = true

[OPP]
# Object Push Profile (receiving files)
Enable = true

[MAP]
# Message Access Profile
Enable = false

[PBAP]
# Phone Book Access Profile
Enable = true
