# ============================================================================
# SANCHALA OS - Bluetooth Systemd Service Override
# ============================================================================
# Optimizations for fast startup and better BLE support
# ============================================================================

[Service]
# Enable experimental features for battery reporting and LE audio
ExecStart=
ExecStart=/usr/lib/bluetooth/bluetoothd --experimental --plugin=battery

# Restart on failure
Restart=on-failure
RestartSec=2

# Security hardening
ProtectSystem=strict
ProtectHome=read-only
PrivateTmp=true
NoNewPrivileges=true

# Performance optimizations
Nice=-10
IOSchedulingClass=realtime
IOSchedulingPriority=0

[Install]
WantedBy=bluetooth.target
