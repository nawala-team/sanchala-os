# ============================================================================
# SANCHALA OS - NTP Time Synchronization Configuration
# ============================================================================
# Location: /etc/systemd/timesyncd.conf
# systemd-timesyncd network time synchronization
# ============================================================================

[Time]
# Primary NTP servers (geographically distributed for reliability)
# Using pool.ntp.org for automatic geographic routing
NTP=0.pool.ntp.org 1.pool.ntp.org 2.pool.ntp.org 3.pool.ntp.org

# Fallback NTP servers (major public time servers)
FallbackNTP=time.cloudflare.com time.google.com time.facebook.com time.apple.com

# Root distance maximum (seconds)
# Maximum acceptable root distance for NTP server selection
# Lower values = stricter accuracy requirements
RootDistanceMaxSec=5

# Poll interval range (seconds)
# How often to poll NTP servers
# Minimum: 32 seconds (2^5)
# Maximum: 2048 seconds (2^11) - about 34 minutes
PollIntervalMinSec=32
PollIntervalMaxSec=2048

# Connection retry interval (seconds)
# Time to wait before retrying after connection failure
ConnectionRetrySec=30

# Save interval (seconds)
# How often to save time state to disk
# Helps maintain accurate time across reboots
SaveIntervalSec=60

# ============================================================================
# SANCHALA OS ENHANCEMENTS
# ============================================================================

[Sanchala]
# Enable enhanced time sync monitoring
EnhancedMonitoring=true

# Notify user on significant time jumps
NotifyOnTimeJump=true
TimeJumpThreshold=60

# Log sync events to journal
LogSyncEvents=true

# Sync status in system tray
ShowSyncStatus=true

# Preferred server regions (ISO 3166-1 alpha-2)
# Leave empty for automatic selection
PreferredRegions=

# Corporate/institutional NTP server (for enterprise deployments)
# EnterpriseNTP=ntp.company.local

# Secure NTP (NTS - Network Time Security) when available
EnableNTS=true
NTSServers=time.cloudflare.com

# Maximum clock drift before warning (milliseconds)
DriftWarningThreshold=500

# Sync on network change
SyncOnNetworkChange=true

# Sync on resume from suspend
SyncOnResume=true

# Battery saver mode (less frequent polling on battery)
BatterySaverMode=true
BatteryPollIntervalSec=300
