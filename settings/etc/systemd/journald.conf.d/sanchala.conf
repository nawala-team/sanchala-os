# Sanchala OS Journal Configuration
# /etc/systemd/journald.conf.d/sanchala.conf

[Journal]
# Maximum disk space for journal
SystemMaxUse=500M
RuntimeMaxUse=100M

# Maximum size per individual file
SystemMaxFileSize=50M
RuntimeMaxFileSize=10M

# Keep journal data for 30 days
MaxRetentionSec=30day

# Compress journal data
Compress=yes

# Forward to syslog for compatibility
ForwardToSyslog=no

# Rate limiting
RateLimitIntervalSec=30s
RateLimitBurst=10000
