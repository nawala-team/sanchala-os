# ============================================================================
# SANCHALA OS - Journald Configuration
# ============================================================================
# Version: 1.0 | Optimized logging for desktop use
# Location: /etc/systemd/journald.conf.d/10-sanchala.conf
# ============================================================================

[Journal]
# ============================================================================
# STORAGE
# ============================================================================

# Where to store journals
# auto = persistent if /var/log/journal exists, volatile otherwise
Storage=persistent

# Compress journal entries above this size
Compress=yes

# Seal journals with FSS (Forward Secure Sealing) for tamper evidence
Seal=yes

# ============================================================================
# SIZE LIMITS
# ============================================================================

# Maximum disk space for persistent journals
SystemMaxUse=500M

# Keep this much space free on the filesystem
SystemKeepFree=1G

# Maximum size of individual journal files
SystemMaxFileSize=50M

# Runtime (volatile) journal limits
RuntimeMaxUse=100M
RuntimeKeepFree=100M
RuntimeMaxFileSize=20M

# ============================================================================
# RATE LIMITING
# ============================================================================

# Rate limit: max messages per interval per service
RateLimitIntervalSec=30s
RateLimitBurst=10000

# ============================================================================
# PERFORMANCE
# ============================================================================

# Forward to syslog (disable if not using syslog daemon)
ForwardToSyslog=no

# Forward to console (disable for cleaner boot)
ForwardToConsole=no

# Forward to wall (disable for less noise)
ForwardToWall=yes

# Sync interval (how often to sync to disk)
# Lower = more durable but slower, higher = faster but less durable
SyncIntervalSec=5m

# ============================================================================
# AUDIT
# ============================================================================

# Import audit messages into journal
Audit=yes
