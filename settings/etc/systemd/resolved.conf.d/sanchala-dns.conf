# ============================================
# SANCHALA OS - DNS-over-HTTPS Configuration
# ============================================
# Secure DNS resolution with DoH/DoT
# Part of Layer 8: Zero Trust Network
# ============================================

[Resolve]
# ----------------------------------------
# DNS Servers with DoT (DNS-over-TLS)
# ----------------------------------------
# Primary: Cloudflare (privacy-focused)
# Secondary: Quad9 (malware blocking)
# Fallback: Mullvad (no logging)
# ----------------------------------------
DNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net
FallbackDNS=194.242.2.2#dns.mullvad.net

# ----------------------------------------
# DNS-over-TLS Mode
# ----------------------------------------
# opportunistic = Try TLS, fall back to plain (default)
# yes = Require TLS, fail if unavailable (strict)
# no = Never use TLS
# ----------------------------------------
# SANCHALA DEFAULT: Opportunistic for compatibility
# Users can switch to strict mode for maximum security
DNSOverTLS=opportunistic

# ----------------------------------------
# DNSSEC Validation
# ----------------------------------------
# Validate DNS responses cryptographically
# Protects against DNS spoofing attacks
# ----------------------------------------
DNSSEC=allow-downgrade

# ----------------------------------------
# Multicast DNS
# ----------------------------------------
# Disabled on external interfaces (privacy)
# Enabled on localhost for local discovery
# ----------------------------------------
MulticastDNS=resolve

# ----------------------------------------
# Link-Local Multicast Name Resolution
# ----------------------------------------
# Disabled to prevent information leakage
# ----------------------------------------
LLMNR=resolve

# ----------------------------------------
# Cache Settings
# ----------------------------------------
# Enable caching for performance
Cache=yes
CacheFromLocalhost=no

# ----------------------------------------
# Stub Listener
# ----------------------------------------
# Enable local DNS stub for applications
DNSStubListener=yes
DNSStubListenerExtra=127.0.0.53

# ----------------------------------------
# Read /etc/hosts
# ----------------------------------------
ReadEtcHosts=yes
