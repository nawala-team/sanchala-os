# ============================================================================
# SANCHALA OS - Logind Power Configuration
# ============================================================================
# Version: 1.0 | Lid close, power button, idle actions
# Location: /etc/systemd/logind.conf.d/sanchala-power.conf
# ============================================================================

[Login]
# ============================================================================
# LID SWITCH BEHAVIOR
# ============================================================================

# Action when laptop lid is closed
# Options: ignore, poweroff, reboot, halt, suspend, hibernate, 
#          hybrid-sleep, suspend-then-hibernate, lock
HandleLidSwitch=suspend-then-hibernate

# Lid close action when on external power
HandleLidSwitchExternalPower=suspend

# Lid close action when docked (external display connected)
HandleLidSwitchDocked=ignore

# ============================================================================
# POWER BUTTON BEHAVIOR
# ============================================================================

# Short press of power button
HandlePowerKey=suspend

# Long press of power button (if supported)
HandlePowerKeyLongPress=poweroff

# Suspend key (if present on keyboard)
HandleSuspendKey=suspend

# Hibernate key (if present)
HandleHibernateKey=hibernate

# ============================================================================
# IDLE ACTIONS
# ============================================================================

# Idle action timeout (minutes)
# 0 = disabled
IdleAction=suspend-then-hibernate
IdleActionSec=30min

# ============================================================================
# INHIBITOR SETTINGS
# ============================================================================

# How long to wait for inhibitors before forcing action (seconds)
InhibitDelayMaxSec=5

# Allow users to inhibit system sleep (e.g., during presentations)
AllowSuspend=yes
AllowHibernation=yes
AllowSuspendThenHibernate=yes
AllowPowerOff=yes
AllowReboot=yes

# ============================================================================
# SESSION SETTINGS
# ============================================================================

# Kill user processes on logout
KillUserProcesses=no

# Exclude specific users from KillUserProcesses
KillExcludeUsers=root

# Runtime directory size (for user session data)
RuntimeDirectorySize=10%
