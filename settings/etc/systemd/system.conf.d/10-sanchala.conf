# ============================================================================
# SANCHALA OS - Systemd System Configuration
# ============================================================================
# Version: 1.0 | Optimized for fast boot and responsive desktop
# Location: /etc/systemd/system.conf.d/10-sanchala.conf
# ============================================================================

[Manager]
# ============================================================================
# BOOT OPTIMIZATION
# ============================================================================

# Default timeout for stopping services (faster shutdown)
# Reduces shutdown time from 90s default to 15s
DefaultTimeoutStopSec=15s

# Default timeout for starting services
# Fail faster if a service hangs during boot
DefaultTimeoutStartSec=30s

# CPU accounting (enables per-service CPU tracking)
DefaultCPUAccounting=yes

# I/O accounting (enables per-service I/O tracking)
DefaultIOAccounting=yes

# Memory accounting (enables per-service memory tracking)
DefaultMemoryAccounting=yes

# Tasks accounting (process/thread counting per service)
DefaultTasksAccounting=yes

# ============================================================================
# RESOURCE DEFAULTS
# ============================================================================

# Default CPU weight for services (100 = normal priority)
DefaultCPUWeight=100

# Default I/O weight for services (100 = normal priority)
DefaultIOWeight=100

# Default memory limits (0 = unlimited)
DefaultMemoryMax=0
DefaultTasksMax=4096

# ============================================================================
# LOGGING
# ============================================================================

# Compress core dumps
DefaultLimitCORE=infinity

# Journal rate limiting (prevent log storms)
LogLevel=info
LogTarget=journal

# ============================================================================
# CGROUP SETTINGS
# ============================================================================

# Use unified cgroup hierarchy (cgroups v2)
# Required for proper resource control on modern systems
# Note: Set in kernel cmdline: systemd.unified_cgroup_hierarchy=1
