# ============================================================================
# SANCHALA OS - NTP Drop-in Configuration
# ============================================================================
# Location: /etc/systemd/timesyncd.conf.d/50-sanchala.conf
# Sanchala-specific NTP enhancements
# ============================================================================

[Time]
# Regional NTP pools (uncomment appropriate region)
# These provide better latency and reliability

# Americas
# NTP=0.north-america.pool.ntp.org 1.north-america.pool.ntp.org

# Europe
# NTP=0.europe.pool.ntp.org 1.europe.pool.ntp.org

# Asia
# NTP=0.asia.pool.ntp.org 1.asia.pool.ntp.org

# Oceania
# NTP=0.oceania.pool.ntp.org 1.oceania.pool.ntp.org

# Africa
# NTP=0.africa.pool.ntp.org 1.africa.pool.ntp.org

# Default: global pool with NTS-capable fallbacks
FallbackNTP=time.cloudflare.com time.google.com time.nist.gov tick.usno.navy.mil
