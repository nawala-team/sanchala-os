# ============================================================================
# SANCHALA OS - ZRAM Configuration
# ============================================================================
# Version: 1.0 | Compressed RAM-based swap for responsiveness
# Package: zram-generator (systemd-integrated)
#
# Benefits:
#   - Faster than disk swap (compression in RAM)
#   - Reduces SSD wear
#   - Effective memory expansion (2-3x compression typical)
#   - Low CPU overhead with modern algorithms
# ============================================================================

[zram0]
# ============================================================================
# SIZE CONFIGURATION
# ============================================================================

# Size as fraction of total RAM
# - Desktop with 8GB+: 0.5 (50%) gives ~12-16GB effective memory
# - Desktop with 4-8GB: 0.75 (75%) for more headroom
# - Desktop with <4GB: 1.0 (100%) maximum benefit
# Dynamic: Leave unset to use zram-fraction calculation
zram-size = ram / 2

# Alternative: Fixed size (uncomment if preferred)
# zram-size = 8192

# Maximum size cap (prevents excessive zram on high-RAM systems)
max-zram-size = 16384

# ============================================================================
# COMPRESSION ALGORITHM
# ============================================================================
# Options: lzo, lzo-rle, lz4, lz4hc, zstd
#
# Performance comparison (approximate):
#   lz4     - Fastest compression/decompression, decent ratio (~2.5x)
#   lzo-rle - Good balance, slightly better ratio than lz4
#   zstd    - Best ratio (~3-4x), slightly slower but still fast
#
# Recommended: zstd for modern CPUs (>2015), lz4 for older/low-power
compression-algorithm = zstd

# ============================================================================
# SWAP PRIORITY
# ============================================================================
# Higher priority = used first before disk swap
# Default disk swap is usually priority 0 or negative
# zram should be higher priority (used first)
swap-priority = 100

# ============================================================================
# FILESYSTEM OPTIONS
# ============================================================================
# Mount options for zram swap device
# none needed for swap (it's not a mounted filesystem)

# ============================================================================
# WRITEBACK (Optional - for hybrid SSD setups)
# ============================================================================
# Enable writeback to backing device for rarely-accessed pages
# Useful if you have fast NVMe + slower backup swap
# writeback-device = /dev/disk/by-partlabel/swap

# ============================================================================
# ADDITIONAL ZRAM DEVICES (Optional)
# ============================================================================
# Uncomment to add additional zram devices for different purposes

# [zram1]
# # Separate zram for /tmp (RAM-based tmpfs alternative)
# zram-size = 2048
# compression-algorithm = lz4
# mount-point = /tmp
# fs-type = ext4
