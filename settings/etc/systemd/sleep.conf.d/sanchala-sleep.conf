# ============================================================================
# SANCHALA OS - Sleep/Hibernate Configuration
# ============================================================================
# Version: 1.0 | macOS-style sleep behavior
# Location: /etc/systemd/sleep.conf.d/sanchala-sleep.conf
# ============================================================================
#
# SLEEP MODES:
# - suspend (S3): RAM stays powered, fast wake (~2 seconds)
# - hibernate (S4): State saved to disk, zero power, slow wake (~15 seconds)
# - hybrid-sleep: Suspend + write to disk (safe if power lost)
# - suspend-then-hibernate: Suspend first, hibernate after timeout
#
# Sanchala default: suspend-then-hibernate (macOS behavior)
# ============================================================================

[Sleep]
# Allow these sleep modes
AllowSuspend=yes
AllowHibernation=yes
AllowSuspendThenHibernate=yes
AllowHybridSleep=yes

# Default suspend mode
# Options: suspend, hibernate, hybrid-sleep, suspend-then-hibernate
SuspendMode=suspend-then-hibernate

# Suspend state (kernel level)
# Options: mem (S3), standby (S1), freeze (S0ix/Modern Standby)
# Modern laptops (Intel 11th gen+, AMD Ryzen 4000+) prefer s2idle
SuspendState=mem

# Hibernate mode
HibernateMode=platform shutdown

# Hibernate state
HibernateState=disk

# Hybrid sleep mode
HybridSleepMode=suspend platform shutdown
HybridSleepState=disk

# ============================================================================
# SUSPEND-THEN-HIBERNATE TIMING
# ============================================================================

# Time in suspend before automatically hibernating
# This saves battery during long sleep periods (like overnight)
# Default: 3 hours (10800 seconds) - similar to macOS standby
HibernateDelaySec=10800

# Alternative: Use battery level as trigger
# Hibernate when battery drops below this percentage during suspend
# (Requires systemd 251+)
# SuspendEstimationSec=
