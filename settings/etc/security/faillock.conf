# ============================================================================
# SANCHALA OS - Faillock Configuration
# ============================================================================
# Account lockout policy to prevent brute-force attacks
# ============================================================================

# Directory for per-user failure records
dir = /var/run/faillock

# Audit successful logins
audit

# Audit denied access attempts
silent

# Lock account after N failed attempts
deny = 5

# Time window for counting failures (seconds)
fail_interval = 900

# Unlock time after lockout (seconds) - 15 minutes
unlock_time = 900

# Don't lock root account (prevent DoS, but still log)
# Uncomment for high-security environments:
# even_deny_root

# Root unlock time (if even_deny_root enabled)
root_unlock_time = 60

# Don't reset failure count after successful auth
# (count accumulates, resets only after unlock_time)
# Uncomment for stricter policy:
# no_reset

# Local users only
local_users_only
