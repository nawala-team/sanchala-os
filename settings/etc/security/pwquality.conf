# ============================================================================
# SANCHALA OS - Password Quality Configuration
# ============================================================================
# Strong defaults that balance security and usability
# Inspired by NIST 800-63B guidelines
# ============================================================================

# Minimum password length (NIST recommends 8+, we use 12 for better security)
minlen = 12

# Minimum character class requirements (lowercase, uppercase, digit, special)
# We require at least 3 of 4 classes instead of rigid requirements
minclass = 3

# Maximum consecutive identical characters
maxrepeat = 3

# Maximum consecutive characters from same class
maxclassrepeat = 4

# Check if password contains the username
usercheck = 1

# Check password against dictionary
dictcheck = 1

# Check for common sequences (123, abc, qwerty patterns)
dictpath = /usr/share/cracklib/pw_dict

# Enforce for root user too
enforce_for_root

# Credit system (positive = required minimum, negative = credit given)
# Negative values give "credit" reducing minlen requirement
dcredit = -1    # At least 1 digit gives 1 char credit
ucredit = -1    # At least 1 uppercase gives 1 char credit
lcredit = -1    # At least 1 lowercase gives 1 char credit
ocredit = -1    # At least 1 special char gives 1 char credit

# Minimum number of characters that must differ from old password
difok = 5

# Check if new password is just old password with case changes
gecoscheck = 1

# Reject passwords matching common bad patterns
badwords = password passwd sanchala admin root linux

# Maximum password length for sanity (bcrypt limit)
maxlen = 72

# Retry attempts before failure
retry = 3

# User-friendly password hints
# Local users only (don't apply to system accounts)
local_users_only
