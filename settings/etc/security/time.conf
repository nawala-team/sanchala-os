# ============================================================================
# SANCHALA OS - Time-Based Access Control
# ============================================================================
# Optional: Restrict login times for specific users/services
# Format: services;ttys;users;times
# ============================================================================

# Example: Deny console login outside business hours
# login;tty*;!admin;!Wk0800-1800

# Example: Allow SSH only on weekdays
# sshd;*;*;Wk0000-2400

# Default: No time restrictions (allow all)
*;*;*;Al0000-2400
