# Sanchala Guest User Limits
# /etc/security/limits.d/99-sanchala-guest.conf

# Process limits
guest    soft    nproc     256
guest    hard    nproc     512

# Open file limits
guest    soft    nofile    1024
guest    hard    nofile    2048

# File size limits (bytes)
guest    soft    fsize     1073741824
guest    hard    fsize     2147483648

# Address space (bytes)
guest    soft    as        4294967296
guest    hard    as        8589934592

# CPU time (seconds)
guest    soft    cpu       3600
guest    hard    cpu       7200

# Memory lock (KB)
guest    soft    memlock   65536
guest    hard    memlock   65536

# Max logins
guest    -       maxlogins 1

# Priority (nice)
guest    soft    priority  5
guest    hard    priority  10
