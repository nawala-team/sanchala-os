# SANCHALA OS - Security Limits for Authentication
# Ensures PAM/auth processes have appropriate resources

# Allow enough open files for auth services
*               soft    nofile          4096
*               hard    nofile          65536

# Prevent fork bombs during auth
*               soft    nproc           4096
*               hard    nproc           8192

# Memory limits to prevent DoS
*               soft    as              unlimited
*               hard    as              unlimited

# Core dumps disabled for security
*               soft    core            0
*               hard    core            0
