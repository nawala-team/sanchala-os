# ============================================
# SANCHALA OS - Realtime Audio Privileges
# ============================================
# Required for pro-audio low-latency operation
# ============================================

# Members of 'realtime' group get realtime scheduling
@realtime - rtprio 98
@realtime - memlock unlimited
@realtime - nice -19

# Members of 'audio' group (fallback)
@audio - rtprio 75
@audio - memlock 512000
@audio - nice -11
