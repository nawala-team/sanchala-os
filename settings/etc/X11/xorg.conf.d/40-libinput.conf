# ============================================================================
# SANCHALA OS - libinput X11 Configuration
# ============================================================================
# Version: 1.0 | MacBook-quality input experience
# Location: /etc/X11/xorg.conf.d/40-libinput.conf
# ============================================================================

# TOUCHPAD - MacBook-style gestures and feel
Section "InputClass"
    Identifier "Sanchala Touchpad Defaults"
    MatchIsTouchpad "on"
    MatchDevicePath "/dev/input/*"
    Driver "libinput"
    Option "NaturalScrolling" "true"
    Option "Tapping" "on"
    Option "TappingDrag" "on"
    Option "TappingDragLock" "on"
    Option "TappingButtonMap" "lrm"
    Option "DisableWhileTyping" "on"
    Option "ClickMethod" "clickfinger"
    Option "ScrollMethod" "twofinger"
    Option "HorizontalScrolling" "on"
    Option "AccelProfile" "adaptive"
    Option "AccelSpeed" "0.4"
    Option "PalmDetection" "on"
    Option "MiddleEmulation" "off"
EndSection

# APPLE TOUCHPAD - Optimized for Magic Trackpad
Section "InputClass"
    Identifier "Apple Touchpad Enhanced"
    MatchIsTouchpad "on"
    MatchVendor "Apple"
    MatchDevicePath "/dev/input/*"
    Driver "libinput"
    Option "NaturalScrolling" "true"
    Option "Tapping" "on"
    Option "TappingDrag" "on"
    Option "TappingButtonMap" "lrm"
    Option "ClickMethod" "clickfinger"
    Option "AccelProfile" "adaptive"
    Option "AccelSpeed" "0.5"
    Option "PalmDetection" "on"
EndSection

# TOUCHSCREEN
Section "InputClass"
    Identifier "Sanchala Touchscreen"
    MatchIsTouchscreen "on"
    MatchDevicePath "/dev/input/*"
    Driver "libinput"
    Option "CalibrationMatrix" "1 0 0 0 1 0 0 0 1"
    Option "Tapping" "on"
EndSection

# TRACKPOINT
Section "InputClass"
    Identifier "Sanchala TrackPoint"
    MatchIsPointer "on"
    MatchProduct "TrackPoint|PointStick|DualPoint"
    MatchDevicePath "/dev/input/*"
    Driver "libinput"
    Option "AccelProfile" "flat"
    Option "AccelSpeed" "0.6"
    Option "ScrollMethod" "button"
    Option "ScrollButton" "2"
EndSection
