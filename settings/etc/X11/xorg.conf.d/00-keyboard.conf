# ============================================================================
# SANCHALA OS - X11 Keyboard Defaults
# ============================================================================
# Location: /etc/X11/xorg.conf.d/00-keyboard.conf
# Default keyboard layout for X11 sessions
# ============================================================================

Section "InputClass"
    Identifier "Sanchala Keyboard Defaults"
    MatchIsKeyboard "on"
    
    # Default US layout
    Option "XkbLayout" "us"
    
    # Standard PC keyboard model
    Option "XkbModel" "pc105"
    
    # Useful XKB options:
    # - terminate:ctrl_alt_bksp = Ctrl+Alt+Backspace kills X (emergency)
    # - caps:escape = Caps Lock acts as Escape (vim users)
    # - compose:ralt = Right Alt is Compose key for special chars
    Option "XkbOptions" "terminate:ctrl_alt_bksp,caps:escape,compose:ralt"
EndSection
