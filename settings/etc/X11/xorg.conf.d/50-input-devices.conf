# ============================================================================
# SANCHALA OS - Mouse and Keyboard X11 Configuration
# ============================================================================
# Version: 1.0 | Location: /etc/X11/xorg.conf.d/50-input-devices.conf
# ============================================================================

# MOUSE - Standard pointer
Section "InputClass"
    Identifier "Sanchala Mouse"
    MatchIsPointer "on"
    MatchDevicePath "/dev/input/*"
    Driver "libinput"
    Option "NaturalScrolling" "false"
    Option "AccelProfile" "adaptive"
    Option "AccelSpeed" "0"
    Option "MiddleEmulation" "off"
EndSection

# GAMING MOUSE - Low latency, no acceleration
Section "InputClass"
    Identifier "Gaming Mouse"
    MatchIsPointer "on"
    MatchProduct "Gaming|Razer|Logitech G|SteelSeries|Corsair|ROG"
    MatchDevicePath "/dev/input/*"
    Driver "libinput"
    Option "AccelProfile" "flat"
    Option "AccelSpeed" "0"
    Option "NaturalScrolling" "false"
EndSection

# WACOM TABLETS
Section "InputClass"
    Identifier "Wacom Tablet"
    MatchProduct "Wacom|WACOM"
    MatchDevicePath "/dev/input/*"
    Driver "wacom"
EndSection

# KEYBOARD
Section "InputClass"
    Identifier "Sanchala Keyboard"
    MatchIsKeyboard "on"
    MatchDevicePath "/dev/input/*"
    Driver "libinput"
    Option "XkbLayout" "us"
    Option "XkbModel" "pc105"
    Option "XkbOptions" "terminate:ctrl_alt_bksp,caps:escape"
EndSection

# APPLE KEYBOARD
Section "InputClass"
    Identifier "Apple Keyboard"
    MatchIsKeyboard "on"
    MatchVendor "Apple"
    MatchDevicePath "/dev/input/*"
    Driver "libinput"
    Option "XkbLayout" "us"
    Option "XkbModel" "apple"
    Option "XkbOptions" "terminate:ctrl_alt_bksp,altwin:swap_lalt_lwin"
EndSection
