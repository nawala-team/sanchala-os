# ============================================================================
# SANCHALA OS - Wacom Tablet Configuration
# ============================================================================
# Location: /etc/X11/xorg.conf.d/72-wacom-options.conf
# Default settings for Wacom tablets
# ============================================================================

# Wacom stylus
Section "InputClass"
    Identifier "Wacom Stylus Options"
    MatchDriver "wacom"
    MatchProduct "Pen"
    
    # Pressure curve (0 0 100 100 = linear)
    Option "PressCurve" "0 10 90 100"
    
    # Threshold for pen tip
    Option "Threshold" "26"
    
    # Enable touch ring/strip
    Option "TPCButton" "on"
EndSection

# Wacom touch
Section "InputClass"
    Identifier "Wacom Touch Options"
    MatchDriver "wacom"
    MatchProduct "Finger touch"
    
    # Enable touch by default
    Option "Touch" "on"
    
    # Gesture support
    Option "Gesture" "on"
    Option "ZoomDistance" "50"
    Option "ScrollDistance" "20"
EndSection

# Wacom eraser
Section "InputClass"
    Identifier "Wacom Eraser Options"
    MatchDriver "wacom"
    MatchProduct "eraser"
    
    # Softer eraser feel
    Option "PressCurve" "0 20 80 100"
EndSection
