# ============================================
# SANCHALA OS - OBS Studio Global Configuration
# ============================================
# Professional screen recording defaults
# Optimized for PipeWire + Wayland
# ============================================

[General]
Name=SANCHALA OS Recording Studio
Language=en-US
Theme=Yami
FirstRun=false
LastVersion=30000000
HotkeyFocusType=NeverDisableHotkeys
OpenStatsOnStartup=false
EnableAutoUpdates=false

[BasicWindow]
geometry=AdnQywADAAAA...
DockState=AAAA/wAAAAD9...
PreviewEnabled=true
PreviewProgramMode=false
SceneDuplicationMode=true
SwapScenesMode=false
EditPropertiesMode=false
StatssShown=false
PreviewScrollMode=false
DocksLocked=false
SideDocks=false

[Panels]
CookieId=SANCHALA_OBS

[Video]
BaseCX=1920
BaseCY=1080
OutputCX=1920
OutputCY=1080
FPSType=0
FPSCommon=60
FPSInt=60
FPSNum=60
FPSDen=1
ScaleType=bilinear
ColorFormat=NV12
ColorSpace=sRGB
ColorRange=Partial
SdrWhiteLevel=300
HdrNominalPeakLevel=1000

[Audio]
SampleRate=48000
ChannelSetup=Stereo
DesktopAudioDevice1=default
DesktopAudioDevice2=disabled
AuxAudioDevice1=default
AuxAudioDevice2=disabled
AuxAudioDevice3=disabled
MeterDecayRate=23.53

[Output]
Mode=Advanced
FilenameFormatting=%CCYY-%MM-%DD_%hh-%mm-%ss
RecFilePath[$e]=$HOME/Videos/Recordings
RecFormat=mkv
RecTracks=1
FlvTrack=1
RecRBPrefix=Replay
RecRBSuffix=
StreamDelayEnable=false
StreamDelaySec=20
StreamDelayPreserve=true

[AdvOut]
# Recording settings
RecType=Standard
RecFormat2=mkv
RecTracks=1
RecEncoder=ffmpeg_vaapi
RecMuxerCustom=
RecSplitFile=false
RecSplitFileTime=15
RecSplitFileSize=2048
RecSplitFileResetTimestamps=false
RecFilePath[$e]=$HOME/Videos/Recordings

# FFmpeg VAAPI (hardware acceleration)
FFVAAPIDevice=/dev/dri/renderD128
FFVAAPIBitrate=6000
FFVAAPIMaxBitrate=8000
FFVAAPIQuality=quality
FFVAAPIRateControl=VBR
FFVAAPIProfile=high
FFVAAPIBFrames=0
FFVAAPIGOPSize=120

# Software fallback
FFMPEGRecEncoder=libx264
FFMPEGX264Preset=veryfast
FFMPEGX264CRF=23

# Audio encoding
FFAEncoder=aac
FFABitrate=192
FFAudioMixes=1

# Replay Buffer
RecRB=false
RecRBTime=20
RecRBSize=512

[SimpleOutput]
FilePath[$e]=$HOME/Videos/Recordings
RecFormat=mkv
VBitrate=2500
ABitrate=160
UseAdvanced=false
Preset=veryfast
RecQuality=Stream
RecRB=false
RecRBTime=20
RecRBSize=512
NVENCPreset=p5
StreamAudioEncoder=aac
RecAudioEncoder=aac
StreamEncoder=x264
RecEncoder=x264

[Hotkeys]
ReplayBuffer.Save=OBS_KEY_F9
OBSBasic.StartRecording=OBS_KEY_F10
OBSBasic.StopRecording=OBS_KEY_F10
OBSBasic.PauseRecording=OBS_KEY_F11
OBSBasic.StartStreaming=OBS_KEY_F12
OBSBasic.StopStreaming=OBS_KEY_F12

[Accessibility]
OverrideColors=false
