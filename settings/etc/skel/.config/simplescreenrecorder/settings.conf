# ============================================
# SANCHALA OS - SimpleScreenRecorder Config
# ============================================
# Alternative screen recorder for X11 fallback
# ============================================

[input]
video_area=screen
video_area_screen=0
video_x=0
video_y=0
video_w=1920
video_h=1080
video_frame_rate=60
video_scale=false
video_scaled_w=854
video_scaled_h=480
video_record_cursor=true
audio_enabled=true
audio_backend=pulseaudio
audio_alsa_source=default
audio_pulseaudio_source=
glinject_channel=
glinject_relax_permissions=false
glinject_command=
glinject_working_directory=
glinject_auto_launch=false
glinject_limit_fps=false

[output]
output_folder[$e]=$HOME/Videos/Recordings
output_format=mkv
file_protocol=
file_protocol_options=
video_codec=libx264
video_codec_av=
audio_codec=aac
audio_codec_av=
video_kbit_rate=5000
audio_kbit_rate=192
video_options=crf=23,preset=fast
audio_options=
container_av=

[record]
hotkey_enable=true
hotkey_ctrl=false
hotkey_shift=true
hotkey_alt=false
hotkey_super=true
hotkey_key=r
preview_frame_rate=10
