# ============================================================================
# SANCHALA OS - Syncthing Configuration
# ============================================================================
# Location: ~/.config/syncthing/config.xml (template)
# P2P encrypted file synchronization for Apple iCloud-like experience
# ============================================================================

[General]
# Syncthing configuration directory
ConfigDir=~/.config/syncthing

# Data directory
DataDir=~/.local/share/syncthing

# Default sync folder
DefaultFolder=~/Sync

# GUI settings
GUIEnabled=true
GUIAddress=127.0.0.1:8384
GUITheme=dark

# API key (auto-generated)
# APIKey=

[Network]
# Listening address
ListenAddress=default

# Global discovery enabled
GlobalDiscovery=true

# Local discovery enabled
LocalDiscovery=true

# Relay servers enabled
RelaysEnabled=true

# NAT traversal enabled
NATEnabled=true

# UPnP enabled
UPnPEnabled=true

# Bandwidth limits (KiB/s, 0 = unlimited)
MaxSendKbps=0
MaxRecvKbps=0

# Connection limits
MaxConnections=0

[Security]
# Require TLS for all connections
RequireTLS=true

# Auto-upgrade enabled
AutoUpgradeEnabled=true

# Anonymous usage reporting
UsageReportAccepted=-1

# Crash reporting enabled
CrashReportingEnabled=false

[Folders]
# Default folder settings

[Folders][default]
ID=default
Label=Sync
Path=~/Sync
Type=sendreceive
RescanIntervalS=3600
FSWatcherEnabled=true
FSWatcherDelayS=10
IgnorePerms=false
AutoNormalize=true
Versioning=simple
VersioningParams=keep=5
Order=random
PullerMaxPendingKiB=0
Copiers=0
Hashers=0
PullerPauseS=0

[Folders][documents]
ID=documents
Label=Documents
Path=~/Documents
Type=sendreceive
RescanIntervalS=3600
FSWatcherEnabled=true
FSWatcherDelayS=10
IgnorePerms=false
AutoNormalize=true
Versioning=staggered
VersioningParams=cleanInterval=3600,maxAge=31536000
Order=random

[Folders][photos]
ID=photos
Label=Photos
Path=~/Pictures
Type=sendreceive
RescanIntervalS=3600
FSWatcherEnabled=true
FSWatcherDelayS=10
IgnorePerms=false
AutoNormalize=true
Versioning=simple
VersioningParams=keep=3
Order=random

[Folders][music]
ID=music
Label=Music
Path=~/Music
Type=sendreceive
RescanIntervalS=7200
FSWatcherEnabled=true
FSWatcherDelayS=30
IgnorePerms=false
AutoNormalize=true
Versioning=none
Order=random

[Folders][desktop-config]
ID=desktop-config
Label=Desktop Config
Path=~/.config/sanchala
Type=sendreceive
RescanIntervalS=1800
FSWatcherEnabled=true
FSWatcherDelayS=5
IgnorePerms=true
AutoNormalize=true
Versioning=staggered
VersioningParams=cleanInterval=3600,maxAge=2592000
Order=oldestFirst

[Versioning]
# File versioning configuration

[Versioning][simple]
Type=simple
Params=keep=5

[Versioning][staggered]
Type=staggered
Params=cleanInterval=3600,maxAge=31536000

[Versioning][trashcan]
Type=trashcan
Params=cleanoutDays=30

[IgnorePatterns]
# Global ignore patterns
Patterns=.DS_Store,Thumbs.db,desktop.ini,*.tmp,*.temp,~*,.~lock.*,*.swp,*.swo,.git,.svn,.hg,node_modules,.cache,__pycache__,*.pyc
