# ============================================================
# SANCHALA OS - Haruna Video Player Configuration
# ============================================================
# KDE's modern video player built on mpv
# Premium playback experience with hardware acceleration
# ============================================================

[General]
osdFontSize=30
seekSmallStep=5
seekMediumStep=30
seekBigStep=60
volumeStep=5
lastPlayedFile=
lastPlaylistIndex=0
rememberWindowGeometry=true
showMenuBar=false
showHeader=true
useBreezeIconTheme=true
fileDialogLastLocation=$HOME/Videos

[Playback]
hwDecoding=auto-safe
pauseWhileMinimized=true
resumePlayback=true
seekToLastPosition=true
skipChapters=false
skipChaptersWordList=Intro,Opening,Ending,Credits,Preview
ytdlpPath=/usr/bin/yt-dlp
playlistAutoLoad=true
playlistRepeat=false
playlistShuffle=false

[Video]
screenshotFormat=png
screenshotTemplate=%F-%P
screenshotFolder=$HOME/Pictures/Screenshots
contrast=0
brightness=0
gamma=0
saturation=0

[VideoSettings]
interpolation=false
deband=false
debandIterations=1
debandThreshold=64
debandRange=16
debandGrain=48

[Subtitles]
preferredLanguage=eng
preferredTrack=0
subtitlesFolders=$HOME/Videos/Subtitles
subtitleAutoLoad=fuzzy
subtitleFont=Noto Sans
subtitleFontSize=42
subtitleColor=#FFFFFF
subtitleBorderColor=#000000
subtitleBorderSize=2
subtitleShadowColor=#80000000
subtitleShadowOffset=2

[Audio]
preferredLanguage=eng
preferredTrack=0
volumeMax=130
audioNormalization=true

[ColorAdjustments]
contrast=0
brightness=0
gamma=0
saturation=0
hue=0

[Mouse]
leftClick=PlayPause
leftDoubleClick=Fullscreen
middleClick=Mute
rightClick=ContextMenu
scrollUp=VolumeUp
scrollDown=VolumeDown

[Actions]
playAction=Space
pauseAction=Space
stopAction=S
muteAction=M
volumeUpAction=0
volumeDownAction=9
seekForwardSmallAction=Right
seekBackwardSmallAction=Left
seekForwardMediumAction=Up
seekBackwardMediumAction=Down
seekForwardBigAction=Page_Up
seekBackwardBigAction=Page_Down
nextAction=Greater
previousAction=Less
fullscreenAction=F
screenshotAction=s
subtitlesIncreaseAction=Shift+G
subtitlesDecreaseAction=G
subtitleToggleAction=V
audioTrackAction=Shift+3
subtitleTrackAction=J

[OSD]
showMediaTitle=true
showChapterMarkers=true
showProgressBar=true
showDuration=true
showRemainingTime=false
showDecorations=true

[Network]
useYtdlp=true
ytdlpQuality=bestvideo[height<=?1080]+bestaudio/best
proxyEnabled=false
proxyUrl=

[History]
maxHistoryItems=50
trackPositions=true
clearOnExit=false

[Interface]
showToolbar=true
showVolumeSlider=true
showTimeInfo=true
colorScheme=
headerStyle=0
toolbarPosition=bottom

[Performance]
gpuApi=vulkan
gpuContext=auto
cacheEnabled=true
cacheSize=150000
demuxerMaxBytes=150000000
demuxerMaxBackBytes=75000000
