# ============================================================================
# SANCHALA OS - Fcitx5 Pinyin Configuration
# ============================================================================
# Location: ~/.config/fcitx5/conf/pinyin.conf
# Simplified Chinese Pinyin input settings
# ============================================================================

# Page size for candidates
PageSize=7

# Enable cloud pinyin
CloudPinyinEnabled=True

# Cloud pinyin backend (Google, Baidu)
CloudPinyinBackend=Google

# Enable prediction
Prediction=True
PredictionSize=5

# Show preedit in application
PreeditInApplication=True

# Enable punctuation conversion (Chinese punctuation)
PunctuationAfterPinyin=True

# Quick phrase trigger
QuickPhraseKey=semicolon

# Number of sentence to remember
Number of sentence=4

# Fuzzy pinyin options
FuzzyPinyin=True
VE_UE=True
NG_GN=True
Inner Segment=True
Show Full Pinyin=False

[ForgetWord]
0=Control+7
