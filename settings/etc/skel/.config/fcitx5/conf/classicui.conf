# ============================================================================
# SANCHALA OS - Fcitx5 Classic UI Theme
# ============================================================================
# Location: ~/.config/fcitx5/conf/classicui.conf
# Appearance settings for fcitx5 input panel
# ============================================================================

# Theme selection (use KDE Plasma integration)
Theme=plasma

# Use vertical candidate list
Vertical Candidate List=False

# Use per-screen DPI
PerScreenDPI=True

# Use mouse wheel to scroll candidates
WheelForPaging=True

# Font for input panel
Font="Noto Sans CJK SC 12"

# Menu Font
MenuFont="Noto Sans 11"

# Tray label font
TrayFont="Noto Sans Bold 10"

# Prefer text icon (better for HiDPI)
PreferTextIcon=False

# Show layout name in tray
ShowLayoutNameInIcon=True

# Use input method language to display text
UseInputMethodLanguageToDisplayText=True

# Force Wayland DPI (0 = auto)
ForceWaylandDPI=0
