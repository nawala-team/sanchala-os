# ============================================================================
# SANCHALA OS - Universal Clipboard Configuration
# ============================================================================
# Location: ~/.config/sanchala/clipboard.conf
# Apple-quality Universal Clipboard for seamless cross-device experience
# ============================================================================

[General]
# Enable Universal Clipboard
Enabled=true

# Clipboard backend: klipper, wl-clipboard, xclip
Backend=klipper

# Data directory
DataDir=~/.local/share/sanchala/clipboard

# Cache directory
CacheDir=~/.cache/sanchala/clipboard

[History]
# Maximum clipboard history items
MaxItems=100

# Maximum age of history items (days)
MaxAgeDays=30

# Maximum size per item (bytes) - 10MB
MaxItemSize=10485760

# Enable image support
ImagesEnabled=true

# Enable file reference support
FilesEnabled=true

# Enable rich text/HTML support
RichTextEnabled=true

# Remove duplicate entries
DeduplicateEntries=true

# Persist history across reboots
PersistentHistory=true

# History database
HistoryDB=~/.local/share/sanchala/clipboard/history.db

[Privacy]
# Auto-clear sensitive data timeout (seconds)
SensitiveDataTimeout=30

# Patterns considered sensitive (comma-separated)
SensitivePatterns=password,secret,token,api_key,private_key,credit_card,cvv

# Apps whose clipboard is always cleared quickly
SecureApps=keepassxc,bitwarden,1password,gnome-keyring,kwalletmanager5

# Clear clipboard on screen lock
ClearOnLock=false

# Clear clipboard on logout
ClearOnLogout=true

# Exclude sensitive items from history
ExcludeSensitiveFromHistory=true

# Exclude sensitive items from sync
ExcludeSensitiveFromSync=true

# OTP/2FA auto-clear timeout (seconds)
OTPTimeout=60

[Sync]
# Enable cross-device clipboard sync
Enabled=true

# Sync provider: kdeconnect, custom
Provider=kdeconnect

# Automatic sync on copy
AutoSync=true

# Sync text content
SyncText=true

# Sync images (compressed)
SyncImages=true

# Sync URLs with preview
SyncURLs=true

# Maximum sync payload (bytes) - 5MB
MaxSyncSize=5242880

# Compress images before sync
CompressImages=true

# Image quality for sync (1-100)
SyncImageQuality=80

# Encryption for transit
EncryptTransit=true

# Only sync with trusted/paired devices
TrustedDevicesOnly=true

# Show notification on receive
NotifyOnReceive=true

# Sync debounce delay (ms)
SyncDebounce=500

[Handoff]
# Enable Handoff (continue on another device)
Enabled=true

# Supported apps for Handoff
SupportedApps=brave-browser,firefox,chromium,org.kde.kate,libreoffice,org.kde.dolphin

# Show Handoff in dock
ShowInDock=true

# Handoff timeout (seconds)
Timeout=300

[QuickPaste]
# Enable quick paste menu
Enabled=true

# Number of recent items in quick menu
RecentItems=5

# Show pinned items
ShowPinned=true

# Maximum pinned items
MaxPinned=10

# Show snippets
ShowSnippets=true

[Snippets]
# Enable text snippets/templates
Enabled=true

# Snippets directory
SnippetsDir=~/.local/share/sanchala/clipboard/snippets

# Sync snippets across devices
SyncSnippets=true

# Default snippets
[Snippets][email-signature]
Name=Email Signature
Content=Best regards,\n%USER_FULLNAME%
Shortcut=;;sig

[Snippets][date-today]
Name=Today's Date
Content=%DATE_ISO%
Shortcut=;;date

[Snippets][datetime-now]
Name=Current DateTime
Content=%DATETIME_ISO%
Shortcut=;;now
