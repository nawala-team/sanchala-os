# ============================================================================
# SANCHALA OS - World Clock Widget Configuration
# ============================================================================
# Location: ~/.config/sanchala/world-clock.conf
# Multi-timezone world clock widget for desktop and system tray
# ============================================================================

[General]
# Enable world clock widget
Enabled=true

# Maximum clocks to display
MaxClocks=8

# Show local time first
LocalTimeFirst=true

# Sort order: manual, alphabetical, timezone-offset
SortOrder=manual

# Compact mode (smaller widget)
CompactMode=false

[Display]
# Clock face style: analog, digital, both
ClockStyle=digital

# Analog clock size (pixels)
AnalogSize=80

# Show city/location name
ShowLocationName=true

# Show country flag
ShowCountryFlag=true

# Show timezone abbreviation (PST, EST, etc.)
ShowTimezoneAbbrev=true

# Show UTC offset
ShowUTCOffset=true

# Show date
ShowDate=true

# Date format: short, medium, long, full
DateFormat=short

# Show day/night indicator
ShowDayNight=true

# Show weather (requires weather integration)
ShowWeather=false

# Show relative time ("2 hours ahead")
ShowRelativeTime=true

# Highlight business hours
HighlightBusinessHours=true
BusinessHoursStart=09:00
BusinessHoursEnd=17:00

[Widget]
# Widget layout: horizontal, vertical, grid
Layout=horizontal

# Grid columns (for grid layout)
GridColumns=4

# Widget opacity
Opacity=1.0

# Background style: transparent, blur, solid
BackgroundStyle=blur

# Border radius (pixels)
BorderRadius=8

# Clock separator style: line, space, none
Separator=space

# Animate transitions
AnimateTransitions=true

[DesktopWidget]
# Enable desktop widget
Enabled=true

# Widget position (x, y from top-left, or preset)
Position=top-right

# Widget margin from screen edge (pixels)
Margin=20

# Always on top
AlwaysOnTop=false

# Click-through mode
ClickThrough=false

# Auto-hide when windows overlap
AutoHide=false

[SystemTray]
# Enable system tray world clock
Enabled=true

# Tray display mode: primary, rotating, multi
TrayMode=primary

# Rotation interval (seconds, for rotating mode)
RotationInterval=5

# Click action: popup, settings, toggle-widget
ClickAction=popup

# Scroll action: cycle-clocks, none
ScrollAction=cycle-clocks

# Show timezone in tray tooltip
TrayTooltip=true

[Popup]
# Popup window settings

# Show all clocks in popup
ShowAllInPopup=true

# Quick timezone search
QuickSearch=true

# Show timezone map
ShowMap=false

# Map style: simple, detailed, satellite
MapStyle=simple

# Add clock from popup
AllowAddClock=true

[Clocks]
# Configured world clocks (up to MaxClocks)
# Format: Name=Timezone|CustomLabel|Enabled

# Default clocks (examples - user should customize)
Clock1=America/New_York|New York|true
Clock2=Europe/London|London|true
Clock3=Europe/Paris|Paris|true
Clock4=Asia/Tokyo|Tokyo|true
Clock5=Asia/Shanghai|Shanghai|true
Clock6=Australia/Sydney|Sydney|true
Clock7=America/Los_Angeles|Los Angeles|true
Clock8=Asia/Dubai|Dubai|false

# User can add more using UI

[QuickAdd]
# Popular cities for quick addition
PopularCities=New York,London,Tokyo,Paris,Sydney,Dubai,Singapore,Hong Kong,Mumbai,Berlin,Moscow,São Paulo,Toronto,Chicago,San Francisco

[Meetings]
# Meeting planner integration

# Enable meeting time planner
MeetingPlanner=true

# Find overlapping business hours
FindOverlap=true

# Minimum overlap required (minutes)
MinOverlapMinutes=60

# Include weekends in planning
IncludeWeekends=false

# Time slot suggestions
SuggestSlots=true

# Copy meeting time to clipboard
CopyFormat={time} {timezone} / {utc}

[Notifications]
# Time-based notifications

# Notify at specific times in other zones
TimeNotifications=false

# Example: Notify when it's 9 AM in Tokyo
# Notification1=Asia/Tokyo|09:00|Tokyo office opens

[Shortcuts]
# Keyboard shortcuts

# Toggle world clock widget
ToggleWidget=Meta+W

# Add new clock
AddClock=Meta+Shift+W

# Open meeting planner
MeetingPlanner=Meta+Alt+W

# Quick time conversion
QuickConvert=Meta+Ctrl+T

[Sync]
# Sync world clocks across devices
SyncEnabled=true

# Sync via Sanchala Cloud
CloudSync=true

# Export/import format
ExportFormat=json
