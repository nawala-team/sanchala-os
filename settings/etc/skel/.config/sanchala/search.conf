# ============================================================
# SANCHALA OS - Unified Search Configuration
# ============================================================
# Spotlight-like search experience settings
# Integrates Baloo, KRunner, and custom providers
# ============================================================

[General]
# Search activation shortcut
ActivationShortcut=Meta+Space
SecondaryShortcut=Alt+Space

# Search scope
DefaultScope=all
# Options: all, apps, files, settings, web, calculator

# Instant search (search as you type)
InstantSearch=true
InstantSearchDelay=150

# Minimum characters before search
MinSearchLength=2

# Maximum results per category
MaxResultsPerCategory=5

[Categories]
# Category display order and weights
# Higher weight = shown first in mixed results

[Categories][Applications]
Enabled=true
Weight=100
Icon=applications-other
MaxResults=8
SearchName=true
SearchDescription=true
SearchKeywords=true
SearchExec=false

[Categories][Files]
Enabled=true
Weight=90
Icon=folder
MaxResults=10
SearchContent=true
SearchPath=true
IncludeHidden=false
RespectPrivacy=true

[Categories][Documents]
Enabled=true
Weight=85
Icon=x-office-document
MaxResults=8
ContentSearch=true
SupportedTypes=pdf,doc,docx,odt,txt,md,rtf,epub

[Categories][Settings]
Enabled=true
Weight=80
Icon=preferences-system
MaxResults=6
SearchDescriptions=true

[Categories][Calculator]
Enabled=true
Weight=95
Icon=accessories-calculator
Triggers==,calc,calculate
CopyResultOnEnter=true
ShowHistory=true
HistorySize=20

[Categories][UnitConverter]
Enabled=true
Weight=75
Icon=view-measurement
Triggers=convert,in,to
Categories=length,weight,temperature,volume,speed,data,time,currency
EnableCurrency=false

[Categories][Dictionary]
Enabled=true
Weight=70
Icon=accessories-dictionary
Triggers=define,meaning,def
OfflineDictionary=true
DictionaryPath=/usr/share/dict

[Categories][WebSearch]
Enabled=true
Weight=50
Icon=internet-web-browser
DefaultEngine=duckduckgo
ShowSuggestions=false
RequirePrefix=true

[Categories][RecentFiles]
Enabled=true
Weight=60
Icon=document-open-recent
MaxResults=5
MaxAgeDays=7

[Categories][Contacts]
Enabled=false
Weight=40
Icon=view-pim-contacts

[Categories][Bookmarks]
Enabled=true
Weight=55
Icon=bookmarks
SearchBrowser=true
SearchPlaces=true

[Categories][SystemCommands]
Enabled=true
Weight=65
Icon=system-run
Commands=lock,logout,shutdown,restart,suspend,hibernate,settings

[Categories][Windows]
Enabled=true
Weight=70
Icon=preferences-system-windows
SearchTitle=true
SearchClass=false

[Appearance]
# Visual settings
Theme=system
Width=680
MaxHeight=500
CornerRadius=12
BlurBackground=true
Animations=true
AnimationDuration=150

# Result display
ShowIcons=true
IconSize=32
ShowDescriptions=true
ShowCategory=true
ShowShortcuts=true
HighlightMatches=true

[Privacy]
# Search history
EnableHistory=true
HistorySize=100
ClearHistoryOnLogout=false

# Excluded from search
ExcludedApps=
ExcludedPaths=$HOME/.gnupg,$HOME/.ssh,$HOME/.password-store

# Network searches
AllowNetworkSearch=false
AllowSearchSuggestions=false

[Performance]
# Caching
EnableCache=true
CacheTimeout=300
ApplicationCacheRefresh=3600

# Indexing
IndexPriority=idle
MaxMemoryMB=256
MaxCPUPercent=25

[Actions]
# Default actions for result types
ApplicationAction=launch
FileAction=open
FolderAction=open
URLAction=browser
CalculatorAction=copy

# Secondary actions (Ctrl+Enter)
ApplicationSecondary=open-location
FileSecondary=reveal
FolderSecondary=terminal
