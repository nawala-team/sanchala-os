# ============================================================
# SANCHALA OS - Search Calculator Configuration
# ============================================================
# Instant calculations in unified search
# Supports math, unit conversion, date math
# ============================================================

[General]
Enabled=true
TriggerPrefix==
AlternativePrefixes=calc,calculate,math
CopyOnEnter=true
ShowHistory=true
HistorySize=50

[Display]
DecimalPrecision=10
UseThousandsSeparator=true
ThousandsSeparator=,
DecimalSeparator=.
ScientificNotationThreshold=1000000000
ShowIntermediateSteps=false

[Features]
# Basic arithmetic: +, -, *, /, %, ^
BasicArithmetic=true

# Parentheses and order of operations
Parentheses=true

# Mathematical functions
Functions=true
# Supported: sin, cos, tan, asin, acos, atan
#            sinh, cosh, tanh
#            sqrt, cbrt, root(n,x)
#            log, log10, log2, ln
#            exp, pow, abs, ceil, floor, round
#            min, max, avg, sum
#            factorial (!), gcd, lcm
#            rad, deg (angle conversion)

# Constants
Constants=true
# Supported: pi, e, phi (golden ratio), sqrt2, sqrt3

# Base conversion
BaseConversion=true
# Hex: 0xFF, 0xff, FFh
# Binary: 0b1010, 1010b
# Octal: 0o77, 77o
# Conversion: toHex(), toBin(), toOct(), toDec()

# Bitwise operations
BitwiseOperations=true
# Supported: & (and), | (or), ^ (xor), ~ (not), << (shift left), >> (shift right)

# Percentage calculations
Percentage=true
# Examples: 20% of 150, 150 + 20%, what % of 200 is 50

# Currency (disabled by default - requires network)
Currency=false
CurrencyUpdateInterval=3600
CurrencyAPIKey=

[UnitConversion]
Enabled=true

[UnitConversion][Length]
Enabled=true
Units=km,m,cm,mm,um,nm,mi,yd,ft,in,nmi,ly,au,pc
DefaultFrom=m
DefaultTo=ft

[UnitConversion][Weight]
Enabled=true
Units=kg,g,mg,ug,t,lb,oz,st,ton
DefaultFrom=kg
DefaultTo=lb

[UnitConversion][Temperature]
Enabled=true
Units=C,F,K,R
DefaultFrom=C
DefaultTo=F

[UnitConversion][Volume]
Enabled=true
Units=L,mL,m3,cm3,gal,qt,pt,cup,floz,tbsp,tsp
DefaultFrom=L
DefaultTo=gal

[UnitConversion][Area]
Enabled=true
Units=km2,m2,cm2,mm2,ha,ac,mi2,yd2,ft2,in2
DefaultFrom=m2
DefaultTo=ft2

[UnitConversion][Speed]
Enabled=true
Units=m/s,km/h,mph,kn,ft/s,mach
DefaultFrom=km/h
DefaultTo=mph

[UnitConversion][Time]
Enabled=true
Units=s,ms,us,ns,min,h,day,week,month,year
DefaultFrom=h
DefaultTo=min

[UnitConversion][Data]
Enabled=true
Units=b,B,Kb,KB,Mb,MB,Gb,GB,Tb,TB,Pb,PB,Kib,KiB,Mib,MiB,Gib,GiB,Tib,TiB
DefaultFrom=MB
DefaultTo=GB

[UnitConversion][Pressure]
Enabled=true
Units=Pa,kPa,MPa,bar,mbar,atm,psi,mmHg,inHg,torr
DefaultFrom=bar
DefaultTo=psi

[UnitConversion][Energy]
Enabled=true
Units=J,kJ,MJ,cal,kcal,Wh,kWh,BTU,eV
DefaultFrom=kWh
DefaultTo=J

[UnitConversion][Power]
Enabled=true
Units=W,kW,MW,hp,BTU/h,cal/s
DefaultFrom=kW
DefaultTo=hp

[DateCalculations]
Enabled=true
# Examples:
# "today + 30 days"
# "days until 2025-01-01"
# "days between 2024-01-01 and 2024-12-31"
# "2024-06-15 + 2 weeks"
Formats=ISO,US,EU
DefaultFormat=ISO
