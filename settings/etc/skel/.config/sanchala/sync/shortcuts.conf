# ============================================================================
# SANCHALA OS - Global Keyboard Shortcuts for Device Sync
# ============================================================================
# Location: ~/.config/sanchala/sync/shortcuts.conf
# Quick access to sync features
# ============================================================================

[Shortcuts]
# Quick Share (select file dialog)
QuickShare=Meta+Shift+S

# Share Clipboard to Phone
ShareClipboard=Meta+Shift+C

# Find My Phone
FindPhone=Meta+Shift+F

# Open SMS App
OpenSMS=Meta+Shift+M

# Open Syncthing GUI
OpenSyncthing=Meta+Shift+Y

# Toggle Sync Status Panel
SyncStatus=Meta+Shift+D

# Pair New Device
PairDevice=Meta+Shift+P
