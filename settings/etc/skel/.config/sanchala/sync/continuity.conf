# ============================================================================
# SANCHALA OS - Continuity Features Configuration
# ============================================================================
# Location: ~/.config/sanchala/sync/continuity.conf
# Apple Continuity-like seamless device integration
# ============================================================================

[Handoff]
# Enable activity handoff between devices
Enabled=true

# Handoff indicator location: dock, tray, both
IndicatorLocation=dock

# Auto-detect nearby devices for handoff
ProximityDetection=true

# Bluetooth LE for proximity
BluetoothLE=true

# Activity timeout before handoff expires (seconds)
ActivityTimeout=300

# Minimum activity duration before advertising (seconds)
MinActivityDuration=5

[Handoff][Browsing]
# Browser tab handoff
Enabled=true
SupportedBrowsers=brave-browser,firefox,chromium,vivaldi
SyncCurrentTab=true
SyncTabHistory=false
MaxHistoryItems=10

[Handoff][Editing]
# Document editing handoff
Enabled=true
SupportedApps=org.kde.kate,libreoffice-writer,libreoffice-calc,libreoffice-impress
AutoSaveBeforeHandoff=true
SyncCursorPosition=true
SyncSelections=true

[Handoff][Media]
# Media playback handoff
Enabled=true
SupportedApps=elisa,vlc,mpv,spotify
SyncPlaybackPosition=true
SyncVolume=false

[UniversalControl]
# Control multiple devices with one keyboard/mouse
Enabled=false
Position=auto
EdgeTrigger=true
EdgeDelay=500

[ContinuityCamera]
# Use phone camera as webcam
Enabled=true
PreferredResolution=1080p
AutoConnect=false
ShowInVideoApps=true
BackCamera=true
FrontCamera=true
DefaultCamera=back

[ContinuitySketch]
# Draw on phone, appears on desktop
Enabled=true
CanvasSize=1920x1080
PressureSensitivity=true
PalmRejection=true

[ContinuityMarkup]
# Annotate documents/images using phone
Enabled=true
SupportedApps=org.kde.gwenview,org.kde.okular,libreoffice
ToolbarVisible=true

[InstantHotspot]
# Automatically use phone's hotspot
Enabled=true
AutoConnect=true
RequireUnlockedPhone=true
PreferWiFi=true
ShowDataUsage=true

[AirPlay]
# Stream content to/from devices
Enabled=true
ReceiverEnabled=true
SenderEnabled=true
Quality=auto
AudioOnly=false

[Sidecar]
# Use tablet as secondary display
Enabled=true
Resolution=auto
Position=right
ShowSidebar=true
EnableTouch=true
EnablePencil=true
MirrorMode=false
