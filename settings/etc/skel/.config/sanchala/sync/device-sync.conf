# ============================================================================
# SANCHALA OS - Device Sync Master Configuration
# ============================================================================
# Location: ~/.config/sanchala/sync/device-sync.conf
# Apple Continuity-level unified device synchronization
# ============================================================================

[General]
# Enable Sanchala Device Sync
Enabled=true

# Sync service backend
Backend=kdeconnect+syncthing

# Data directory
DataDir=~/.local/share/sanchala/sync

# Cache directory
CacheDir=~/.cache/sanchala/sync

# Log file
LogFile=~/.local/share/sanchala/sync/sync.log

# Unique device identifier (auto-generated)
# DeviceID=

[Discovery]
# Auto-discover nearby devices
AutoDiscover=true

# Discovery methods: local, bluetooth, cloud
DiscoveryMethods=local,bluetooth

# mDNS/Bonjour discovery
mDNSEnabled=true

# Bluetooth LE discovery
BluetoothLEEnabled=true

# Trusted network auto-connect
TrustedNetworkAutoConnect=true

# Discovery interval (seconds)
DiscoveryInterval=30

[Pairing]
# Require manual approval for new devices
RequireApproval=true

# Auto-approve devices from same account
AutoApproveAccount=true

# Pairing timeout (seconds)
PairingTimeout=60

# Maximum paired devices
MaxPairedDevices=10

# Show pairing QR code
QRCodePairing=true

# Bluetooth pairing enabled
BluetoothPairing=true

[Handoff]
# Enable Handoff (continue activity on another device)
Enabled=true

# Supported activity types
SupportedActivities=browsing,editing,viewing,composing

# Handoff indicator in dock
ShowInDock=true

# Handoff proximity detection
ProximityDetection=true

# Handoff timeout (seconds)
ActivityTimeout=300

# Apps supporting Handoff
HandoffApps=brave-browser,firefox,chromium,org.kde.kate,libreoffice-writer,org.kde.dolphin,org.kde.gwenview

[Handoff][browsing]
# Browser tab handoff
Enabled=true
SupportedBrowsers=brave-browser,firefox,chromium
SyncTabs=true
SyncHistory=false

[Handoff][editing]
# Document editing handoff
Enabled=true
SupportedApps=org.kde.kate,libreoffice-writer,libreoffice-calc
AutoSave=true
SyncCursor=true

[AirDrop]
# Sanchala Drop - AirDrop-like file sharing
Enabled=true

# Service name
ServiceName=Sanchala Drop

# Accept from: everyone, contacts, nobody
AcceptFrom=contacts

# Download directory
DownloadDir=~/Downloads/Sanchala Drop

# Auto-accept from trusted devices
AutoAcceptTrusted=true

# Maximum file size (bytes, 0 = unlimited)
MaxFileSize=0

# Show notification on receive
NotifyOnReceive=true

# Compression enabled
CompressTransfers=true

# Encryption required
EncryptionRequired=true

[UniversalClipboard]
# Cross-device clipboard sync
Enabled=true

# Provider: kdeconnect, custom
Provider=kdeconnect

# Auto-sync on copy
AutoSync=true

# Sync types
SyncText=true
SyncImages=true
SyncFiles=false
SyncURLs=true

# Maximum sync size (bytes)
MaxSyncSize=10485760

# Encryption for clipboard sync
EncryptClipboard=true

# Privacy: exclude sensitive content
ExcludeSensitive=true

# Sensitive patterns
SensitivePatterns=password,secret,token,api_key,credit_card

# Show notification on receive
NotifyOnReceive=true

[Continuity]
# Continuity Camera - use phone camera on desktop
CameraEnabled=true

# Continuity Sketch - draw on phone, appears on desktop
SketchEnabled=true

# Continuity Markup - annotate on phone
MarkupEnabled=true

# Auto iPhone Hotspot
AutoHotspot=true

# Instant Hotspot discovery
InstantHotspot=true

# SMS/iMessage relay
SMSRelay=true

# Phone calls relay
CallsRelay=true

[Continuity][Camera]
# Use phone as webcam
Enabled=true
PreferredResolution=1080p
AutoConnect=false
ShowInVideoApps=true

[Continuity][Sketch]
Enabled=true
CanvasSize=1024x768
PressureSensitivity=true
