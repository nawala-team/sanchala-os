# ============================================================================
# SANCHALA OS - File Sync Configuration
# ============================================================================
# Location: ~/.config/sanchala/sync/file-sync.conf
# iCloud-like seamless file synchronization
# ============================================================================

[General]
# Enable file synchronization
Enabled=true

# Primary sync backend: syncthing, kdeconnect, nextcloud
Backend=syncthing

# Secondary backend for quick transfers
QuickTransferBackend=kdeconnect

# Data directory
DataDir=~/.local/share/sanchala/sync/files

# Sync status database
StatusDB=~/.local/share/sanchala/sync/files/status.db

[Syncthing]
# Syncthing integration
Enabled=true

# Config directory
ConfigDir=~/.config/syncthing

# API address
APIAddress=127.0.0.1:8384

# Auto-start syncthing
AutoStart=true

# Start minimized
StartMinimized=true

# System tray icon
ShowTrayIcon=true

# Sync status in file manager
FileManagerIntegration=true

[DefaultFolders]
# Auto-configured sync folders

[DefaultFolders][Documents]
Enabled=true
LocalPath=~/Documents
SyncWithPhone=true
SyncWithCloud=true
Versioning=staggered
ConflictResolution=newer

[DefaultFolders][Pictures]
Enabled=true
LocalPath=~/Pictures
SyncWithPhone=true
SyncWithCloud=true
Versioning=simple
ConflictResolution=keep_both

[DefaultFolders][Music]
Enabled=true
LocalPath=~/Music
SyncWithPhone=false
SyncWithCloud=true
Versioning=none
ConflictResolution=newer

[DefaultFolders][Videos]
Enabled=false
LocalPath=~/Videos
SyncWithPhone=false
SyncWithCloud=true
Versioning=none
ConflictResolution=newer

[DefaultFolders][Desktop]
Enabled=true
LocalPath=~/Desktop
SyncWithPhone=false
SyncWithCloud=true
Versioning=simple
ConflictResolution=newer

[DefaultFolders][Downloads]
Enabled=false
LocalPath=~/Downloads
SyncWithPhone=false
SyncWithCloud=false
Versioning=none
ConflictResolution=keep_both

[PhoneSync]
# Phone file synchronization via KDE Connect
Enabled=true

# Auto-mount phone storage
AutoMount=false

# Mount point
MountPoint=~/Phone

# Photo import
PhotoImportEnabled=true
PhotoImportPath=~/Pictures/Phone
PhotoImportDeleteAfter=false

# Music sync to phone
MusicSyncEnabled=true
MusicSyncPath=Music

# Document sync
DocumentSyncEnabled=true
DocumentSyncPath=Documents

[Versioning]
# File versioning settings
Enabled=true

# Default versioning type: simple, staggered, trashcan
DefaultType=staggered

# Version storage
VersionsPath=~/.local/share/sanchala/sync/versions

# Cleanup interval (hours)
CleanupInterval=24

[Versioning][simple]
# Keep last N versions
Keep=5

[Versioning][staggered]
# Staggered versioning
MaxAge=365
CleanInterval=3600

[Versioning][trashcan]
# Trashcan versioning
CleanoutDays=30

[Conflicts]
# Conflict resolution
DefaultResolution=keep_both

# Conflict notification
NotifyOnConflict=true

# Conflict folder
ConflictFolder=.sync-conflicts

# Auto-resolve identical files
AutoResolveIdentical=true

[Bandwidth]
# Bandwidth management
LimitEnabled=false

# Upload limit (KiB/s, 0 = unlimited)
UploadLimit=0

# Download limit (KiB/s, 0 = unlimited)
DownloadLimit=0

# Limit on battery
LimitOnBattery=true
BatteryUploadLimit=500
BatteryDownloadLimit=1000

# Limit on metered connection
LimitOnMetered=true
MeteredUploadLimit=100
MeteredDownloadLimit=500

[IgnorePatterns]
# Files/folders to ignore
Patterns=.DS_Store,Thumbs.db,desktop.ini,*.tmp,*.temp,~*,.~lock.*,*.swp,*.swo,.git,.svn,.hg,node_modules,.cache,__pycache__,*.pyc,.Trash*,.trash*

# Large file threshold (bytes) - warn before syncing
LargeFileThreshold=104857600

# Warn on large files
WarnLargeFiles=true
