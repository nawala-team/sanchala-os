# ============================================================================
# SANCHALA OS - Calendar Event Notifications Configuration
# ============================================================================
# Location: ~/.config/sanchala/calendar-notifications.conf
# Advanced calendar event reminders and notification system
# ============================================================================

[General]
Enabled=true
Service=org.sanchala.CalendarNotify
AutoStart=true
CheckInterval=60
MonitoredCalendars=

[Reminders]
DefaultReminders=15,60,1440
MultipleReminders=true
MaxRemindersPerEvent=5
NewEventDefaultReminder=15
AllDayReminderTime=09:00
AllDayReminderDays=1

[NotificationTypes]
MeetingPriority=high
MeetingSound=reminder
MeetingPersistent=true
AllDayPriority=normal
AllDaySound=soft-chime
AllDayPersistent=false
BirthdayPriority=normal
BirthdaySound=celebration
TaskPriority=high
TaskSound=reminder
RecurringPriority=normal

[SmartReminders]
Enabled=true
TravelTimeAware=true
TravelTimeService=maps
TrafficAware=true
WeatherAware=true
BadWeatherBuffer=15
LearnPatterns=true
MeetingPrepTime=5
PresentationPrepTime=30
InterviewPrepTime=60
LocationAware=true

[Display]
ShowTitle=true
ShowTime=true
ShowLocation=true
ShowDescription=true
DescriptionMaxLength=100
ShowCalendarColor=true
ShowAttendees=true
ShowVideoLink=true
ShowTravelTime=true

[Actions]
ActionsEnabled=true
Action1=join|Join Meeting|video-call
Action2=snooze|Snooze 5 min|clock
Action3=dismiss|Dismiss|close
Action4=open|Open Event|calendar
OneClickJoin=true
VideoServices=zoom,meet,teams,webex,jitsi
DefaultSnooze=5
SnoozeOptions=5,10,15,30,60
QuickRSVP=true

[Sounds]
SoundsEnabled=true
CriticalSound=urgent-reminder
HighSound=reminder
NormalSound=soft-chime
LowSound=subtle
CalendarSounds=true
Volume=80
UseSystemVolume=true
RespectQuietHours=true

[Persistence]
PersistentNotifications=true
AutoDismissAfterStart=5
PersistAllDay=false
HistoryRetentionDays=30

[Sync]
SyncInterval=15
BackgroundSync=true
OfflineMode=true
CacheAheadDays=14
NotifySyncFailure=true

[DayView]
MorningAgenda=true
MorningAgendaTime=07:30
AgendaSummary=true
EveningPreview=true
EveningPreviewTime=21:00
WeeklyAgenda=true
WeeklyAgendaDay=Monday
WeeklyAgendaTime=08:00

[Conflicts]
ConflictDetection=true
ConflictPriority=high
DoubleBookWarning=true
TravelConflicts=true
SuggestResolution=true

[Focus]
RespectFocusMode=true
FocusExempt=urgent,medical,family
ShowUpcomingInFocus=true
FocusPreviewMinutes=5

[Privacy]
LockScreenDetails=minimal
SensitiveCalendars=
RequireAuthForDetails=false

[Integration]
KDECalendarIntegration=true
GNOMECalendarIntegration=true
ThunderbirdIntegration=true
CalDAVIntegration=true
GoogleCalendarIntegration=true
Microsoft365Integration=true

[Shared]
InviteNotifications=true
UpdateNotifications=true
CancellationNotifications=true
RSVPNotifications=true
SharedCalendarChanges=true

[Shortcuts]
TodayView=Meta+Shift+T
NextEvent=Meta+N
Dismiss=Escape
Snooze=Space
JoinMeeting=Meta+J

[Accessibility]
VoiceAnnouncements=true
ReadEventDetails=true
AnnounceTimeUntil=true
HighContrast=true
ScreenReaderSupport=true
