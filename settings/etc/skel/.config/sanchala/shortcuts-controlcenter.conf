# Sanchala Control Center - Keyboard Shortcuts
# Global shortcuts for quick settings access

[Global]
# Open Control Center popup
Meta+C=org.sanchala.controlcenter,toggle

[QuickToggles]
# Toggle WiFi on/off
Meta+F1=wifi toggle

# Toggle Bluetooth on/off
Meta+F2=bluetooth toggle

# Toggle Do Not Disturb
Meta+F3=dnd toggle

# Toggle Dark/Light mode
Meta+F4=sanchala-theme-switch toggle

# Toggle Night Light
Meta+F5=nightlight toggle

# Toggle Focus Mode (cycle through modes)
Meta+F6=focus cycle

[Volume]
# Volume up (also works with media keys)
XF86AudioRaiseVolume=volume +5%

# Volume down
XF86AudioLowerVolume=volume -5%

# Toggle mute
XF86AudioMute=volume mute

# Microphone mute
XF86AudioMicMute=microphone mute

[Brightness]
# Brightness up (also works with media keys)
XF86MonBrightnessUp=brightness +5%

# Brightness down
XF86MonBrightnessDown=brightness -5%

# Toggle keyboard backlight
XF86KbdBrightnessUp=kbd-backlight +20%
XF86KbdBrightnessDown=kbd-backlight -20%

[Media]
# Play/Pause
XF86AudioPlay=media playpause

# Next track
XF86AudioNext=media next

# Previous track
XF86AudioPrev=media previous

# Stop
XF86AudioStop=media stop
