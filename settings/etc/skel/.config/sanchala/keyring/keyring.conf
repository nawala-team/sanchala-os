# ============================================================================
# SANCHALA OS - GNOME Keyring User Configuration
# ============================================================================
# Per-user keyring settings (copied to ~/.config/sanchala/keyring/)
# ============================================================================

[keyring]
# Default keyring for new items
default-keyring = login

# Auto-unlock login keyring on session start
auto-unlock-login = true

# Lock keyrings on screen lock
lock-on-screenlock = false

# Lock keyrings after idle (minutes, 0=never)
lock-on-idle = 0

# Confirm before exposing secrets to applications
confirm-access = false

# Show notification when keyring is accessed
notify-on-access = false

[storage]
# Keyring file location
# Default: ~/.local/share/keyrings/
keyring-path = default

# Encryption algorithm
encryption = aes-256-gcm

# Key derivation
key-derivation = argon2id

[integration]
# Allow SSH agent integration
ssh-agent = true

# Allow GPG agent integration  
gpg-agent = false

# Allow secret service D-Bus API
secret-service = true

# Allowed applications (empty = all allowed)
# allowed-apps = firefox,chrome,brave

[backup]
# Enable encrypted keyring backup
backup-enabled = false

# Backup location
backup-path = ~/.local/share/keyrings/backup/

# Backup frequency (days)
backup-interval = 7
