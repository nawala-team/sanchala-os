# ============================================================
# SANCHALA OS - Content Search Configuration
# ============================================================
# Deep search inside documents, PDFs, source code
# Powered by Baloo with enhanced extractors
# ============================================================

[General]
# Enable content indexing
Enabled=true

# Index new files immediately
RealTimeIndexing=true

# Reindex interval (hours, 0=manual only)
ReindexInterval=168

[DocumentTypes]
# ============================================================
# Supported Document Types for Content Search
# ============================================================

[DocumentTypes][PlainText]
Enabled=true
Extensions=txt,text,log,cfg,conf,ini,yml,yaml,json,xml,csv,tsv
MaxSize=10485760
Extractor=internal

[DocumentTypes][Markdown]
Enabled=true
Extensions=md,markdown,mdown,mkd,rst,adoc,asciidoc
MaxSize=5242880
Extractor=internal
StripFormatting=true

[DocumentTypes][SourceCode]
Enabled=true
Extensions=py,js,ts,java,c,cpp,h,hpp,rs,go,rb,php,swift,kt,scala,sh,bash,zsh,ps1,sql,html,css,scss,sass,less,vue,jsx,tsx
MaxSize=2097152
Extractor=internal
IndexComments=true
IndexStrings=true
IndexFunctions=true

[DocumentTypes][PDF]
Enabled=true
Extensions=pdf
MaxSize=52428800
Extractor=poppler
OCREnabled=false
OCRLanguages=eng

[DocumentTypes][Office]
Enabled=true
Extensions=doc,docx,xls,xlsx,ppt,pptx,odt,ods,odp,odg,rtf
MaxSize=52428800
Extractor=libreoffice

[DocumentTypes][Ebooks]
Enabled=true
Extensions=epub,mobi,azw,azw3,fb2
MaxSize=52428800
Extractor=ebook-tools

[DocumentTypes][Archives]
Enabled=false
Extensions=zip,tar,gz,bz2,xz,7z,rar
MaxSize=104857600
Extractor=libarchive
IndexFileNames=true
IndexContent=false

[DocumentTypes][Images]
Enabled=true
Extensions=jpg,jpeg,png,gif,webp,tiff,bmp,svg,heic,heif,raw,cr2,nef
MaxSize=104857600
Extractor=exiv2
IndexMetadata=true
IndexOCR=false

[DocumentTypes][Audio]
Enabled=true
Extensions=mp3,flac,ogg,opus,m4a,aac,wav,wma,aiff
MaxSize=0
Extractor=taglib
IndexMetadata=true
IndexTitle=true
IndexArtist=true
IndexAlbum=true
IndexGenre=true
IndexLyrics=false

[DocumentTypes][Video]
Enabled=true
Extensions=mp4,mkv,webm,avi,mov,wmv,flv,m4v
MaxSize=0
Extractor=ffmpeg
IndexMetadata=true
IndexSubtitles=false

[Extractors]
# ============================================================
# Content Extractor Configuration
# ============================================================

[Extractors][poppler]
# PDF text extraction
Path=/usr/bin/pdftotext
Arguments=-layout -enc UTF-8 "{input}" -
Timeout=30

[Extractors][libreoffice]
# Office document extraction
Path=/usr/bin/soffice
Arguments=--headless --cat "{input}"
Timeout=60

[Extractors][ebook-tools]
Path=/usr/bin/ebook-convert
Arguments="{input}" /dev/stdout --txt-output-encoding=utf-8
Timeout=60

[Extractors][exiv2]
Path=/usr/bin/exiv2
Arguments=-pa "{input}"
Timeout=10

[Extractors][taglib]
# Audio metadata via KFileMetaData
UseKFileMetaData=true

[Extractors][ffmpeg]
Path=/usr/bin/ffprobe
Arguments=-v quiet -print_format json -show_format "{input}"
Timeout=15

[Performance]
# ============================================================
# Indexing Performance
# ============================================================
# Maximum concurrent extraction processes
MaxConcurrent=2

# Memory limit per extractor (MB)
ExtractorMemoryLimit=512

# Timeout per file (seconds)
DefaultTimeout=60

# Skip files that fail extraction
SkipOnError=true

# Log extraction errors
LogErrors=true
ErrorLogPath=$HOME/.local/share/sanchala/content-search-errors.log

[Privacy]
# ============================================================
# Privacy Settings for Content Search
# ============================================================
# Encrypt content index
EncryptIndex=false

# Excluded patterns (content not indexed)
ExcludedPatterns=*password*,*secret*,*private*,*.key,*.pem,*.p12

# Exclude files with these permissions
ExcludeGroupReadable=false
ExcludeWorldReadable=false

# Respect .noindex marker files
RespectNoIndex=true
