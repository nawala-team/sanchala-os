# ============================================================================
# SANCHALA OS - Timer & Alarm Application Configuration
# ============================================================================
# Location: ~/.config/sanchala/timer-alarm.conf
# Comprehensive timer, alarm, stopwatch, and Pomodoro functionality
# ============================================================================

[General]
Enabled=true
BackgroundService=true
AutoStart=true
DBusService=org.sanchala.TimeKeeper

[Alarms]
MaxAlarms=50
DefaultSnoozeDuration=9
MaxSnoozeCount=5
GradualWakeup=true
FadeInDuration=30
PreAlarm=true
PreAlarmMinutes=5
PreAlarmVolume=20
SmartAlarm=false
SmartAlarmWindow=30
DefaultAlarmSound=gentle-wake
AlarmSoundsPath=/usr/share/sanchala/sounds/alarms/
VibrationEnabled=true
VibrationPattern=long,short,long
MissedAlarmNotify=true
SkipHolidays=false

[AlarmTypes]
OneTime=true
Recurring=true
RecurringPatterns=daily,weekdays,weekends,weekly,monthly,yearly,custom
AllowLabels=true
MaxLabelLength=100
Categories=wake,medication,meeting,reminder,custom

[Timers]
MaxTimers=20
Preset1=1 minute=60
Preset2=3 minutes=180
Preset3=5 minutes=300
Preset4=10 minutes=600
Preset5=15 minutes=900
Preset6=30 minutes=1800
Preset7=1 hour=3600
Preset8=2 hours=7200
CustomPresets=true
DefaultTimerSound=timer-complete
TimerSoundsPath=/usr/share/sanchala/sounds/timers/
AllowRepeat=true
NotifyOnComplete=true
NotifyAt=1min,30sec,10sec
VisualTimer=true
KeepScreenOn=false

[Stopwatch]
MaxLaps=999
LapFormat=mm:ss.SSS
AutoSave=true
Precision=10
LapComparison=true
ExportEnabled=true
ExportFormats=csv,json,txt

[Pomodoro]
Enabled=true
WorkDuration=25
ShortBreakDuration=5
LongBreakDuration=15
PomodorosBeforeLongBreak=4
AutoStartBreak=true
AutoStartWork=false
DailyGoal=8
TrackHistory=true
AllowTags=true
BreakSuggestions=true
BreakActivities=stretch,walk,water,eyes-rest,breathe
EnableFocusMode=true
FocusModeProfile=pomodoro
ShowStatistics=true
WeeklyReport=true

[WorldClock]
ShowWorldClocks=true
TimezoneAlarms=true

[Sounds]
AlarmSounds=gentle-wake,classic-bell,digital-beep,nature-birds,ocean-waves
TimerSounds=timer-complete,bell-ding,kitchen-timer,meditation-bowl
CustomSoundsDir=~/.local/share/sanchala/sounds/
MaxCustomSoundDuration=60
SoundPreview=true
MusicAlarmEnabled=true
MusicServices=spotify,local,radio

[Notifications]
UseSystemNotifications=true
PersistentTimerNotification=true
AlarmNotificationCritical=true
BypassDND=true
FullScreenAlarm=true
LockScreenAlarm=true

[Widget]
WidgetEnabled=true
WidgetMode=compact
SystemTrayIcon=true
PlasmaWidget=true
QuickTimerEnabled=true

[Calendar]
CalendarSync=true
CreateCalendarEvents=false
ImportEventsAsAlarms=true
EventLeadTimes=5,15,30,60

[Sync]
SyncEnabled=true
CloudSync=true
SyncActiveTimers=false
SyncPomodoroStats=true

[Shortcuts]
OpenApp=Meta+A
QuickAlarm=Meta+Shift+A
QuickTimer=Meta+T
ToggleStopwatch=Meta+Shift+S
StartPomodoro=Meta+P
DismissAlarm=Escape
SnoozeAlarm=Space

[Accessibility]
VoiceAnnouncements=true
AnnounceTimeRemaining=true
AnnounceIntervals=5min,1min,30sec,10sec
HighContrastSupport=true
LargeTextSupport=true
HapticFeedback=true
ScreenReaderSupport=true

[Advanced]
PersistAlarms=true
AutoBackup=true
BackupPath=~/.local/share/sanchala/timekeeper/backup/
WakeFromSuspend=true
UseRTCAlarm=true
PowerManagement=true
DebugLogging=false
