# ============================================
# SANCHALA OS - Keyboard Navigation Configuration
# ============================================
# Full keyboard-only navigation support
# WCAG 2.1 AA: 2.1.1 Keyboard, 2.1.2 No Keyboard Trap
# ~/.config/sanchala/accessibility/keyboard-nav.conf
# ============================================

[General]
# Enable enhanced keyboard navigation
Enabled=true

# Show focus indicators always (not just on keyboard use)
AlwaysShowFocus=true

# Focus indicator visibility timeout (0 = always visible)
FocusTimeout=0

[FocusIndicator]
# Enhanced focus ring for WCAG compliance
# Minimum 2px width, high contrast color
Width=3
Color=#1A73E8
Style=solid
Offset=2

# Focus indicator for high contrast mode
HighContrastWidth=4
HighContrastColor=#FFFFFF
HighContrastOutline=#000000

[TabNavigation]
# Tab key cycles through all focusable elements
TabCycleAll=true

# Include toolbar buttons in tab order
IncludeToolbars=true

# Include menu items in tab order (when menu open)
IncludeMenus=true

# Skip disabled elements
SkipDisabled=true

# Tab wrap (cycle from last to first element)
TabWrap=true

[ArrowNavigation]
# Arrow key navigation within components
EnableArrowNav=true

# Spatial navigation (move focus to nearest element in direction)
SpatialNavigation=false

# Arrow navigation in lists and grids
ListNavigation=true
GridNavigation=true

[Shortcuts]
# System-wide keyboard shortcuts for accessibility
# These supplement kglobalshortcutsrc

# Skip to main content
SkipToMain=Alt+1

# Skip to navigation
SkipToNav=Alt+2

# Skip to search
SkipToSearch=Alt+3

# Open accessibility quick settings
AccessibilityPanel=Super+U

# Toggle high contrast
ToggleHighContrast=Super+Alt+H

# Toggle large text
ToggleLargeText=Super+Alt+T

# Toggle screen reader
ToggleScreenReader=Alt+Super+S

# Toggle magnifier
ToggleMagnifier=Super+Alt+M

# Increase magnification
MagnifyIn=Super+Plus

# Decrease magnification
MagnifyOut=Super+Minus

# Toggle sticky keys
ToggleStickyKeys=Shift+Shift+Shift+Shift+Shift

# Toggle mouse keys
ToggleMouseKeys=Alt+Shift+Num_Lock

# Move focus to notification
FocusNotification=Super+N

# Dismiss notification
DismissNotification=Super+Shift+N

[MouseKeys]
# Control mouse pointer with keyboard (numpad)
Enabled=false

# Movement keys (numpad)
MoveUp=KP_8
MoveDown=KP_2
MoveLeft=KP_4
MoveRight=KP_6
MoveUpLeft=KP_7
MoveUpRight=KP_9
MoveDownLeft=KP_1
MoveDownRight=KP_3

# Click keys
LeftClick=KP_5
RightClick=KP_Plus
DoubleClick=KP_5+KP_5
DragToggle=KP_0
DragRelease=KP_Decimal

# Speed settings
InitialSpeed=10
MaxSpeed=500
Acceleration=1000
AccelerationDelay=300

[CaretNavigation]
# Text caret navigation enhancements
EnhancedCaret=true

# Caret width (pixels)
CaretWidth=2

# Caret color (empty = follow theme)
CaretColor=

# Caret blink rate (ms, 0 = no blink)
BlinkRate=530

# Show caret position indicator
ShowPositionIndicator=false

[SkipLinks]
# Skip link generation for web content and documents
AutoGenerate=true

# Skip link targets
Targets=main,nav,search,footer

# Skip link style
Style=visible-on-focus
Position=top-left
