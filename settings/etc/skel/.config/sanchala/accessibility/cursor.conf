# ============================================
# SANCHALA OS - Large Cursor Theme Configuration
# ============================================
# Accessibility cursor options
# ~/.config/sanchala/accessibility/cursor.conf
# ============================================

[Cursor]
# Available themes with large cursor support
# Standard sizes: 24, 32, 48, 64, 96

[Themes]
# Default cursor theme
Default=breeze_cursors

# Large cursor variants
Large=breeze_cursors_large
ExtraLarge=breeze_cursors_xlarge

# High contrast cursors
HighContrastLight=breeze_cursors_hc_light
HighContrastDark=breeze_cursors_hc_dark

[Sizes]
# Predefined size presets
Small=24
Normal=32
Large=48
ExtraLarge=64
Huge=96

[Presets]
# Low vision preset
LowVision.Size=64
LowVision.Theme=breeze_cursors_large
LowVision.Halo=true
LowVision.HaloColor=#FFEB3B
LowVision.HaloSize=40

# High contrast light preset
HighContrastLight.Size=48
HighContrastLight.Theme=breeze_cursors_hc_light
HighContrastLight.Halo=false

# High contrast dark preset
HighContrastDark.Size=48
HighContrastDark.Theme=breeze_cursors_hc_dark
HighContrastDark.Halo=false

# Motor accessibility preset (larger target)
Motor.Size=64
Motor.Theme=breeze_cursors_large
Motor.Halo=true
Motor.HaloColor=#4CAF50
Motor.HaloSize=50

[Animation]
# Cursor animation for locate feature
LocateAnimation=pulse
LocateDuration=1000
LocateColor=#FF5722
LocateSize=100
