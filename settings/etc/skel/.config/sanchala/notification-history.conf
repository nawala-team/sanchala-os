# ============================================================================
# SANCHALA OS - Notification History Configuration
# ============================================================================
# Location: ~/.config/sanchala/notification-history.conf
# Persistent notification history with smart organization
# ============================================================================

[General]
Enabled=true
StoragePath=~/.local/share/sanchala/notifications
DatabaseFile=history.db
MaxNotifications=1000
MaxAgeDays=30
AutoCleanup=true
CleanupInterval=daily

[Storage]
CompressOldEntries=true
CompressAfterDays=7
BackupEnabled=true
BackupPath=~/.local/share/sanchala/notifications/backup
MaxBackups=7

[Display]
GroupByApplication=true
GroupByDate=true
ShowTimestamps=true
TimestampFormat=relative
ShowAppIcons=true
ShowActions=true
MaxPreviewLines=3
ExpandableEntries=true

[Categories]
ShowCategoryHeaders=true
CategoryOrder=critical,messages,email,calendar,social,system,other

[Categories][critical]
DisplayName=Critical
Icon=dialog-warning-symbolic
Color=#FF1744
RetentionDays=90

[Categories][messages]
DisplayName=Messages
Icon=mail-message-symbolic
Color=#2196F3
RetentionDays=30

[Categories][email]
DisplayName=Email
Icon=mail-symbolic
Color=#4CAF50
RetentionDays=14

[Categories][calendar]
DisplayName=Calendar
Icon=calendar-symbolic
Color=#FF9800
RetentionDays=7

[Categories][social]
DisplayName=Social
Icon=user-available-symbolic
Color=#9C27B0
RetentionDays=7

[Categories][system]
DisplayName=System
Icon=system-symbolic
Color=#607D8B
RetentionDays=14

[Categories][other]
DisplayName=Other
Icon=notifications-symbolic
Color=#9E9E9E
RetentionDays=7

[Search]
Enabled=true
IndexContent=true
SearchFields=title,body,app
MaxResults=100

[Privacy]
ExcludeApps=
ExcludeCategories=
RedactSensitive=false
ClearOnLogout=false
EncryptStorage=false

[Sync]
Enabled=false
SyncWithDevices=false
SyncPath=
