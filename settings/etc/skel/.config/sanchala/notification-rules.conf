# ============================================================================
# SANCHALA OS - Notification Rules Configuration
# ============================================================================
# Location: ~/.config/sanchala/notification-rules.conf
# Advanced rule-based notification filtering and prioritization
# ============================================================================

[General]
Enabled=true
ProcessingOrder=priority,time,app,content
DefaultAction=show
LogRuleMatches=false

# ============================================================================
# PRIORITY RULES
# ============================================================================

[Rule][Critical-Security]
Enabled=true
Priority=1000
Description=Security alerts are always critical
Conditions=category:security OR app:sanchala-guardian OR title:*security* OR title:*breach*
Action=critical
BypassDND=true
BypassFocus=true
PlaySound=critical
Persistent=true

[Rule][Critical-Battery]
Enabled=true
Priority=999
Description=Low battery warnings
Conditions=category:battery AND (body:*low* OR body:*critical* OR body:*5%* OR body:*10%*)
Action=critical
BypassDND=true
PlaySound=critical

[Rule][Critical-Disk]
Enabled=true
Priority=998
Description=Disk space warnings
Conditions=category:disk AND (body:*full* OR body:*low space* OR body:*90%*)
Action=critical
BypassDND=true
PlaySound=system

[Rule][Critical-System-Error]
Enabled=true
Priority=997
Description=System errors and crashes
Conditions=category:system-error OR title:*crash* OR title:*failed*
Action=critical
BypassDND=true
PlaySound=critical

[Rule][High-Calls]
Enabled=true
Priority=900
Description=Incoming calls are high priority
Conditions=category:call OR category:voip
Action=high
BypassDND=conditional
BypassCondition=AllowCalls=true
PlaySound=ringtone
Persistent=true

[Rule][High-Calendar]
Enabled=true
Priority=850
Description=Calendar reminders
Conditions=category:calendar OR app:org.kde.kalendar
Action=high
PlaySound=reminder

[Rule][Normal-Email]
Enabled=true
Priority=500
Description=Email notifications
Conditions=category:email OR app:thunderbird OR app:org.kde.kmail2
Action=normal
PlaySound=message
GroupWith=email

[Rule][Normal-Messages]
Enabled=true
Priority=600
Description=Messaging apps
Conditions=category:messaging OR app:telegram* OR app:signal* OR app:discord OR app:slack
Action=normal
PlaySound=message
GroupWith=sender

# ============================================================================
# FILTERING RULES
# ============================================================================

[Rule][Filter-Marketing]
Enabled=true
Priority=100
Description=Filter marketing/promotional content
Conditions=body:*sale* OR body:*discount* OR body:*% off* OR body:*promo* OR body:*subscribe*
Action=silence
AddToHistory=false

[Rule][Filter-Social-Noise]
Enabled=true
Priority=100
Description=Filter social media noise
Conditions=(app:facebook OR app:twitter OR app:instagram) AND (body:*liked* OR body:*followed*)
Action=silence
AddToHistory=true

[Rule][Filter-Spam]
Enabled=true
Priority=50
Description=Filter repeated notifications (anti-spam)
Conditions=app.count.lastMinute > 10
Action=collapse
CollapseTemplate={count} notifications from {app}
AddToHistory=true

# ============================================================================
# TIME-BASED RULES
# ============================================================================

[Rule][Time-WorkHours]
Enabled=false
Priority=200
Description=Prioritize work during business hours
Conditions=time:09:00-17:00 AND day:Mon,Tue,Wed,Thu,Fri
Prioritize=work,email,calendar
Deprioritize=gaming,social

[Rule][Time-Evening]
Enabled=false
Priority=200
Description=Relax notifications in evening
Conditions=time:18:00-22:00
Prioritize=personal,social
Deprioritize=work,email

[Rule][Time-Night]
Enabled=false
Priority=300
Description=Minimal notifications at night
Conditions=time:22:00-07:00
Action=silence
Except=critical,calls,alarms

# ============================================================================
# APP-SPECIFIC RULES
# ============================================================================

[Rule][App-Browser-Limit]
Enabled=true
Priority=150
Description=Limit browser notifications per site
Conditions=app:*browser* OR app:firefox OR app:chromium OR app:brave*
MaxPerSource=3
GroupWith=source
CollapseAfter=3

[Rule][App-Updates]
Enabled=true
Priority=400
Description=System update notifications
Conditions=app:org.kde.discover OR app:pamac* OR category:updates
Action=normal
PlaySound=system
Batch=true
BatchInterval=3600

[Rule][App-Downloads]
Enabled=true
Priority=300
Description=Download completion notifications
Conditions=title:*download* AND (body:*complete* OR body:*finished*)
Action=normal
PlaySound=default
AutoHide=10000
