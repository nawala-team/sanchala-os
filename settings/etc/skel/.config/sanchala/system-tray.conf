# Sanchala System Tray Configuration
# Controls which items appear in the system tray

[General]
# Icon size in pixels
IconSize=22

# Spacing between icons
IconSpacing=4

# Show hidden items arrow
ShowExpandArrow=true

[AlwaysVisible]
# Items always shown in tray (max 5 recommended)
Items=org.kde.plasma.battery,org.kde.plasma.networkmanagement,org.kde.plasma.volume,org.kde.plasma.notifications,org.sanchala.controlcenter

[AutoShow]
# Items shown only when active
org.kde.plasma.bluetooth=when-connected
org.kde.plasma.mediacontroller=when-playing
org.kde.kdeconnect=when-connected
org.sanchala.location=when-active
org.sanchala.microphone=when-active
org.sanchala.camera=when-active
org.sanchala.screenrecording=when-active

[Hidden]
# Items hidden by default (accessible via expand arrow)
Items=org.kde.plasma.clipboard,org.kde.plasma.devicenotifier,org.kde.plasma.vault

[PrivacyIndicators]
# Show privacy indicators when hardware is in use
MicrophoneIndicator=true
CameraIndicator=true
LocationIndicator=true
ScreenRecordingIndicator=true

# Indicator colors
MicrophoneColor=#FF9800
CameraColor=#4CAF50
LocationColor=#2196F3
ScreenRecordingColor=#F44336

[Categories]
# Category order (left to right)
Order=hardware,connectivity,media,system,apps

# Hardware: battery, brightness
# Connectivity: network, bluetooth, vpn
# Media: volume, media player
# System: notifications, control center
# Apps: third-party app indicators
