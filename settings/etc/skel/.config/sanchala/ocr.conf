# ============================================
# SANCHALA OS - Tesseract OCR Configuration
# ============================================
# Screenshot text extraction defaults
# ============================================

# Default language (English)
tessedit_char_whitelist=
tessedit_char_blacklist=
load_system_dawg=true
load_freq_dawg=true

# Page segmentation mode (3 = fully automatic)
tessedit_pageseg_mode=3

# OCR Engine mode (3 = Default, based on what is available)
tessedit_ocr_engine_mode=3

# Output format
tessedit_create_txt=1
tessedit_create_hocr=0
tessedit_create_pdf=0

# Quality settings
textord_heavy_nr=0
edges_max_children_per_outline=10
textord_force_make_prop_words=0
textord_min_linesize=2.5

# Language data path
tessdata_dir=/usr/share/tessdata
