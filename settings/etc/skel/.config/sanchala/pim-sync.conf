# ============================================================================
# SANCHALA OS - PIM Sync Configuration
# ============================================================================
# CalDAV/CardDAV synchronization settings
# Enables seamless sync like Apple iCloud
# ============================================================================

[General]
# Enable PIM sync services
Enabled=true

# Sync engine: akonadi (default), gnome-online-accounts, evolution-data-server
SyncEngine=akonadi

# Global sync interval (minutes)
GlobalSyncInterval=15

# Sync on network change
SyncOnNetworkChange=true

# Sync on resume from suspend
SyncOnResume=true

# Background sync (even when PIM apps closed)
BackgroundSync=true

[CalDAV]
# CalDAV support enabled
Enabled=true

# Default sync interval (minutes)
SyncInterval=15

# Sync range: past events to keep (days)
PastEventRetention=365

# Sync range: future events (days)
FutureEventRange=730

# Enable calendar colors from server
UseServerColors=true

# Sync reminders
SyncReminders=true

# Sync attachments
SyncAttachments=true

# Maximum attachment size (MB)
MaxAttachmentSize=25

# Handle recurrence on client
ClientSideRecurrence=true

[CardDAV]
# CardDAV support enabled  
Enabled=true

# Default sync interval (minutes)
SyncInterval=15

# Sync contact photos
SyncPhotos=true

# Photo quality (1-100, affects upload size)
PhotoQuality=85

# Maximum photo size (pixels)
MaxPhotoSize=512

# Sync custom fields
SyncCustomFields=true

# vCard version for upload: 3.0, 4.0
VCardVersion=4.0

[Providers]
# Pre-configured provider templates
# Users can add accounts through Settings > Online Accounts

[Providers][NextCloud]
Type=caldav+carddav
DisplayName=Nextcloud
CalDAVPath=/remote.php/dav/calendars/{username}/
CardDAVPath=/remote.php/dav/addressbooks/users/{username}/
DiscoverySupport=true
ColorSupport=true

[Providers][Google]
Type=oauth2
DisplayName=Google
CalDAVUrl=https://apidata.googleusercontent.com/caldav/v2/
CardDAVUrl=https://www.googleapis.com/carddav/v1/principals/{email}/
OAuthClientId=sanchala-pim
OAuthScopes=https://www.googleapis.com/auth/calendar https://www.googleapis.com/auth/contacts

[Providers][iCloud]
Type=caldav+carddav
DisplayName=Apple iCloud
CalDAVUrl=https://caldav.icloud.com/
CardDAVUrl=https://contacts.icloud.com/
RequiresAppPassword=true
Notes=Requires App-Specific Password from appleid.apple.com

[Providers][FastMail]
Type=caldav+carddav
DisplayName=Fastmail
CalDAVUrl=https://caldav.fastmail.com/dav/calendars/user/{email}/
CardDAVUrl=https://carddav.fastmail.com/dav/addressbooks/user/{email}/
DiscoverySupport=true

[Providers][Mailbox.org]
Type=caldav+carddav
DisplayName=mailbox.org
CalDAVUrl=https://dav.mailbox.org/caldav/
CardDAVUrl=https://dav.mailbox.org/carddav/
DiscoverySupport=true

[Providers][Posteo]
Type=caldav+carddav
DisplayName=Posteo
CalDAVUrl=https://posteo.de:8443/calendars/{username}/
CardDAVUrl=https://posteo.de:8443/addressbooks/{username}/
DiscoverySupport=true

[Providers][Custom]
Type=manual
DisplayName=Custom CalDAV/CardDAV
# User provides URLs manually

[Conflict]
# Conflict resolution strategy: ask, local, remote, newest, merge
DefaultResolution=ask

# Auto-resolve trivial conflicts
AutoResolveTrivial=true

# Keep conflict copies
KeepConflictCopies=true

# Conflict copy retention (days)
ConflictRetention=30

[Offline]
# Enable offline mode
OfflineSupport=true

# Queue changes when offline
QueueOfflineChanges=true

# Max offline cache size (MB)
MaxCacheSize=500

# Sync immediately when back online
SyncOnReconnect=true

[Security]
# Store credentials in KWallet
UseKWallet=true

# Verify SSL certificates
VerifySSL=true

# Minimum TLS version
MinTLSVersion=1.2

# Certificate pinning for known providers
CertificatePinning=false

[Notifications]
# Notify on sync errors
NotifyOnError=true

# Notify on sync completion
NotifyOnComplete=false

# Notify on new shared items
NotifyOnShare=true

# Notify on calendar invitations
NotifyOnInvitation=true

[Performance]
# Batch sync operations
BatchSync=true

# Batch size
BatchSize=50

# Parallel sync connections
ParallelConnections=2

# Sync timeout (seconds)
SyncTimeout=120

# Retry failed syncs
RetryOnFailure=true
MaxRetries=3
RetryDelay=60
