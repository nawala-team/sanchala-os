# ============================================================
# SANCHALA OS - MPV Profiles Configuration
# ============================================================
# Specialized profiles for different content types
# ============================================================

# ===========================================
# Auto-applied Profiles
# ===========================================

[4K]
profile-desc=4K content optimizations
profile-cond=width >= 3840 or height >= 2160
deband=no
scale=bilinear
cscale=bilinear
dscale=bilinear

[HDR]
profile-desc=HDR content handling
profile-cond=get("video-params/primaries") == "bt.2020"
target-colorspace-hint=yes
tone-mapping=bt.2446a
tone-mapping-mode=hybrid
gamut-mapping-mode=clip

[Low-Resolution]
profile-desc=Low resolution upscaling
profile-cond=width < 1280 and height < 720
glsl-shaders-append="~~/shaders/SSimSuperRes.glsl"
scale=ewa_lanczossharp

[Music-Video]
profile-desc=Music video optimizations
profile-cond=string.match(path, "Music")~=nil
loop-file=inf
volume-max=100

[Night-Mode]
profile-desc=Reduced blue light for night viewing
gamma=1.1
saturation=-10

# ===========================================
# Manual Profiles
# ===========================================

[high-quality]
profile-desc=Maximum quality (GPU intensive)
scale=ewa_lanczos4sharpest
cscale=ewa_lanczos4sharpest
dscale=catmull_rom
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes
deband=yes
deband-iterations=4
deband-threshold=35
deband-range=16
deband-grain=5

[low-power]
profile-desc=Battery saving mode
hwdec=auto-copy
vo=gpu
scale=bilinear
cscale=bilinear
dscale=bilinear
dither=no
correct-downscaling=no
deband=no

[anime]
profile-desc=Optimized for anime content
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=20
deband-grain=5

[streaming]
profile-desc=Online streaming optimization
cache=yes
demuxer-max-bytes=800MiB
demuxer-max-back-bytes=200MiB
cache-pause-initial=yes
cache-pause-wait=3

[benchmark]
profile-desc=Performance testing
audio=no
untimed=yes
video-sync=display-desync
vulkan-swap-mode=immediate
opengl-swapinterval=0
