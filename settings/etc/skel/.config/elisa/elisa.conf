# ============================================================
# SANCHALA OS - Elisa Music Player Configuration
# ============================================================
# KDE's elegant music player with library management
# macOS Music-like experience with local-first philosophy
# ============================================================

[General]
showProgressOnTaskBar=true
showSystemTrayIcon=true
startInTray=false
colorScheme=

[PlayerSettings]
playAtStartup=false
restorePlaylist=true
showNowPlayingBackground=true
expandedFilterView=false

[Playlist]
randomPlay=false
repeatPlay=false
playlistControls=1
crossFadeDuration=3000
enableCrossFade=false

[Library]
# Default music folders to scan
rootPath[$e]=$HOME/Music
forceUsageOfFastFileSearch=true
scanAtStartup=true
watchForFileChanges=true
extractMetadataFromFileName=true
showAllArtistsCategory=true

[DatabaseSettings]
databasePath=$HOME/.local/share/elisa/database.db
embeddedDatabaseEnabled=true

[HeaderBar]
showArtist=true
showAlbum=true
showTrackNumber=false
showDuration=true
showRating=true

[NowPlaying]
showLyrics=true
showCoverArt=true
coverSize=256
blurBackground=true
blurRadius=40
backgroundOpacity=0.3

[ViewSettings]
initialView=RecentlyPlayed
gridViewIconSize=170
showRating=true
sortRole=Title
sortOrder=0
delegateMaxWidth=1000

[MediaKeys]
enableMediaKeys=true
playPauseKey=Media Play
stopKey=Media Stop
nextKey=Media Next
previousKey=Media Previous

[Equalizer]
enabled=false
preset=Flat
# 10-band EQ (Hz): 32, 64, 125, 250, 500, 1k, 2k, 4k, 8k, 16k
band0=0
band1=0
band2=0
band3=0
band4=0
band5=0
band6=0
band7=0
band8=0
band9=0

[ReplayGain]
enabled=true
mode=album
preamp=0
fallbackGain=-6

[Scrobbling]
enabled=false
# Users can enable via Settings > Scrobbling
# listenbrainz or last.fm

[Notifications]
showOnTrackChange=true
notificationDuration=3000
showAlbumArt=true

[Performance]
thumbnailCacheSize=100
metadataCacheSize=500
useHardwareAcceleration=true
