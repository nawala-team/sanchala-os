# ============================================================================
# SANCHALA OS - KDE Connect Plugin Configuration
# ============================================================================
# Location: ~/.config/kdeconnect/plugins.conf
# Comprehensive phone integration plugins for Apple Continuity-level sync
# ============================================================================

[Plugins]
# Enabled plugins (comma-separated)
enabled=battery,clipboard,contacts,findmyphone,mousepad,mprisremote,notifications,pausemusic,photo,ping,remotecommands,remotekeyboard,runcommand,screensaverInhibit,sendnotifications,sftp,share,sms,telephony,virtualmonitor

# Disabled plugins
disabled=

[Plugin][battery]
enabled=true
showInSystemTray=true
lowBatteryThreshold=20
criticalBatteryThreshold=10
showPercentage=true
notifyOnFullCharge=true
updateInterval=60

[Plugin][clipboard]
enabled=true
autoSync=true
syncText=true
syncImages=true
maxClipboardSize=5242880
encryptClipboard=true
excludePatterns=password,secret,token,api_key
debounceInterval=500
bidirectional=true
notifyOnReceive=true

[Plugin][contacts]
enabled=true
syncContacts=true
syncInterval=24
storeLocally=true
storagePath=~/.local/share/kdeconnect/contacts
syncPhotos=true
vcardExport=true
kaddressbookIntegration=true

[Plugin][findmyphone]
enabled=true
ringDuration=30
overrideSilent=true
maxVolume=true
flashScreen=true
showNotification=true

[Plugin][mousepad]
enabled=true
sensitivity=1.0
scrollSensitivity=1.0
naturalScrolling=true
keyboardEnabled=true
specialKeysEnabled=true
tapToClick=true
doubleTapRightClick=true
threeFingerMiddleClick=true

[Plugin][mprisremote]
enabled=true
controlAllPlayers=true
showAlbumArt=true
albumArtSize=256
showControls=true
volumeControl=true
seekControl=true
nowPlayingNotification=true
