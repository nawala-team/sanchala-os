# ============================================================================
# SANCHALA OS - KDE Connect Transfer & Commands Plugins
# ============================================================================
# Location: ~/.config/kdeconnect/plugins-transfer.conf
# File sharing, SMS, and remote command execution
# ============================================================================

[Plugin][remotecommands]
enabled=true
commandsFile=~/.config/kdeconnect/commands.json
requireConfirmation=false
logExecution=true
maxOutputSize=65536

[Plugin][remotekeyboard]
enabled=true
autoFocus=true
autoShowKeyboard=false
specialKeys=true
layout=auto

[Plugin][runcommand]
enabled=true
configFile=~/.config/kdeconnect/runcommands.json
showOutput=true
timeout=30

[Plugin][screensaverInhibit]
enabled=true
inhibitOn=presentation,media
resumeOnDisconnect=true

[Plugin][sftp]
enabled=true
mountPointBase=~/Phone
autoMount=false
mountTimeout=30
unmountOnDisconnect=true
showInFileManager=true
readOnly=false
dolphinIntegration=true

[Plugin][share]
enabled=true
receiveEnabled=true
downloadDirectory=~/Downloads/KDE Connect
subdirectoryPerDevice=true
openDestination=false
contextMenuEnabled=true
maxShareSize=0
acceptFileTypes=
rejectFileTypes=.exe,.bat,.cmd,.ps1,.vbs

[Plugin][sms]
enabled=true
syncConversations=true
storeLocally=true
storagePath=~/.local/share/kdeconnect/sms
syncInterval=15
maxConversations=100
messagesPerConversation=50
showInLauncher=true
defaultApp=org.kde.kdeconnect.sms
sendEnabled=true
quickReply=true
mmsSupport=true
contactLookup=true
notifyNewSMS=true

[Plugin][virtualmonitor]
enabled=true
defaultResolution=1920x1080
refreshRate=60
scaleFactor=1.0
defaultPosition=right
autoConnect=false
lowLatency=true
