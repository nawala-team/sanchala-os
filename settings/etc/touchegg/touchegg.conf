<?xml version="1.0" encoding="UTF-8"?>
<!-- SANCHALA OS - Touchégg Gesture Configuration -->
<!-- MacBook-quality multi-finger gestures for KDE Plasma -->
<touchégg>
  <settings>
    <property name="animation_delay">150</property>
    <property name="action_execute_threshold">20</property>
    <property name="color">1A237E</property>
    <property name="borderColor">3949AB</property>
  </settings>

  <application name="All">
    <!-- 3-FINGER SWIPES - Desktop Navigation -->
    <gesture type="SWIPE" fingers="3" direction="UP">
      <action type="RUN_COMMAND">
        <command>qdbus org.kde.kglobalaccel /component/kwin invokeShortcut "Overview"</command>
        <repeat>false</repeat>
        <on>begin</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="3" direction="DOWN">
      <action type="RUN_COMMAND">
        <command>qdbus org.kde.kglobalaccel /component/kwin invokeShortcut "MinimizeAll"</command>
        <repeat>false</repeat>
        <on>begin</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="CHANGE_DESKTOP">
        <direction>next</direction>
        <animate>true</animate>
        <animationPosition>right</animationPosition>
        <cyclic>true</cyclic>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="CHANGE_DESKTOP">
        <direction>previous</direction>
        <animate>true</animate>
        <animationPosition>left</animationPosition>
        <cyclic>true</cyclic>
      </action>
    </gesture>

    <!-- 4-FINGER SWIPES - Window Management -->
    <gesture type="SWIPE" fingers="4" direction="UP">
      <action type="RUN_COMMAND">
        <command>qdbus org.kde.kglobalaccel /component/kwin invokeShortcut "ShowDesktopGrid"</command>
        <repeat>false</repeat>
        <on>begin</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="4" direction="DOWN">
      <action type="SHOW_DESKTOP">
        <animate>true</animate>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="4" direction="LEFT">
      <action type="SEND_KEYS">
        <keys>Alt+Tab</keys>
        <repeat>false</repeat>
        <on>begin</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="4" direction="RIGHT">
      <action type="SEND_KEYS">
        <keys>Alt+Shift+Tab</keys>
        <repeat>false</repeat>
        <on>begin</on>
      </action>
    </gesture>

    <!-- PINCH GESTURES -->
    <gesture type="PINCH" fingers="4" direction="IN">
      <action type="SHOW_DESKTOP"><animate>true</animate></action>
    </gesture>

    <gesture type="PINCH" fingers="4" direction="OUT">
      <action type="RUN_COMMAND">
        <command>qdbus org.kde.kglobalaccel /component/kwin invokeShortcut "Overview"</command>
        <repeat>false</repeat>
        <on>begin</on>
      </action>
    </gesture>

    <gesture type="PINCH" fingers="3" direction="IN">
      <action type="SEND_KEYS"><keys>Ctrl+minus</keys><repeat>true</repeat></action>
    </gesture>

    <gesture type="PINCH" fingers="3" direction="OUT">
      <action type="SEND_KEYS"><keys>Ctrl+plus</keys><repeat>true</repeat></action>
    </gesture>

    <!-- TAP GESTURES -->
    <gesture type="TAP" fingers="3">
      <action type="MOUSE_CLICK"><button>2</button><on>begin</on></action>
    </gesture>

    <gesture type="TAP" fingers="4">
      <action type="RUN_COMMAND">
        <command>qdbus org.kde.kglobalaccel /component/kwin invokeShortcut "Overview"</command>
        <repeat>false</repeat>
        <on>begin</on>
      </action>
    </gesture>
  </application>
</touchégg>
