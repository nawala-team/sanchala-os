<?xml version="1.0" encoding="UTF-8"?>
<!-- SANCHALA OS - Touchégg App-Specific Gestures -->
<!-- Override gestures for specific applications -->
<touchégg>
  <!-- Web Browsers: Navigation gestures -->
  <application name="firefox,chromium,brave-browser,google-chrome,librewolf">
    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="SEND_KEYS">
        <keys>Alt+Right</keys>
        <repeat>false</repeat>
        <on>begin</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="SEND_KEYS">
        <keys>Alt+Left</keys>
        <repeat>false</repeat>
        <on>begin</on>
      </action>
    </gesture>

    <gesture type="PINCH" fingers="2" direction="IN">
      <action type="SEND_KEYS"><keys>Ctrl+minus</keys><repeat>true</repeat></action>
    </gesture>

    <gesture type="PINCH" fingers="2" direction="OUT">
      <action type="SEND_KEYS"><keys>Ctrl+plus</keys><repeat>true</repeat></action>
    </gesture>
  </application>

  <!-- File Managers -->
  <application name="dolphin,nautilus,thunar,pcmanfm,nemo">
    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="SEND_KEYS">
        <keys>Alt+Left</keys>
        <repeat>false</repeat>
        <on>begin</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="SEND_KEYS">
        <keys>Alt+Right</keys>
        <repeat>false</repeat>
        <on>begin</on>
      </action>
    </gesture>
  </application>

  <!-- Image Viewers -->
  <application name="gwenview,eog,feh,imv">
    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="SEND_KEYS"><keys>Right</keys><repeat>false</repeat><on>begin</on></action>
    </gesture>

    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="SEND_KEYS"><keys>Left</keys><repeat>false</repeat><on>begin</on></action>
    </gesture>
  </application>

  <!-- Document Viewers -->
  <application name="okular,evince,zathura">
    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="SEND_KEYS"><keys>Page_Down</keys><repeat>false</repeat><on>begin</on></action>
    </gesture>

    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="SEND_KEYS"><keys>Page_Up</keys><repeat>false</repeat><on>begin</on></action>
    </gesture>
  </application>
</touchégg>
