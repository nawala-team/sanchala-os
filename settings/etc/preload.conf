# ============================================================================
# SANCHALA OS - Preload Configuration
# ============================================================================
# Version: 1.0 | Intelligent application preloading
# Package: preload (optional daemon)
#
# Purpose: Learn user habits and preload frequently-used applications
# Effect: Applications start faster after initial learning period
# ============================================================================

[Model]
# How often to update the usage model (seconds)
# Lower = more responsive to habit changes, higher = more stable
cycle = 20

# Use exponential decay for recency weighting
# Higher = recent usage matters more
halflife = 168

# Minimum correlation before considering related files
# Lower = more aggressive preloading, higher = more conservative
minsize = 2000000

[Memory]
# Maximum memory to use for preloading (bytes, 0 = auto)
# Auto calculates based on available RAM
memtotal = 0

# Keep this much memory free (bytes)
# Preload backs off when free memory drops below this
memfree = 50000000

# Percentage of cached memory considered "available"
# Higher = more aggressive (treats cache as free)
memcached = 30

[System]
# File to store the learned model
mapprefix = /var/lib/preload/preload.state

# Log file location
logfile = /var/log/preload.log

# Process priority (nice value)
nice = 19

# I/O scheduling class (3 = idle, only preload when disk is idle)
ionice = 3

# ============================================================================
# EXCLUDED PATHS - Don't preload from these locations
# ============================================================================
# Temporary files, caches, etc. that shouldn't be preloaded
exeprefix = !/usr/sbin/;!/usr/local/sbin/;!/tmp/;!/var/tmp/;!/var/cache/

# ============================================================================
# SANCHALA OS DEFAULT PRELOAD TARGETS
# ============================================================================
# Common desktop applications to prioritize for preloading:
# - Plasma Desktop components
# - Firefox/Chromium
# - System utilities (Dolphin, Konsole, Kate)
#
# These are learned automatically, but initial hints speed up learning
