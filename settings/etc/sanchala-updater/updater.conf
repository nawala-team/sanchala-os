# Sanchala OS Update Daemon Configuration
# /etc/sanchala-updater/updater.conf

# ============================================================================
# UPDATE CHECK SETTINGS
# ============================================================================

# How often to check for updates (in seconds)
# Default: 3600 (1 hour)
CHECK_INTERVAL=3600

# Automatically download updates when available
# Default: true
AUTO_DOWNLOAD=true

# Automatically install updates (requires AUTO_DOWNLOAD=true)
# Default: false (manual installation preferred for desktop)
AUTO_INSTALL=false

# ============================================================================
# UPDATE WINDOW (for AUTO_INSTALL)
# ============================================================================

# Time window for automatic installation (24-hour format)
# Updates will only auto-install during this window
UPDATE_WINDOW_START="02:00"
UPDATE_WINDOW_END="06:00"

# Days when auto-install is allowed (comma-separated, 0=Sunday)
# Default: all days
UPDATE_DAYS="0,1,2,3,4,5,6"

# ============================================================================
# DELTA UPDATES
# ============================================================================

# Enable delta/incremental updates to reduce download size
# Default: true
DELTA_ENABLED=true

# Delta update server URL
DELTA_SERVER="https://updates.sanchala.os/deltas"

# Maximum delta age in days (older deltas are ignored)
DELTA_MAX_AGE=30

# ============================================================================
# SNAPSHOT SETTINGS
# ============================================================================

# Create snapshots before updates
# Default: true (highly recommended)
SNAPSHOT_ENABLED=true

# Snapper configuration to use
SNAPPER_CONFIG="root"

# Automatically cleanup old update snapshots
SNAPSHOT_CLEANUP=true

# Maximum number of update snapshots to keep
SNAPSHOT_KEEP_COUNT=10

# ============================================================================
# NOTIFICATIONS
# ============================================================================

# Enable desktop notifications
NOTIFY_DESKTOP=true

# Enable system log notifications
NOTIFY_SYSTEM=true

# Notify when updates are available
NOTIFY_UPDATES=true

# Notify when reboot is required
NOTIFY_REBOOT=true

# ============================================================================
# SAFETY CHECKS
# ============================================================================

# Minimum free disk space required (in GB)
MIN_FREE_SPACE=2

# Minimum battery level required (percentage, 0 to disable)
MIN_BATTERY=20

# Require AC power for updates on laptops
REQUIRE_AC_POWER=false

# ============================================================================
# ADVANCED
# ============================================================================

# Update mirror list before checking for updates
REFRESH_MIRRORS=false

# Include Flatpak updates in check
INCLUDE_FLATPAK=true

# Include firmware updates
INCLUDE_FIRMWARE=true

# Parallel download connections
PARALLEL_DOWNLOADS=5

# Custom hooks directory
HOOKS_DIR="/etc/sanchala-updater/hooks.d"
