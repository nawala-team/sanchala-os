# ============================================
# SANCHALA OS - WirePlumber Master Configuration
# ============================================
# Best-in-class Linux audio session management
# Version: 1.0 | Phase 2
# ============================================

context.properties = {
    # Enable debug logging for troubleshooting (set to 0 for production)
    log.level = 2
    
    # Application name
    application.name = "Sanchala Audio Manager"
}

context.spa-libs = {
    # Audio adapter support
    audio.convert.* = audioconvert/libspa-audioconvert
    
    # ALSA support
    api.alsa.* = alsa/libspa-alsa
    
    # Bluetooth support
    api.bluez5.* = bluez5/libspa-bluez5
    
    # V4L2 support (for video capture devices with audio)
    api.v4l2.* = v4l2/libspa-v4l2
    
    # libcamera support
    api.libcamera.* = libcamera/libspa-libcamera
}

context.modules = [
    # Real-time priority setup
    { name = libpipewire-module-rt
        args = {
            nice.level = -11
            rt.prio = 88
            rt.time.soft = -1
            rt.time.hard = -1
        }
        flags = [ ifexists nofail ]
    }
    
    # Protocol native for local connections
    { name = libpipewire-module-protocol-native }
    
    # Profiler for debugging
    { name = libpipewire-module-profiler }
    
    # Metadata
    { name = libpipewire-module-metadata }
    
    # SPA device factory
    { name = libpipewire-module-spa-device-factory }
    
    # SPA node factory
    { name = libpipewire-module-spa-node-factory }
    
    # Client node for external clients
    { name = libpipewire-module-client-node }
    
    # Client device
    { name = libpipewire-module-client-device }
    
    # Portal for sandboxed apps (Flatpak)
    { name = libpipewire-module-portal
        flags = [ ifexists nofail ]
    }
    
    # Access control
    { name = libpipewire-module-access
        args = {
            access.allowed = [ audio video ]
            access.force = flatpak
        }
    }
    
    # Adapter for device compatibility
    { name = libpipewire-module-adapter }
    
    # Link factory
    { name = libpipewire-module-link-factory }
    
    # Session manager
    { name = libpipewire-module-session-manager }
]

# WirePlumber components to load
wireplumber.components = [
    # Main Lua scripting engine
    { name = libwireplumber-module-lua-scripting, type = module }
    
    # Device monitoring
    { name = main.lua, type = config/lua }
    { name = policy.lua, type = config/lua }
    { name = bluetooth.lua, type = config/lua }
]

# Feature profiles
wireplumber.profiles = {
    main = {
        # Core features
        monitor.alsa = required
        monitor.bluez = required
        monitor.v4l2 = optional
        
        # Policy features
        policy.standard = required
        policy.role-priority = required
        
        # Bluetooth features
        bluetooth.autoswitch = required
        bluetooth.codec-priority = required
    }
}
