# ============================================================================
# SANCHALA OS - Bluetooth Device Classes & Priorities
# ============================================================================
# Defines handling for different device types
# ============================================================================

[HeadphonesHighEnd]
# Sony WH-1000XM series, Sennheiser, Bose, etc.
VendorMatch = 054c,1395,0489
PreferredCodec = ldac
LDACQuality = hq
Priority = 100
AutoConnect = true

[HeadphonesApple]
# AirPods, Beats
VendorMatch = 004c
PreferredCodec = aac
Priority = 95
AutoConnect = true

[Speakers]
# Bluetooth speakers
FormFactor = speaker
PreferredCodec = aptx
LatencyOffset = -5000
Priority = 80
AutoConnect = true

[Keyboards]
# Bluetooth keyboards
DeviceClass = 0x002540
Priority = 90
AutoConnect = true
LowLatency = true

[Mice]
# Bluetooth mice and trackpads
DeviceClass = 0x002580
Priority = 90
AutoConnect = true
LowLatency = true

[GameControllers]
# PS, Xbox, Nintendo controllers
FormFactor = gamepad
Priority = 85
AutoConnect = false
LowLatency = true

[Fitness]
# Fitness trackers, smartwatches
DeviceClass = 0x000000
BLEOnly = true
Priority = 50
AutoConnect = false

[CarAudio]
# Vehicle audio systems
FormFactor = car-audio
PreferredCodec = aac
Priority = 70
AutoConnect = true
