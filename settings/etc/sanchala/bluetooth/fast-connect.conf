# ============================================================================
# SANCHALA OS - Bluetooth Fast Connect & Auto-Pairing Settings
# ============================================================================
# Apple-like instant connection experience
# ============================================================================

[FastConnect]
# Enable fast connection for returning devices
Enabled = true

# Maximum time to attempt reconnection (seconds)
ReconnectTimeout = 30

# Retry interval progression (seconds)
RetryIntervals = 1,2,4,8,16

# Number of retry attempts
MaxRetries = 5

[AutoPairing]
# Enable Just Works pairing for simple devices
JustWorks = true

# Enable Secure Simple Pairing
SecureSimplePairing = true

# Auto-trust devices after successful pairing
AutoTrust = true

# Remember paired devices across reboots
PersistPairings = true

[DevicePreferences]
# Prioritize audio devices for auto-connect
AudioDevicePriority = high

# Auto-connect on adapter power-on
ConnectOnPowerOn = true

# Auto-connect after system resume
ConnectOnResume = true

# Delay before auto-connect (ms) - allows adapter to stabilize
ConnectDelay = 1000

[Profiles]
# Profiles to auto-connect (in priority order)
# a2dp_sink = High-quality audio output
# hfp_ag = Hands-free for calls
# hsp_ag = Headset profile
# hid = Human Interface Devices
AutoConnectProfiles = a2dp_sink,hfp_ag,hid

[PowerManagement]
# Keep adapter powered on when AC connected
StayOnAC = true

# Power off adapter on battery when idle (minutes, 0=never)
IdleTimeoutBattery = 0

# Keep connection alive (prevents timeouts)
KeepAlive = true
KeepAliveInterval = 30
