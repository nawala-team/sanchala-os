# ============================================
# SANCHALA OS - Audio Routing Profiles
# ============================================
# Smart automatic audio routing based on device
# ============================================

[General]
Version=1.0
Description=Sanchala OS Audio Routing Profiles

# ============================================
# Profile: Speakers (Default)
# ============================================
[Profile:Speakers]
Name=Built-in Speakers
Description=Internal laptop/desktop speakers
Icon=audio-speakers
Priority=100

# Output device matching
Match.Output=alsa_output.pci-*,alsa_output.*analog-stereo
Exclude.Output=*hdmi*,*bluetooth*,*usb*

# Audio processing
EQ.Preset=speakers-balanced
Volume.Max=100
Volume.Default=60

# Bass boost for small speakers
Filter.LowShelf.Freq=120
Filter.LowShelf.Gain=3.0

# ============================================
# Profile: Headphones
# ============================================
[Profile:Headphones]
Name=Headphones
Description=Wired headphones via 3.5mm jack
Icon=audio-headphones
Priority=200

# Output device matching
Match.Output=*headphone*,*Headphone*
Trigger.JackPlug=true

# Audio processing
EQ.Preset=headphones-flat
Volume.Max=85
Volume.Default=40

# Slight bass reduction for close proximity
Filter.LowShelf.Freq=60
Filter.LowShelf.Gain=-1.5

# Crossfeed for natural soundstage
Crossfeed.Enable=true
Crossfeed.Level=30

# ============================================
# Profile: USB Audio
# ============================================
[Profile:USB-Audio]
Name=USB Audio Interface
Description=External USB DAC/Audio Interface
Icon=audio-card
Priority=300

# Output device matching
Match.Output=alsa_output.usb-*

# High quality settings
EQ.Preset=flat
Volume.Max=100
Volume.Default=50

# Bit-perfect passthrough option
Passthrough.Enable=false
Resample.Quality=best

# ============================================
# Profile: HDMI Audio
# ============================================
[Profile:HDMI]
Name=HDMI/DisplayPort Audio
Description=Audio through display connection
Icon=video-display
Priority=150

# Output device matching
Match.Output=*hdmi*,*HDMI*,*DisplayPort*,*DP-*

# TV/Monitor settings
EQ.Preset=tv-dynamic
Volume.Max=100
Volume.Default=50

# Lip sync correction (adjust per display)
Latency.Offset=50

# ============================================
# Profile: Bluetooth Headphones
# ============================================
[Profile:Bluetooth-Headphones]
Name=Bluetooth Headphones
Description=Wireless Bluetooth headphones
Icon=audio-headphones-bluetooth
Priority=250

# Output device matching
Match.Output=bluez_output.*

# Bluetooth-specific settings
EQ.Preset=headphones-flat
Volume.Max=100
Volume.Default=50

# Codec preferences
Bluetooth.Codec.Preferred=ldac,aptx_hd,aptx,aac
Bluetooth.Quality=high

# Auto-switch to headset profile for calls
Bluetooth.AutoSwitch=true

# ============================================
# Profile: Bluetooth Speaker
# ============================================
[Profile:Bluetooth-Speaker]
Name=Bluetooth Speaker
Description=Portable Bluetooth speaker
Icon=audio-speakers-bluetooth
Priority=180

# Output device matching
Match.Output=bluez_output.*
Match.FormFactor=speaker

# Speaker-specific settings
EQ.Preset=speakers-enhanced
Volume.Max=100
Volume.Default=70

# Latency optimization for sync
Latency.Offset=-20

# ============================================
# Profile: Gaming
# ============================================
[Profile:Gaming]
Name=Gaming Mode
Description=Optimized for low latency gaming
Icon=input-gaming
Priority=50
Trigger.Application=steam,lutris,wine,gamescope

# Low latency settings
Latency.Target=low
Quantum=256
Rate=48000

# Gaming audio profile
EQ.Preset=gaming
Volume.Max=100
Volume.Default=70

# Positional audio enhancement
Spatial.Enable=true
Spatial.Profile=gaming

# ============================================
# Profile: Voice Communication
# ============================================
[Profile:Communication]
Name=Voice Chat
Description=Optimized for voice calls and meetings
Icon=user-available
Priority=400
Trigger.Application=discord,zoom,teams,signal

# Voice optimization
EQ.Preset=voice
Volume.Max=100
Volume.Default=60

# Echo cancellation
AEC.Enable=true
AEC.Algorithm=webrtc

# Noise suppression
NoiseSuppression.Enable=true
NoiseSuppression.Level=moderate

# AGC for consistent levels
AGC.Enable=true
AGC.Target=-18

# ============================================
# Profile: Music Production
# ============================================
[Profile:Production]
Name=Music Production
Description=Flat response for audio production
Icon=audio-x-generic
Priority=350
Trigger.Application=ardour,audacity,bitwig,reaper

# Flat monitoring
EQ.Preset=flat
Volume.Max=100
Volume.Default=50

# Ultra-low latency
Latency.Target=ultra-low
Quantum=64
Rate=96000

# No processing
Passthrough.Enable=true
