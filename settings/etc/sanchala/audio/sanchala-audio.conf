# ============================================
# SANCHALA OS - Sanchala Audio Manager Config
# ============================================
# Central configuration for audio system
# ============================================

[General]
Version=1.0
AudioServer=pipewire
SessionManager=wireplumber

[Defaults]
# Default sample rate (Hz)
SampleRate=48000

# Default bit depth
BitDepth=24

# Default buffer size (samples)
BufferSize=1024

# Default volume (0-100)
Volume=70

# Default muted state
Muted=false

[Quality]
# Resampler quality (0-15, higher = better)
ResamplerQuality=10

# Dither (0=none, 1=rectangular, 2=triangular, 3=shaped)
Dither=2

# Enable high-quality Bluetooth codecs
BluetoothHQ=true

[Bluetooth]
# Preferred codec order
CodecPriority=ldac,aptx_hd,aptx,aac,sbc_xq,sbc

# LDAC quality (auto, hq, sq, mq)
LDACQuality=auto

# Auto-switch between A2DP and HFP
AutoSwitch=true

# Enable mSBC for HFP (wideband speech)
mSBC=true

[Routing]
# Auto-switch to headphones when plugged in
AutoSwitchHeadphones=true

# Auto-switch to Bluetooth when connected
AutoSwitchBluetooth=true

# Remember per-app audio device preferences
PerAppRouting=true

# Profile to use for different scenarios
DefaultProfile=auto

[EQ]
# Enable system-wide EQ
Enabled=false

# Default preset
DefaultPreset=flat

# Available presets directory
PresetsDir=/etc/sanchala/audio/eq-presets

[Effects]
# Echo cancellation for voice
EchoCancellation=true

# Noise suppression
NoiseSuppression=true

# Auto gain control
AGC=true

[Accessibility]
# Screen reader priority
ScreenReaderPriority=highest

# Mono audio for hearing impaired
MonoAudio=false

# Balance (0=left, 50=center, 100=right)
Balance=50

[Advanced]
# Real-time priority
RTKit=true
NiceLevel=-11
RTPriority=88

# Allow memory locking
MemLock=true

# ALSA UCM support
UseUCM=true
UseACP=true
