# ============================================
# SANCHALA OS - EQ Preset: Speakers Balanced
# ============================================
# Balanced EQ for laptop/desktop speakers
# Compensates for typical small speaker limitations
# ============================================

[Preset]
Name=Speakers Balanced
Description=Balanced sound for built-in speakers
Category=Speakers
Icon=audio-speakers

[Equalizer]
Enabled=true
Type=parametric
Bands=10

# Sub-bass boost (rumble compensation)
[Band.1]
Type=LowShelf
Frequency=60
Gain=4.0
Q=0.7

# Bass presence
[Band.2]
Type=Peak
Frequency=120
Gain=2.5
Q=1.0

# Lower midrange (warmth)
[Band.3]
Type=Peak
Frequency=250
Gain=0.5
Q=1.2

# Midrange (clarity)
[Band.4]
Type=Peak
Frequency=500
Gain=0.0
Q=1.0

# Upper midrange (presence)
[Band.5]
Type=Peak
Frequency=1000
Gain=1.0
Q=1.0

# Presence (vocals)
[Band.6]
Type=Peak
Frequency=2000
Gain=1.5
Q=1.2

# Brilliance
[Band.7]
Type=Peak
Frequency=4000
Gain=2.0
Q=1.0

# Air (sparkle)
[Band.8]
Type=Peak
Frequency=8000
Gain=1.5
Q=1.0

# Ultra-high
[Band.9]
Type=Peak
Frequency=12000
Gain=1.0
Q=0.8

# High shelf (air)
[Band.10]
Type=HighShelf
Frequency=16000
Gain=0.5
Q=0.7
