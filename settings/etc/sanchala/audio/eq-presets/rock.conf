# ============================================
# SANCHALA OS - EQ Preset: Rock/Metal
# ============================================
# Powerful sound for rock and metal genres
# Punchy bass, aggressive mids, crisp highs
# ============================================

[Preset]
Name=Rock
Description=Powerful, punchy sound for rock and metal
Category=Music
Icon=audio-x-generic

[Equalizer]
Enabled=true
Type=parametric
Bands=10

# Sub-bass (power)
[Band.1]
Type=LowShelf
Frequency=50
Gain=3.0
Q=0.7

# Kick drum
[Band.2]
Type=Peak
Frequency=80
Gain=3.5
Q=1.0

# Bass guitar
[Band.3]
Type=Peak
Frequency=150
Gain=2.0
Q=1.2

# Low mid (reduce mud)
[Band.4]
Type=Peak
Frequency=300
Gain=-2.0
Q=1.5

# Guitar body
[Band.5]
Type=Peak
Frequency=700
Gain=1.5
Q=1.0

# Vocal presence
[Band.6]
Type=Peak
Frequency=1500
Gain=2.0
Q=1.2

# Guitar attack
[Band.7]
Type=Peak
Frequency=3000
Gain=3.0
Q=1.2

# Cymbal/Hi-hat
[Band.8]
Type=Peak
Frequency=5000
Gain=2.0
Q=1.0

# Sizzle
[Band.9]
Type=Peak
Frequency=8000
Gain=2.5
Q=1.0

# Air
[Band.10]
Type=HighShelf
Frequency=12000
Gain=1.5
Q=0.7
