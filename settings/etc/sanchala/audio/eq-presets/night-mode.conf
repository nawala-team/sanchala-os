# ============================================
# SANCHALA OS - EQ Preset: Night Mode
# ============================================
# Compressed dynamics for late night listening
# Reduces loud peaks, boosts quiet parts
# ============================================

[Preset]
Name=Night Mode
Description=Compressed dynamics for quiet listening
Category=Special
Icon=weather-clear-night

[Equalizer]
Enabled=true
Type=parametric
Bands=6

[Band.1]
Type=HighPass
Frequency=40
Gain=0.0
Q=0.7

[Band.2]
Type=Peak
Frequency=100
Gain=-2.0
Q=1.0

[Band.3]
Type=Peak
Frequency=500
Gain=1.0
Q=1.0

[Band.4]
Type=Peak
Frequency=2000
Gain=2.0
Q=1.2

[Band.5]
Type=Peak
Frequency=6000
Gain=-1.0
Q=1.0

[Band.6]
Type=LowPass
Frequency=14000
Gain=0.0
Q=0.7

[Compressor]
Enabled=true
Threshold=-25
Ratio=4.0
Attack=10
Release=100
MakeupGain=3.0
