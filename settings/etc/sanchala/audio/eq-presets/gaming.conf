# ============================================
# SANCHALA OS - EQ Preset: Gaming
# ============================================
# Optimized for gaming: footsteps, explosions
# Enhanced positional audio cues
# ============================================

[Preset]
Name=Gaming
Description=Enhanced audio cues for competitive gaming
Category=Gaming
Icon=input-gaming

[Equalizer]
Enabled=true
Type=parametric
Bands=10

# Sub-bass (explosions, rumble)
[Band.1]
Type=LowShelf
Frequency=50
Gain=3.0
Q=0.7

# Bass impact
[Band.2]
Type=Peak
Frequency=80
Gain=2.0
Q=1.0

# Low mid (gunshots body)
[Band.3]
Type=Peak
Frequency=200
Gain=1.0
Q=1.2

# Mid clarity
[Band.4]
Type=Peak
Frequency=500
Gain=-1.0
Q=1.0

# Voice comms range
[Band.5]
Type=Peak
Frequency=1000
Gain=2.0
Q=1.2

# Footsteps low
[Band.6]
Type=Peak
Frequency=2000
Gain=3.5
Q=1.5

# Footsteps high
[Band.7]
Type=Peak
Frequency=3500
Gain=4.0
Q=1.5

# Detail (reloads, interactions)
[Band.8]
Type=Peak
Frequency=5000
Gain=2.5
Q=1.2

# Environmental sounds
[Band.9]
Type=Peak
Frequency=8000
Gain=2.0
Q=1.0

# Air (ambience)
[Band.10]
Type=HighShelf
Frequency=12000
Gain=1.5
Q=0.7

[Compressor]
Enabled=true
Threshold=-20
Ratio=3.0
Attack=5
Release=50
MakeupGain=2.0
