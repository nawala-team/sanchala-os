# ============================================
# SANCHALA OS - EQ Preset: Vocal Clarity
# ============================================
# Enhanced vocal presence and intelligibility
# Podcasts, Audiobooks, Voice calls
# ============================================

[Preset]
Name=Vocal Clarity
Description=Enhanced speech intelligibility for voice content
Category=Voice
Icon=audio-input-microphone

[Equalizer]
Enabled=true
Type=parametric
Bands=8

# Reduce sub-bass rumble
[Band.1]
Type=HighPass
Frequency=80
Gain=0.0
Q=0.7

# Bass reduction
[Band.2]
Type=Peak
Frequency=150
Gain=-2.0
Q=1.0

# Lower mid (warmth)
[Band.3]
Type=Peak
Frequency=300
Gain=1.0
Q=1.2

# Midrange (body)
[Band.4]
Type=Peak
Frequency=800
Gain=2.0
Q=1.0

# Presence (clarity)
[Band.5]
Type=Peak
Frequency=2500
Gain=4.0
Q=1.5

# Sibilance control
[Band.6]
Type=Peak
Frequency=5000
Gain=-1.0
Q=2.0

# Articulation
[Band.7]
Type=Peak
Frequency=7000
Gain=2.0
Q=1.0

# Air (breathiness)
[Band.8]
Type=HighShelf
Frequency=10000
Gain=1.0
Q=0.7
