# ============================================
# SANCHALA OS - EQ Preset: Classical/Acoustic
# ============================================
# Natural, warm sound for orchestral music
# Acoustic instruments and vocals
# ============================================

[Preset]
Name=Classical
Description=Warm, natural sound for classical and acoustic music
Category=Music
Icon=audio-x-generic

[Equalizer]
Enabled=true
Type=parametric
Bands=8

# Sub-bass (concert hall)
[Band.1]
Type=LowShelf
Frequency=50
Gain=1.5
Q=0.7

# Bass (warmth)
[Band.2]
Type=Peak
Frequency=120
Gain=1.0
Q=1.0

# Low mid (body)
[Band.3]
Type=Peak
Frequency=300
Gain=0.5
Q=1.2

# Midrange (instruments)
[Band.4]
Type=Peak
Frequency=800
Gain=0.0
Q=1.0

# Presence (strings)
[Band.5]
Type=Peak
Frequency=2000
Gain=1.0
Q=1.2

# Brilliance (violin)
[Band.6]
Type=Peak
Frequency=5000
Gain=1.5
Q=1.0

# Shimmer
[Band.7]
Type=Peak
Frequency=10000
Gain=2.0
Q=0.8

# Air (hall ambience)
[Band.8]
Type=HighShelf
Frequency=14000
Gain=2.5
Q=0.7
