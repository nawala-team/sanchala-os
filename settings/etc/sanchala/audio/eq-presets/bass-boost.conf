# ============================================
# SANCHALA OS - EQ Preset: Bass Boost
# ============================================
# Enhanced low-end for bass-heavy music
# EDM, Hip-Hop, Electronic
# ============================================

[Preset]
Name=Bass Boost
Description=Enhanced bass for electronic and hip-hop music
Category=Music
Icon=audio-subwoofer

[Equalizer]
Enabled=true
Type=parametric
Bands=8

# Deep sub-bass
[Band.1]
Type=LowShelf
Frequency=35
Gain=6.0
Q=0.6

# Sub-bass punch
[Band.2]
Type=Peak
Frequency=60
Gain=5.0
Q=0.8

# Bass body
[Band.3]
Type=Peak
Frequency=100
Gain=4.0
Q=1.0

# Upper bass
[Band.4]
Type=Peak
Frequency=200
Gain=2.0
Q=1.2

# Lower midrange (keep clean)
[Band.5]
Type=Peak
Frequency=400
Gain=-1.0
Q=1.0

# Midrange (neutral)
[Band.6]
Type=Peak
Frequency=1000
Gain=0.0
Q=1.0

# Treble (maintain clarity)
[Band.7]
Type=Peak
Frequency=4000
Gain=1.0
Q=1.0

# Air
[Band.8]
Type=HighShelf
Frequency=10000
Gain=2.0
Q=0.7
