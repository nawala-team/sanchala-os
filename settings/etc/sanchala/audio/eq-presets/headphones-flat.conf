# ============================================
# SANCHALA OS - EQ Preset: Headphones Flat
# ============================================
# Neutral response for headphone listening
# Slight adjustments for typical headphone coloration
# ============================================

[Preset]
Name=Headphones Flat
Description=Neutral response for critical headphone listening
Category=Headphones
Icon=audio-headphones

[Equalizer]
Enabled=true
Type=parametric
Bands=8

# Sub-bass (extend)
[Band.1]
Type=LowShelf
Frequency=40
Gain=1.0
Q=0.7

# Bass (control)
[Band.2]
Type=Peak
Frequency=100
Gain=-0.5
Q=1.0

# Lower mid (reduce muddiness)
[Band.3]
Type=Peak
Frequency=300
Gain=-1.0
Q=1.2

# Midrange (neutral)
[Band.4]
Type=Peak
Frequency=1000
Gain=0.0
Q=1.0

# Upper mid (reduce harshness)
[Band.5]
Type=Peak
Frequency=3000
Gain=-1.5
Q=1.5

# Presence
[Band.6]
Type=Peak
Frequency=5000
Gain=0.5
Q=1.0

# Brilliance
[Band.7]
Type=Peak
Frequency=8000
Gain=0.0
Q=1.0

# Air
[Band.8]
Type=HighShelf
Frequency=12000
Gain=1.0
Q=0.7
