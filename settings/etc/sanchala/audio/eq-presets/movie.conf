# ============================================
# SANCHALA OS - EQ Preset: Movie/Cinema
# ============================================
# Cinematic audio experience
# Enhanced dynamics and surround feel
# ============================================

[Preset]
Name=Movie
Description=Cinematic experience with enhanced dynamics
Category=Video
Icon=video-display

[Equalizer]
Enabled=true
Type=parametric
Bands=10

# Deep bass (LFE feel)
[Band.1]
Type=LowShelf
Frequency=40
Gain=4.5
Q=0.6

# Bass impact
[Band.2]
Type=Peak
Frequency=80
Gain=3.0
Q=0.9

# Low mid (fullness)
[Band.3]
Type=Peak
Frequency=200
Gain=1.0
Q=1.0

# Mid (dialogue body)
[Band.4]
Type=Peak
Frequency=500
Gain=0.5
Q=1.2

# Dialogue clarity
[Band.5]
Type=Peak
Frequency=1000
Gain=2.0
Q=1.0

# Presence
[Band.6]
Type=Peak
Frequency=2500
Gain=2.5
Q=1.2

# Detail
[Band.7]
Type=Peak
Frequency=4000
Gain=1.5
Q=1.0

# Ambience
[Band.8]
Type=Peak
Frequency=6000
Gain=1.0
Q=1.0

# Sparkle
[Band.9]
Type=Peak
Frequency=10000
Gain=2.0
Q=0.8

# Air
[Band.10]
Type=HighShelf
Frequency=14000
Gain=1.5
Q=0.7

[DynamicRange]
Enabled=true
# Night mode compression (optional)
NightMode=false
NightModeRatio=4.0
