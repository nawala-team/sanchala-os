# ============================================================================
# SANCHALA OS - Main Power Manager Configuration
# ============================================================================
# Version: 1.0 | Central power management settings
# Location: /etc/sanchala/power/power-manager.conf
# ============================================================================

[PowerManager]
# Enable Sanchala Power Manager
Enabled=true

# Power management backend
# Options: tlp, power-profiles-daemon, auto
# 'auto' detects the best available backend
Backend=auto

# ============================================================================
# POWER PROFILES
# ============================================================================

[Profiles]
# Default profile on AC power
DefaultACProfile=balanced

# Default profile on battery
DefaultBatteryProfile=power-saver

# Available profiles
# - power-saver: Maximum battery life
# - balanced: Good mix of performance and battery
# - performance: Maximum performance
AvailableProfiles=power-saver,balanced,performance

# Remember last used profile per power source
RememberProfile=true

# ============================================================================
# AUTOMATIC SWITCHING
# ============================================================================

[AutoSwitch]
# Automatically switch profiles based on power source
Enabled=true

# Switch to power-saver when battery below this percentage
LowBatteryThreshold=20

# Switch to balanced when battery above this percentage (on battery)
HighBatteryThreshold=80

# Delay before switching profiles (seconds) - prevents rapid switching
SwitchDelay=5

# ============================================================================
# BATTERY MONITORING
# ============================================================================

[Battery]
# Enable battery health monitoring
HealthMonitoring=true

# Warn when battery health falls below (percentage)
HealthWarningThreshold=80

# Check battery health interval (hours)
HealthCheckInterval=24

# Enable charging thresholds (requires hardware support)
ChargingThresholds=true

# Default charging mode
# Options: maximum_longevity, balanced, full_charge, travel
DefaultChargingMode=balanced

# ============================================================================
# DISPLAY POWER
# ============================================================================

[Display]
# Dim display on battery
DimOnBattery=true

# Brightness reduction percentage on battery
BatteryBrightnessReduction=20

# Idle dim timeout (seconds)
IdleDimTimeout=60

# Idle dim percentage
IdleDimLevel=30

# Turn off display after (seconds), 0=never
DisplayOffTimeout=300

# ============================================================================
# SCHEDULED POWER EVENTS
# ============================================================================

[Schedule]
# Enable scheduled wake/sleep
Enabled=false

# Wake up at specific time (24h format)
# WakeTime=07:00

# Sleep at specific time
# SleepTime=23:00

# Days to apply schedule (0=Sun, 1=Mon, etc)
# ScheduleDays=1,2,3,4,5

# ============================================================================
# NOTIFICATIONS
# ============================================================================

[Notifications]
# Enable power notifications
Enabled=true

# Notify on profile change
ProfileChange=true

# Notify on low battery
LowBattery=true
LowBatteryThreshold=20

# Notify on critical battery
CriticalBattery=true
CriticalBatteryThreshold=5

# Notify on battery fully charged
FullyCharged=true

# Notify on battery health issues
HealthWarning=true

# ============================================================================
# INTEGRATION
# ============================================================================

[Integration]
# Integrate with desktop environment
DesktopIntegration=true

# Expose D-Bus interface
DBusInterface=true

# Allow applications to request performance mode
AllowAppRequests=true

# Whitelist for apps that can request performance mode
# PerformanceAppWhitelist=steam,obs,kdenlive
