# ============================================================================
# SANCHALA OS - Thermal Management Configuration
# ============================================================================
# Version: 1.0 | Intelligent thermal management for longevity
# Location: /etc/sanchala/power/thermal.conf
# ============================================================================

[Thermal]
# Enable Sanchala thermal management
Enabled=true

# Thermal management mode
# - passive: Reduce performance before spinning up fans (quieter)
# - active: Use fans aggressively to maintain performance
# - balanced: Mix of both approaches
Mode=passive

# ============================================================================
# TEMPERATURE THRESHOLDS (Celsius)
# ============================================================================

[Thresholds]
# CPU temperature targets
CpuPassiveTemp=75
CpuCriticalTemp=95
CpuShutdownTemp=100

# GPU temperature targets  
GpuPassiveTemp=80
GpuCriticalTemp=95

# Ambient/chassis temperature
ChassisWarnTemp=45
ChassisCriticalTemp=55

# Battery temperature (stop charging if exceeded)
BatteryMaxChargeTemp=45
BatteryWarnTemp=50

# ============================================================================
# THROTTLING BEHAVIOR
# ============================================================================

[Throttling]
# Enable automatic CPU throttling when thermal limits approached
AutoThrottle=true

# Throttle step (percentage reduction per step)
ThrottleStep=10

# Minimum frequency floor (percentage of max)
MinFrequencyFloor=30

# Hysteresis (degrees below threshold before restoring performance)
Hysteresis=5

# ============================================================================
# FAN CONTROL
# ============================================================================

[FanControl]
# Let firmware control fans (safest)
# Options: firmware, manual, hybrid
Mode=firmware

# For manual/hybrid mode:
QuietModeMaxRpm=2500
BalancedModeMaxRpm=4000
PerformanceModeMaxRpm=6000

# Fan curve points (temp:rpm pairs) - for manual mode only
# FanCurve=40:0,50:1500,60:2500,70:3500,80:4500,90:6000

# ============================================================================
# INTEL THERMALD INTEGRATION
# ============================================================================

[Thermald]
# Enable Intel thermald integration (for Intel CPUs)
UseThermald=true

# Thermald config location
ConfigPath=/etc/thermald/thermal-conf.xml

# ============================================================================
# AMD SPECIFIC
# ============================================================================

[AMD]
# Use AMD PMF (Platform Management Framework) if available
UsePMF=true

# STAPM (Skin Temperature Aware Power Management) limit watts
# 0 = use firmware default
StapmLimit=0

# ============================================================================
# NVIDIA GPU
# ============================================================================

[Nvidia]
# Enable PowerMizer control
PowerMizerControl=true

# PowerMizer mode on battery
# 0 = Adaptive, 1 = Maximum Performance, 2 = Maximum Battery
BatteryMode=2
ACMode=0
