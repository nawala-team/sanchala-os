# ============================================================================
# SANCHALA OS - FIDO2/WebAuthn Configuration
# ============================================================================
# Hardware security key support (YubiKey, SoloKey, Titan, etc.)
# ============================================================================

[fido2]
# Enable FIDO2 authentication
enabled = true

# Require user presence (touch the key)
user-presence = required

# Require user verification (PIN or biometric on key)
# Options: required, preferred, discouraged
user-verification = preferred

# Timeout for user interaction (seconds)
timeout = 30

# Allowed transports (restrict for security)
# Options: usb, nfc, ble, internal
allowed-transports = usb,nfc

[resident-keys]
# Allow discoverable credentials (passkeys)
allow-resident-keys = true

# Prefer resident keys for new registrations
prefer-resident-keys = false

# Require authenticator with storage capability
require-rk-capable = false

[attestation]
# Attestation preference
# Options: none, indirect, direct, enterprise
attestation = direct

# Verify attestation certificates (strict mode)
verify-attestation = true

# Allowed attestation types
# Options: none, self, basic, attca
allowed-attestation = basic,attca

[pin]
# Minimum PIN length for hardware keys
min-pin-length = 6

# Maximum PIN retries before lockout
max-pin-retries = 8

[extensions]
# Allow credential protection extension
cred-protect = true

# Allow largeBlob extension
large-blob = false

# Allow hmac-secret extension
hmac-secret = true

[relying-party]
# Default relying party ID for local auth
default-rp-id = sanchala.local

# Allowed relying party IDs
allowed-rp-ids = sanchala.local,localhost
