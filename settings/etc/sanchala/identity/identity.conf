# ============================================================================
# SANCHALA OS - Identity & Authentication Master Configuration
# ============================================================================
# Central configuration for the Sanchala Identity system
# ============================================================================

[identity]
# Identity provider mode
# Options: local, ldap, freeipa, active-directory
provider = local

# Enable multi-factor authentication
mfa-enabled = true

# MFA policy (what counts as second factor)
# Options: any, hardware-only, biometric-only
mfa-policy = any

# Grace period after boot before requiring MFA (seconds)
# Allows initial login with password-only
mfa-grace-period = 0

[authentication]
# Authentication priority order (first success wins)
# Options: fingerprint, fido2, smartcard, password, tpm
auth-order = fingerprint,fido2,password

# Enable passwordless authentication (fingerprint/FIDO2 only)
passwordless-enabled = true

# Require at least one backup auth method
require-backup-auth = true

# Session timeout before re-authentication (minutes, 0=never)
session-timeout = 0

# Lock screen timeout (minutes)
lock-timeout = 5

[biometrics]
# Enable fingerprint authentication
fingerprint-enabled = true

# Enable face recognition (future)
face-enabled = false

# Biometric timeout before password fallback (seconds)
biometric-timeout = 10

# Allow biometric enrollment changes without password
biometric-self-service = false

[hardware-keys]
# Enable FIDO2/WebAuthn authentication
fido2-enabled = true

# Enable PIV smart card authentication
smartcard-enabled = false

# Require hardware key for admin operations
hardware-key-admin = false

[tpm]
# Use TPM for authentication secrets
tpm-enabled = true

# Seal authentication state to TPM
tpm-seal-auth = true

# PCRs to bind authentication to (boot integrity)
tpm-pcrs = 0,1,2,7,8,9

[keyring]
# Automatic keyring unlock on login
auto-unlock = true

# Keyring backend (gnome-keyring, kwallet, libsecret)
backend = auto

# Sync keyring with TPM-backed storage
tpm-backed-keyring = false

[session]
# Lock screen on suspend
lock-on-suspend = true

# Lock screen on lid close
lock-on-lid = true

# Lock screen on idle (minutes, 0=disable)
lock-on-idle = 5

# Require re-auth after screen lock
require-auth-on-unlock = true
