# ============================================================================
# SANCHALA OS - Fingerprint Daemon Configuration
# ============================================================================
# fprintd configuration for Touch ID-like fingerprint authentication
# ============================================================================

[fprint]
# Timeout for fingerprint verification (seconds)
timeout = 30

# Maximum verification attempts before falling back to password
max-tries = 5

# Storage location for fingerprint templates
# Templates are encrypted and stored per-user
storage = /var/lib/fprint

# Enable debug logging (disable in production)
debug = false

[device]
# Automatically select the best available scanner
auto-select = true

# Require fingerprint readers with secure element (recommended)
# Set to false if using older hardware
require-secure = false

# Supported driver priority (most secure first)
# Goodix MOC, Synaptics, Elan, older Validity
driver-priority = goodixmoc;synaptics;elan;validity

[security]
# Minimum fingerprint quality score (0-100)
# Higher = more strict matching, lower = faster but less secure
min-quality = 60

# Anti-spoofing detection (if hardware supports)
spoof-detection = true

# Maximum enrolled fingerprints per user
max-enrollments = 10

# Lock fingerprint enrollment after N failed attempts
enrollment-lock-threshold = 10
enrollment-lock-timeout = 300

# Require password confirmation before enrollment
password-confirm-enroll = true

[session]
# Auto-lock enrollment on session end
lock-on-session-end = true

# Clear verification cache on idle
cache-timeout = 0
