# Sanchala OS Theming Engine Configuration
# /etc/sanchala/theming/theming.conf

[General]
# Current theme mode: light, dark, auto
mode=auto

# Auto mode settings
auto_mode_type=sunset
# Options: sunset (location-based), schedule (time-based), ambient (sensor-based)

[Schedule]
# Time-based switching (24h format)
light_mode_start=07:00
dark_mode_start=19:00

[Location]
# For sunset-based switching
# Set automatically via geoclue or manually
latitude=
longitude=
# Transition duration in minutes
transition_duration=30

[AccentColor]
# Current accent color (hex)
accent=#3949AB
# Source: manual, wallpaper, preset
source=manual
# Wallpaper color extraction algorithm: dominant, vibrant, muted
wallpaper_algorithm=vibrant

[AccentPresets]
# Available accent color presets
sanchala_indigo=#3949AB
electric_blue=#536DFE
deep_navy=#1A237E
golden_amber=#FFB300
success_green=#00C853
alert_red=#FF1744
purple=#7C4DFF
teal=#00BCD4
pink=#E91E63
orange=#FF5722

[Transparency]
# Global transparency settings
panel_opacity=85
window_opacity=100
dock_opacity=80
blur_enabled=true
blur_radius=20

[Animations]
# Theme transition animations
enabled=true
duration=300
# Easing: linear, ease-in, ease-out, ease-in-out
easing=ease-in-out

[GTK]
# GTK theme sync
gtk3_theme=Sanchala
gtk4_theme=Sanchala
icon_theme=sanchala-icons
cursor_theme=sanchala-cursors
font_name=Inter 10

[Plasma]
# Plasma theme settings
desktop_theme=sanchala
color_scheme=SanchalaLight
window_decoration=sanchala
look_and_feel=org.sanchala.desktop

[Kvantum]
# Qt/Kvantum theme
theme=Sanchala
