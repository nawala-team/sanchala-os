# ============================================
# SANCHALA OS - User Switch Configuration
# ============================================
# Fast user switching settings
# /etc/sanchala/users/switch.conf
# ============================================

[switch]
# Enable fast user switching
enabled = true

# Animation style: cube, fade, slide, none
animation = "cube"
animation_duration_ms = 400

# Lock current session when switching
lock_on_switch = true

# Show switch menu in panel
show_panel_menu = true

[session_preservation]
# Keep sessions in memory when switching
preserve_sessions = true

# Maximum sessions to keep alive (0 = unlimited)
max_preserved_sessions = 3

# Memory limit per preserved session (MB)
session_memory_limit_mb = 1024

# Swap preference for inactive sessions
swap_inactive_sessions = true

[performance]
# Pre-warm potential switch targets
prewarm_sessions = true

# Suspend background apps in inactive sessions
suspend_background_apps = true

# Release screen buffers for inactive sessions  
release_screen_buffers = true

# CPU priority for inactive sessions (nice value)
inactive_nice = 10

[security]
# Require password to switch to locked session
require_password = true

# Allow guest to switch (if guest enabled)
allow_guest_switch = true

# Log all switch events
audit_switches = true
