# ============================================
# SANCHALA OS - Guest Mode Configuration
# ============================================
# /etc/sanchala/users/guest.conf
# ============================================

[guest]
# Enable guest mode
enabled = true

# Auto logout after minutes (0 = no limit)
auto_logout_minutes = 0

# Maximum session duration in hours
max_session_hours = 24

# Show guest on login screen
show_on_login = true

# Admin must enable each session
require_admin_enable = false

[storage]
# tmpfs size limit for guest home (MB)
home_size_mb = 512

# Downloads folder limit (MB)
downloads_size_mb = 256

# Allow access to external storage (USB)
allow_external_storage = false

[network]
# Allow network access
enabled = true

# Allow VPN connections
allow_vpn = false

# Allow Bluetooth
allow_bluetooth = false

# Force DNS-over-HTTPS
dns_over_https = true

[applications]
# Allow Flatpak apps
allow_flatpak = true

# Allow native apps
allow_native = true

# Blocked applications
blocked_apps = [
    "systemsettings",
    "konsole",
    "yakuake",
    "ksysguard",
    "partitionmanager",
    "gparted",
    "kdesu",
    "pkexec",
]

[privacy]
# Clear browser data on logout
clear_browser_on_logout = true

# Prevent screenshots
prevent_screenshots = false

# Disable clipboard history
disable_clipboard_history = true

# Disable recent files tracking
disable_recent_files = true
