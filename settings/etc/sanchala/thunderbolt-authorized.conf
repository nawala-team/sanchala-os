# ============================================================================
# SANCHALA OS - Authorized Thunderbolt Devices
# ============================================================================
# Location: /etc/sanchala/thunderbolt-authorized.conf
# Purpose: Pre-approved Thunderbolt devices for automatic authorization
# ============================================================================
#
# FORMAT: One device UUID per line
# Get UUIDs with: boltctl list
#
# SECURITY NOTE:
# Only add devices you fully trust. Thunderbolt provides direct memory
# access (DMA) which can be exploited by malicious devices.
#
# ============================================================================

# ===========================================
# Example entries (uncomment and modify):
# ===========================================
# CalDigit TS3 Plus
# 00000000-0000-0000-0000-000000000000

# OWC Thunderbolt Dock
# 11111111-1111-1111-1111-111111111111

# Apple Thunderbolt Display
# 22222222-2222-2222-2222-222222222222

# ===========================================
# Your authorized devices:
# ===========================================
