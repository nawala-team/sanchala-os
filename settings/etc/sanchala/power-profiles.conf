# ============================================================================
# SANCHALA OS - CPU Power Profiles Configuration
# ============================================================================
# Version: 1.0 | Integration with power-profiles-daemon
#
# Profiles:
#   performance   - Maximum performance (AC power, demanding tasks)
#   balanced      - Default (good mix of performance and efficiency)
#   power-saver   - Maximum battery life (mobile use)
# ============================================================================

[General]
# Default profile when no preference is set
DefaultProfile=balanced

# Auto-switch based on power source
AutoSwitchOnAC=performance
AutoSwitchOnBattery=balanced

[Performance]
# CPU governor for performance profile
Governor=performance
TurboBoost=enabled
# Intel: Energy Performance Preference (0=performance, 128=balanced, 255=power)
EnergyPreference=0

[Balanced]
# CPU governor for balanced profile
Governor=schedutil
TurboBoost=enabled
EnergyPreference=128

[PowerSaver]
# CPU governor for power-saver profile
Governor=schedutil
TurboBoost=disabled
EnergyPreference=255

# ============================================================================
# MANUAL CONTROL
# ============================================================================
# Use power-profiles-daemon CLI:
#   powerprofilesctl list        # Show available profiles
#   powerprofilesctl set <name>  # Switch profile
#   powerprofilesctl get         # Show current profile
#
# KDE Integration:
#   System Settings → Power Management → Energy Saving
#   Automatically integrates with power-profiles-daemon
