# ============================================
# SANCHALA OS - Game Streaming Configuration
# ============================================
# Sunshine server & Moonlight client settings
# ============================================

[general]
# Enable game streaming
enabled=true

# Default role (server, client, both)
default_role=client

[server]
# Sunshine game streaming server

# Enable server
enabled=false

# Server name (visible to clients)
server_name=Sanchala Gaming PC

# Web UI port
web_port=47990

# Streaming port range
port=47989

# UPnP for automatic port forwarding
upnp=true

# mDNS/Avahi discovery
mdns=true

# External IP (leave empty for auto-detect)
external_ip=

# Certificate path
cert_path=/etc/sunshine/cert.pem
key_path=/etc/sunshine/key.pem

[server_encoding]
# Video encoding settings

# Encoder priority (nvenc, vaapi, software)
encoder=auto

# HEVC/H.265 (better quality at same bitrate)
hevc_enabled=true

# AV1 (best quality, requires modern GPU)
av1_enabled=false

# 10-bit HDR
hdr_enabled=auto

# Minimum quality (0-51, lower is better)
min_quality=20

# Maximum bitrate (Mbps)
max_bitrate=100

# FEC percentage (error correction)
fec_percentage=20

[server_capture]
# Desktop capture settings

# Capture method (wlr, kms, x11)
capture_method=auto

# Adapter selection
adapter=0

# Output index
output=0

# Include cursor
capture_cursor=true

[server_audio]
# Audio streaming

# Audio capture
audio_enabled=true

# Audio sink
audio_sink=auto

# Virtual sink for streaming
virtual_sink=true

[server_input]
# Input handling

# Keyboard passthrough
keyboard=true

# Mouse passthrough
mouse=true

# Controller passthrough
controller=true

# Mouse sensitivity
mouse_sensitivity=1.0

[client]
# Moonlight client settings

# Enable client
enabled=true

# Preferred resolution
resolution=1080p

# Preferred FPS
fps=60

# Preferred bitrate (Mbps)
bitrate=20

# Enable surround sound
surround_sound=true

# Packet size
packet_size=1392

# Frame pacing
frame_pacing=true

# V-Sync
vsync=true

[client_quality]
# Quality presets

# Preset (low, medium, high, ultra)
preset=high

# Hardware decoding
hardware_decode=true

# Prefer HEVC
prefer_hevc=true

# Prefer HDR
prefer_hdr=auto

# Performance overlay
show_stats=false

[client_input]
# Client input settings

# Touchscreen as trackpad
touchscreen_trackpad=true

# On-screen controls
onscreen_controls=auto

# Swap mouse buttons
swap_mouse_buttons=false

# Multi-controller support
multi_controller=true

[network]
# Network settings

# STUN servers for NAT traversal
stun_server=stun.l.google.com:19302

# TURN servers (for difficult NAT)
# turn_server=

# IPv6 support
ipv6=true

# MTU
mtu=1500

# Connection timeout (seconds)
connection_timeout=15

[apps]
# Server app configuration

# Default app
default_app=desktop

# Steam Big Picture
steam_bigpicture=true
steam_command=steam -bigpicture

# Desktop streaming
desktop_enabled=true

# Custom apps
# app_1_name=Game Name
# app_1_command=/path/to/game
