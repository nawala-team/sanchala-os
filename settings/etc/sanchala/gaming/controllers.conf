# ============================================
# SANCHALA OS - Controller Configuration
# ============================================
# Gamepad and controller settings
# Location: /etc/sanchala/gaming/controllers.conf
# ============================================

[general]
# Enable controller support
enabled=true

# Auto-configure controllers on connect
auto_configure=true

# Default controller mapping
default_mapping=xinput

# Deadzone for analog sticks (percentage)
deadzone=15

# Trigger deadzone
trigger_deadzone=10

[xbox]
# Xbox controller support (wired/wireless)
enabled=true

# Use xpadneo driver for wireless Xbox controllers
xpadneo_enabled=true

# Rumble strength (0-100)
rumble_strength=100

# Trigger rumble
trigger_rumble=true

# Controller LED
led_enabled=true
led_brightness=50

[playstation]
# PlayStation controller support
enabled=true

# DualShock 4 support
ds4_enabled=true

# DualSense (PS5) support
dualsense_enabled=true

# Touchpad as mouse
touchpad_mouse=true

# LED color (hex)
led_color=0000ff

# LED brightness (0-255)
led_brightness=128

# Adaptive trigger support (DualSense)
adaptive_triggers=true

# Haptic feedback (DualSense)
haptic_feedback=true

[nintendo]
# Nintendo controller support
enabled=true

# Pro Controller
pro_controller=true

# Joy-Con support
joycon_enabled=true

# Combined Joy-Con mode
joycon_combined=true

# Home LED
home_led=true

# Player LED
player_led=true

[generic]
# Generic HID controllers
enabled=true

# 8BitDo controllers
8bitdo_enabled=true

# Logitech controllers
logitech_enabled=true

[steam_input]
# Use Steam Input for controller mapping
enabled=true

# Enable for non-Steam games
non_steam_games=true

# Desktop configuration
desktop_config=true

# Chord buttons (Steam button combinations)
chord_buttons=true

[gyro]
# Gyroscope support (where available)
enabled=true

# Gyro as mouse
gyro_mouse=false

# Gyro sensitivity
sensitivity=100

# Gyro mode (always, touch_active, button_active)
activation_mode=touch_active

[mapping_presets]
# Default mapping presets

# Standard FPS layout
fps_layout=true

# Racing layout
racing_layout=true

# Platformer layout
platformer_layout=true

[accessibility]
# Controller accessibility options

# One-handed mode
one_handed=false

# Button hold time (ms)
hold_time=500

# Auto-fire
auto_fire=false

# Swap sticks
swap_sticks=false

# Invert Y axis
invert_y=false
