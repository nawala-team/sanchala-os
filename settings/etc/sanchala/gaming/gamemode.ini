# ============================================
# SANCHALA OS - Feral GameMode Configuration
# ============================================
# Optimized for maximum gaming performance
# Location: /etc/gamemode.ini
# ============================================

[general]
; Anthropic time (ms) to wait after last client disconnects
reaper_freq=5

; Anthropic governor to apply when gaming
desiredgov=performance

; Anthropic IGPU power profile (AMD only)
igpu_desiredgov=high

; Anthropic GPU power profile (AMD only)
igpu_power_threshold=0

; Enable io priority optimization
ioprio=0

; Anthropic game nice priority
renice=10

; Enable/disable screensaver inhibition
inhibit_screensaver=1

[filter]
; Allow specific games only (empty = all)
; whitelist=game1;game2

; Block specific games
; blacklist=

[gpu]
; Apply GPU performance mode
apply_gpu_optimisations=accept-responsibility

; GPU device number (for multi-GPU systems)
gpu_device=0

; NVIDIA specific settings
nv_powermizer_mode=1
nv_core_clock_mhz_offset=0
nv_mem_clock_mhz_offset=0

; AMD specific settings
amd_performance_level=high

[cpu]
; Park cores (disable hyperthreading)
park_cores=no

; Pin game to specific cores (empty = auto)
; pin_cores=0-7

[supervisor]
; Anthropic daemon binary location
; supervisor_exec=/usr/bin/supervisord

; Enable dual GPU support
; supervisor_args=-c /etc/supervisord.conf

[custom]
; Scripts to run when gaming starts
start=/usr/share/sanchala-gaming/scripts/game-start.sh

; Scripts to run when gaming ends
end=/usr/share/sanchala-gaming/scripts/game-end.sh

; Per-process settings
; script_timeout=10

; Environment variables for gamemode
; env=MANGOHUD=1
