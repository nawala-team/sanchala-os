# ============================================
# SANCHALA OS - Gaming Configuration
# ============================================
# Master configuration for gaming subsystem
# ============================================

[general]
# Enable gaming optimizations system-wide
enabled=true

# Auto-detect and configure GPU for gaming
auto_gpu_config=true

# Show gaming quick settings in system tray
tray_integration=true

# Default game launcher
default_launcher=steam

[gamemode]
# Enable Feral GameMode by default
enabled=true

# CPU governor during gaming
cpu_governor=performance

# GPU performance mode
gpu_performance_level=high

# Disable compositor during fullscreen games
disable_compositor=true

# I/O priority for games
io_priority=high

# Nice level for game processes (-20 to 19)
nice_level=-4

# Enable real-time scheduling for audio
realtime_audio=true

# Pause indexers during gaming
pause_indexers=true

# Inhibit screen saver
inhibit_screensaver=true

[steam]
# Enable Steam integration
enabled=true

# Default Proton version (leave empty for Steam default)
default_proton=

# Enable Steam Play for all titles
steam_play_all=true

# Enable shader pre-caching
shader_precache=true

# Steam library paths (additional to default)
# library_paths=/games/steam,/data/steam

# Enable Big Picture mode shortcut
big_picture_shortcut=true

# Run Steam at startup (minimized)
autostart=false

[proton]
# Default Proton-GE version
proton_ge_version=latest

# Enable DXVK async shader compilation
dxvk_async=true

# DXVK state cache path
dxvk_state_cache=~/.cache/dxvk

# VKD3D shader cache
vkd3d_shader_cache=~/.cache/vkd3d

# Enable FSR (FidelityFX Super Resolution)
enable_fsr=true
fsr_sharpness=5

# Enable DLSS (if supported)
enable_dlss=auto

# Proton log level (0=off, 1=errors, 2=fixme, 3=all)
log_level=0

[wine]
# Default Wine prefix location
prefix_path=~/.wine

# Default Wine version
default_version=wine-staging

# Enable DXVK for Wine
dxvk_enabled=true

# Enable VKD3D for Wine (DX12)
vkd3d_enabled=true

# Wine debug channels (empty for none)
debug_channels=

# Enable ESync
esync=true

# Enable FSync (requires kernel support)
fsync=true

[controllers]
# Enable controller support
enabled=true

# Enable Xbox controller support (xpadneo)
xbox_support=true

# Enable PlayStation controller support
playstation_support=true

# Enable Nintendo controller support
nintendo_support=true

# Controller LED customization
led_customization=true

# Rumble/vibration support
rumble_enabled=true

# Gyro support (where available)
gyro_enabled=true

# Steam Input for non-Steam games
steam_input_integration=true

# Default button mapping preset
default_mapping=xinput

[streaming]
# Enable game streaming server (Sunshine)
server_enabled=false

# Enable game streaming client (Moonlight)
client_enabled=true

# Streaming quality preset (720p, 1080p, 1440p, 4k)
quality_preset=1080p

# Target bitrate (Mbps)
bitrate=20

# Target framerate
framerate=60

# Hardware encoding (auto, nvenc, vaapi, software)
encoder=auto

# HEVC encoding (better quality, requires support)
hevc_enabled=true

# HDR streaming (if supported)
hdr_enabled=auto

[performance]
# MangoHud enabled by default
mangohud_enabled=false

# MangoHud position (top-left, top-right, bottom-left, bottom-right)
mangohud_position=top-left

# MangoHud metrics to display
mangohud_metrics=fps,frametime,cpu,gpu,vram,ram

# Enable VkBasalt post-processing
vkbasalt_enabled=false

# Gamescope compositor
gamescope_enabled=false
gamescope_resolution=native

# Frame limiter (0=disabled)
frame_limit=0

[paths]
# Game installation paths
steam_library=~/.local/share/Steam
lutris_library=~/Games
wine_prefixes=~/.wine_prefixes
saves_backup=~/.local/share/game-saves
shader_cache=~/.cache/shader-cache

[notifications]
# Show game launch notifications
launch_notify=true

# Show achievement notifications (if supported)
achievement_notify=true

# Show FPS warnings
fps_warning_enabled=true
fps_warning_threshold=30

# Show temperature warnings
temp_warning_enabled=true
temp_warning_threshold=85
