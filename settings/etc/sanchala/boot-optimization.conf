# ============================================================================
# SANCHALA OS - Boot Optimization Configuration
# ============================================================================
# Version: 1.0 | Target: <3 second boot time
#
# Strategy:
#   1. Minimize kernel initialization time
#   2. Parallel service startup (systemd default)
#   3. Defer non-critical services
#   4. Use socket/D-Bus activation for on-demand services
#   5. Optimize initramfs
# ============================================================================

[Boot]
# Timeout in seconds before default entry is booted
# 0 = instant boot (no menu unless key held)
Timeout=0

# Timeout when a key is pressed (show menu)
TimeoutMenu=5

# Console output during boot (quiet for faster boot)
# Options: auto, count, wait
ConsoleMode=auto

# Use high-resolution console during boot
Editor=yes

[Optimization]
# Services to start AFTER boot completes (deferred)
DeferredServices=
    cups.service
    bluetooth.service
    avahi-daemon.service
    ModemManager.service
    udisks2.service
    accounts-daemon.service
    packagekit.service
    fwupd.service
    bolt.service

# Services that must start during boot (critical path)
CriticalServices=
    systemd-journald.service
    systemd-udevd.service
    dbus.service
    NetworkManager.service
    sddm.service

# Services to disable entirely (enable manually if needed)
DisabledServices=
    lvm2-monitor.service
    dmraid-activation.service
    mdmonitor.service

[Initramfs]
# Modules to include (stripped down for NVMe/SATA boot)
IncludeModules=
    nvme
    ahci
    sd_mod
    btrfs
    dm_crypt
    aesni_intel
    cryptd

# Use early KMS for faster display initialization
EarlyKMS=yes

# Compress initramfs with fast algorithm
Compression=lz4

# Strip unnecessary firmware from initramfs
StripFirmware=yes

[Kernel]
# Quiet boot (reduce console output)
QuietBoot=yes

# Log level during boot (0-7, lower = fewer messages)
LogLevel=3

# Enable Plymouth splash (optional, adds ~0.5s)
Plymouth=yes
