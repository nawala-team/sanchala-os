# ============================================
# SANCHALA OS - Download Manager Settings
# ============================================
# Central configuration for download management
# ============================================

[General]
# Default download directory
default_download_dir=${HOME}/Downloads

# Torrent download directory
torrent_download_dir=${HOME}/Downloads/Torrents

# Incomplete downloads directory
incomplete_dir=${HOME}/Downloads/Incomplete

# Auto-organize downloads by type
auto_organize=true

# Organization rules
organize_videos=${HOME}/Videos
organize_music=${HOME}/Music
organize_documents=${HOME}/Documents
organize_images=${HOME}/Pictures
organize_archives=${HOME}/Downloads/Archives
organize_software=${HOME}/Downloads/Software

[Bandwidth]
# Global bandwidth limits (KiB/s, 0 = unlimited)
max_download_speed=0
max_upload_speed=0

# Scheduled bandwidth limits
schedule_enabled=true
schedule_start=09:00
schedule_end=17:00
schedule_download_limit=2048
schedule_upload_limit=512

# Per-application limits
aria2_max_speed=0
qbittorrent_max_speed=0
browser_max_speed=0

[Scheduling]
# Enable download scheduling
enabled=true

# Queue management
max_concurrent_downloads=3
max_concurrent_torrents=5

# Time-based scheduling (24h format)
# Format: start_time-end_time:speed_limit_kbps
weekday_schedule=09:00-17:00:2048,17:00-23:00:0,23:00-09:00:0
weekend_schedule=00:00-24:00:0

# Pause downloads on battery
pause_on_battery=true

# Pause downloads on metered connection
pause_on_metered=true

[Integration]
# Browser integration
browser_integration=true
supported_browsers=firefox,chromium,brave,vivaldi

# Capture downloads larger than (MB)
min_capture_size=10

# File types to always capture
capture_extensions=.exe,.msi,.deb,.rpm,.AppImage,.tar.gz,.tar.xz,.zip,.rar,.7z,.iso,.torrent,.magnet

# Clipboard monitoring
monitor_clipboard=true
clipboard_patterns=magnet:,*.torrent,http*://*/*.zip,http*://*/*.rar

[Aria2]
# aria2 RPC settings
rpc_enabled=true
rpc_host=127.0.0.1
rpc_port=6800
rpc_secret=sanchala_aria2_secret

# Start aria2 daemon on login
autostart=true

# Max connections per server
max_connections=16

# Split downloads into segments
split_count=16

[qBittorrent]
# Auto-start qBittorrent
autostart=false

# Start minimized to tray
start_minimized=true

# Enable search plugins
search_enabled=true

# Anonymous mode
anonymous_mode=true

# Encryption mode (0=prefer, 1=require, 2=disable)
encryption=1

[Privacy]
# Clear download history on exit
clear_history_on_exit=false

# History retention (days, 0 = forever)
history_retention=30

# Secure delete incomplete files
secure_delete=false

# Use system proxy
use_system_proxy=true

[Notifications]
# Enable notifications
enabled=true

# Notify on download complete
notify_complete=true

# Notify on download error
notify_error=true

# Notify on queue complete
notify_queue_complete=true

# Sound notifications
sound_enabled=true
sound_complete=/usr/share/sounds/sanchala/download-complete.ogg
