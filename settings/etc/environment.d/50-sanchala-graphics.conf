# ============================================
# SANCHALA OS - Graphics Environment Variables
# ============================================
# Optimized for Wayland with hardware acceleration
# ============================================

# ===========================================
# Wayland Session
# ===========================================
# Prefer Wayland for Qt applications
QT_QPA_PLATFORM=wayland;xcb
# Prefer Wayland for GTK applications  
GDK_BACKEND=wayland,x11
# Prefer Wayland for SDL applications
SDL_VIDEODRIVER=wayland,x11
# Prefer Wayland for Clutter
CLUTTER_BACKEND=wayland

# ===========================================
# XDG Desktop Portal
# ===========================================
XDG_CURRENT_DESKTOP=KDE
XDG_SESSION_TYPE=wayland

# ===========================================
# Qt Wayland Integration
# ===========================================
# Disable Qt window decorations (use KWin's)
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
# Force Qt Wayland integration plugin
QT_WAYLAND_SHELL_INTEGRATION=layer-shell

# ===========================================
# Hardware Video Acceleration
# ===========================================
# Use VA-API for video acceleration
LIBVA_DRIVER_NAME=auto
# Enable VDPAU via VA-API bridge for AMD/Intel
VDPAU_DRIVER=va_gl

# ===========================================
# Vulkan Configuration
# ===========================================
# Let apps use any available Vulkan driver
# AMD_VULKAN_ICD=RADV
# Disable implicit layers for performance
VK_LOADER_DISABLE_ALL_IMPLICIT_LAYERS=0

# ===========================================
# Mesa/OpenGL Configuration
# ===========================================
# Enable shader disk cache for faster loads
MESA_SHADER_CACHE_DISABLE=false
# Threaded OpenGL for better performance
mesa_glthread=true

# ===========================================
# Firefox Wayland
# ===========================================
MOZ_ENABLE_WAYLAND=1
MOZ_WEBRENDER=1

# ===========================================
# Electron Apps Wayland
# ===========================================
ELECTRON_OZONE_PLATFORM_HINT=auto
