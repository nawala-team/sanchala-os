# ============================================
# SANCHALA OS - Multi-GPU Configuration
# ============================================
# Handles hybrid graphics (Intel+NVIDIA, AMD+AMD)
# Prime render offload and GPU switching
# ============================================

# ===========================================
# Default GPU Selection
# ===========================================
# Use integrated GPU for desktop (power saving)
# Discrete GPU available for demanding apps

# PRIME Render Offload - Run specific apps on discrete GPU:
# DRI_PRIME=1 application        (AMD/Intel open source)
# __NV_PRIME_RENDER_OFFLOAD=1 application (NVIDIA)

# ===========================================
# AMD Hybrid (PRIME)
# ===========================================
# For laptops with dual AMD GPUs or AMD+AMD
# Default: Integrated GPU
DRI_PRIME=0

# ===========================================
# NVIDIA Optimus (PRIME Render Offload)
# ===========================================
# For Intel+NVIDIA or AMD+NVIDIA laptops
# Desktop defaults to integrated, games use discrete

# NVIDIA render offload variables (set by sanchala-gpu-detect)
# __NV_PRIME_RENDER_OFFLOAD=0
# __NV_PRIME_RENDER_OFFLOAD_PROVIDER=NVIDIA-G0
# __GLX_VENDOR_LIBRARY_NAME=nvidia
# __VK_LAYER_NV_optimus=NVIDIA_only

# ===========================================
# Power Management
# ===========================================
# Enable runtime PM for discrete GPU when not in use
# Handled by udev rules in 70-sanchala-gpu.rules
