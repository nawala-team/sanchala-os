# ============================================
# SANCHALA OS - HiDPI Scaling Configuration
# ============================================
# Automatic scaling handled by KDE Plasma
# These are fallbacks for non-KDE apps
# ============================================

# ===========================================
# Qt HiDPI Scaling
# ===========================================
# Enable automatic HiDPI scaling for Qt5/Qt6
QT_AUTO_SCREEN_SCALE_FACTOR=1
# Use physical DPI for scaling decisions
QT_ENABLE_HIGHDPI_SCALING=1
# Fractional scaling rounding policy
QT_SCALE_FACTOR_ROUNDING_POLICY=RoundPreferFloor

# ===========================================
# GTK HiDPI Scaling  
# ===========================================
# GTK auto-detects scale from Wayland/KDE
# These are fallback values
GDK_SCALE=1
GDK_DPI_SCALE=1

# ===========================================
# Cursor Size
# ===========================================
# Default cursor size (24 for normal, 32/48 for HiDPI)
XCURSOR_SIZE=24
