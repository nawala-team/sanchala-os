# ============================================================================
# SANCHALA OS - Fcitx5 Environment Variables
# ============================================================================
# Location: /etc/environment.d/80-sanchala-ime.conf
# Input method environment for CJK support
# ============================================================================

# Input method framework
INPUT_METHOD=fcitx
GTK_IM_MODULE=fcitx
QT_IM_MODULE=fcitx
XMODIFIERS=@im=fcitx
SDL_IM_MODULE=fcitx
GLFW_IM_MODULE=ibus

# XDG portal for Wayland input method support
# WAYLAND_IM_MODULE is not needed - fcitx5 uses wayland input-method protocol
