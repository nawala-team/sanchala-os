# ============================================
# SANCHALA OS - Hardware Video Acceleration
# ============================================
# VA-API and VDPAU environment settings
# ============================================

# ===========================================
# VA-API Configuration
# ===========================================
# Auto-detect driver (mesa/intel/nvidia)
LIBVA_DRIVER_NAME=auto

# VA-API message level (0=errors only)
LIBVA_MESSAGING_LEVEL=0

# ===========================================
# VDPAU Configuration
# ===========================================
# Use VA-API bridge for AMD/Intel
VDPAU_DRIVER=va_gl

# ===========================================
# FFmpeg Hardware Acceleration
# ===========================================
# Enable VA-API for FFmpeg
FFMPEG_VAAPI=1

# ===========================================
# GStreamer VA-API Plugin
# ===========================================
GST_VAAPI_ALL_DRIVERS=1

# ===========================================
# MPV Hardware Decoding
# ===========================================
# Use hardware decoding by default
# MPV config handles this, but env is fallback

# ===========================================
# VLC Hardware Acceleration
# ===========================================
# VLC reads from its own config
