# ============================================================================
# SANCHALA OS - Battery Health & Charging Thresholds
# ============================================================================
# Version: 1.0 | Target: Maximize battery longevity
# Location: /etc/tlp.d/10-sanchala-battery-health.conf
# ============================================================================
# 
# BATTERY LONGEVITY PRINCIPLES:
# - Keeping batteries between 20-80% extends lifespan 2-4x
# - Avoiding full charges and deep discharges reduces wear
# - Temperature management is critical (avoid charging when hot)
#
# Sanchala implements "MacBook Optimized Charging" style battery care
# ============================================================================

# ============================================================================
# THINKPAD BATTERY THRESHOLDS
# ============================================================================
# ThinkPads have the best Linux battery threshold support via tp_smapi/acpi_call
# START_THRESHOLD: Start charging when battery drops below this level
# STOP_THRESHOLD: Stop charging when battery reaches this level

# Main battery (BAT0)
START_CHARGE_THRESH_BAT0=40
STOP_CHARGE_THRESH_BAT0=80

# Secondary battery (BAT1, if present - ultrabase, slice battery)
START_CHARGE_THRESH_BAT1=40
STOP_CHARGE_THRESH_BAT1=80

# ============================================================================
# ASUS LAPTOPS (asus-wmi/asus-nb-wmi)
# ============================================================================
# ASUS laptops support charge limit via asus-wmi kernel module
# Values: 40, 60, 80, 100

ASUS_CHARGE_LIMIT=80

# ============================================================================
# HUAWEI LAPTOPS (huawei-wmi)
# ============================================================================
# Format: "start stop" (e.g., "40 80")

HUAWEI_CHARGE_THRESHOLDS="40 80"

# ============================================================================
# LG LAPTOPS (lg-laptop)
# ============================================================================
# Values: 80, 100

LG_BATTERY_CHARGE_LIMIT=80

# ============================================================================
# SAMSUNG LAPTOPS (samsung-laptop)
# ============================================================================
# 0 = normal charging, 1 = battery life extender (stops at 80%)

SAMSUNG_BATTERY_LIFE_EXTENDER=1

# ============================================================================
# SONY VAIO (sony-laptop)
# ============================================================================
# Values: 50, 80, 100

SONY_BATTERY_CARE_LIMIT=80

# ============================================================================
# TOSHIBA/DYNABOOK
# ============================================================================
# 0 = full charge, 1 = eco charge (80%)

TOSHIBA_ECO_CHARGE=1

# ============================================================================
# FRAMEWORK LAPTOP
# ============================================================================
# Framework laptops support thresholds via ectool
# Note: Requires framework-ectool package

# Charge limit percentage
FRAMEWORK_CHARGE_LIMIT=80

# ============================================================================
# SYSTEM76 LAPTOPS
# ============================================================================
# System76 laptops with open firmware support thresholds

SYSTEM76_CHARGE_THRESHOLDS="40 80"

# ============================================================================
# GENERAL BATTERY CONSERVATION
# ============================================================================

# Restore thresholds on boot and resume
RESTORE_THRESHOLDS_ON_BAT=1

# Apply thresholds on AC plug-in
NATACPI_ENABLE=1
TPACPI_ENABLE=1
TPSMAPI_ENABLE=1

# ============================================================================
# BATTERY CARE MODES (Sanchala Custom)
# ============================================================================
# These are reference values for the Sanchala Power Manager GUI
# The GUI will modify the thresholds above based on selected mode

# MODE: maximum_longevity
# - Start: 40%, Stop: 80%
# - Best for always-plugged-in laptops
# - Expected: 3-4x battery lifespan

# MODE: balanced  
# - Start: 30%, Stop: 85%
# - Good balance of longevity and runtime
# - Expected: 2-3x battery lifespan

# MODE: full_charge
# - Start: 95%, Stop: 100%
# - For travel days when you need maximum runtime
# - Use sparingly

# MODE: travel
# - Start: 20%, Stop: 100%
# - Charges fully, allows deep discharge
# - For extended travel without AC power
