# ============================================================================
# SANCHALA OS - TLP Base Power Configuration
# ============================================================================
# Version: 1.0 | Target: MacBook-level battery life
# Location: /etc/tlp.d/00-sanchala-base.conf
# Priority: 00 (base settings, can be overridden by higher-numbered files)
# ============================================================================

# ============================================================================
# GLOBAL SETTINGS
# ============================================================================

TLP_ENABLE=1
TLP_DEFAULT_MODE=AC
TLP_PERSISTENT_DEFAULT=0

# ============================================================================
# CPU POWER MANAGEMENT
# ============================================================================

# CPU frequency scaling governor
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# CPU Energy-Performance Preference (Intel HWP / AMD CPPC)
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# Intel CPU HWP dynamic boost
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0

# CPU turbo boost (0=enable, 1=disable)
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# Platform profile (Intel DPTF / AMD)
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=low-power

# Power-aware scheduling
SCHED_POWERSAVE_ON_AC=0
SCHED_POWERSAVE_ON_BAT=1

# ============================================================================
# DISK POWER MANAGEMENT
# ============================================================================

# SATA Aggressive Link Power Management
SATA_LINKPWR_ON_AC="med_power_with_dipm"
SATA_LINKPWR_ON_BAT="min_power"

# AHCI runtime power management
AHCI_RUNTIME_PM_ON_AC=on
AHCI_RUNTIME_PM_ON_BAT=auto
AHCI_RUNTIME_PM_TIMEOUT=15

# Disk APM level (1=min power, 254=max performance)
DISK_APM_LEVEL_ON_AC="254 254"
DISK_APM_LEVEL_ON_BAT="128 128"

# Disk I/O scheduler (mq-deadline optimal for SSDs)
DISK_IOSCHED="mq-deadline"

# NVMe APST (deep sleep states)
NVME_APST_ON_AC=1
NVME_APST_ON_BAT=1

# Laptop mode (delays disk writes on battery)
DISK_IDLE_SECS_ON_AC=0
DISK_IDLE_SECS_ON_BAT=2
