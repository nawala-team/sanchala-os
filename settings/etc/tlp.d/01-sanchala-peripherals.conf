# ============================================================================
# SANCHALA OS - TLP Peripheral Power Configuration
# ============================================================================
# Version: 1.0 | Network, Audio, USB, PCIe power management
# Location: /etc/tlp.d/01-sanchala-peripherals.conf
# ============================================================================

# ============================================================================
# NETWORK POWER MANAGEMENT
# ============================================================================

# WiFi power saving mode
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# Wake-on-LAN (disable to save battery during sleep)
WOL_DISABLE=Y

# ============================================================================
# AUDIO POWER MANAGEMENT
# ============================================================================

# Intel HDA audio power saving (may cause audio glitches if enabled)
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# ============================================================================
# PCI EXPRESS POWER MANAGEMENT
# ============================================================================

# PCIe ASPM (Active State Power Management)
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave

# Runtime PM for PCI(e) devices
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto

# Driver denylist for runtime PM
RUNTIME_PM_DRIVER_DENYLIST="mei_me nouveau"

# ============================================================================
# USB POWER MANAGEMENT
# ============================================================================

# USB autosuspend
USB_AUTOSUSPEND=1
USB_AUTOSUSPEND_TIMEOUT=2

# Device exclusions
USB_DENYLIST=""
USB_ALLOWLIST=""
USB_EXCLUDE_BTUSB=0
USB_EXCLUDE_PHONE=1
USB_EXCLUDE_PRINTER=1
USB_EXCLUDE_WWAN=0

# ============================================================================
# GRAPHICS POWER MANAGEMENT
# ============================================================================

# Radeon DPM state
RADEON_DPM_STATE_ON_AC=performance
RADEON_DPM_STATE_ON_BAT=battery
RADEON_DPM_PERF_LEVEL_ON_AC=auto
RADEON_DPM_PERF_LEVEL_ON_BAT=low

# AMD Adaptive Backlight Management
AMDGPU_ABM_LEVEL_ON_AC=0
AMDGPU_ABM_LEVEL_ON_BAT=3

# ============================================================================
# DEBUG
# ============================================================================

TLP_DEBUG="0"
