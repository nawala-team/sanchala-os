# ============================================================================
# SANCHALA OS - Laptop-Specific Power Optimizations
# ============================================================================
# Version: 1.0 | Vendor-specific tweaks for optimal power management
# Location: /etc/tlp.d/20-sanchala-laptop-specific.conf
# ============================================================================

# ============================================================================
# THINKPAD-SPECIFIC SETTINGS
# ============================================================================

# ThinkPad battery recalibration
# Run: tlp recalibrate BAT0
# This performs a full discharge/charge cycle to recalibrate the fuel gauge

# ThinkPad discharge control (for calibration)
# 0 = normal, 1 = force discharge
TPACPI_DISCHARGE_BAT0=0
TPACPI_DISCHARGE_BAT1=0

# ThinkPad undock USB power
# 1 = keep USB powered when undocked
TPACPI_UNDOCK_USBPOWER=1

# ============================================================================
# INTEL-SPECIFIC OPTIMIZATIONS
# ============================================================================

# Intel P-State driver settings
# - active: Hardware-managed (HWP) mode
# - passive: Software-managed mode
# Modern Intel CPUs (Skylake+) should use active
CPU_DRIVER_OPMODE_ON_AC=active
CPU_DRIVER_OPMODE_ON_BAT=active

# Intel Panel Self-Refresh (PSR) for displays
# Reduces GPU power by letting panel maintain image
# Note: Some displays have PSR issues - disable if flickering occurs
# Controlled via kernel parameter: i915.enable_psr=1

# Intel RAPL (Running Average Power Limit)
# Hardware power limiting - let CPU manage its own power envelope
# These are hints to the firmware, actual limits vary by hardware

# ============================================================================
# AMD-SPECIFIC OPTIMIZATIONS  
# ============================================================================

# AMD Adaptive Backlight Management (ABM)
# 0 = off, 1-4 = increasing aggressiveness (saves power but affects colors)
AMDGPU_ABM_LEVEL_ON_AC=0
AMDGPU_ABM_LEVEL_ON_BAT=2

# AMD Platform Management Framework (PMF)
# Modern AMD laptops (Ryzen 6000+) have advanced power features
# Controlled via platform_profile

# AMD S0ix (Modern Standby)
# For AMD laptops, ensure amd_pmc driver is loaded
# Check: cat /sys/power/mem_sleep (should show s2idle)

# ============================================================================
# NVIDIA OPTIMUS / HYBRID GRAPHICS
# ============================================================================

# For hybrid graphics laptops, discrete GPU should be powered off when idle
# This is handled by runtime PM and nvidia-prime/optimus-manager
# TLP settings that help:

# Runtime PM driver denylist (DO NOT add nvidia here if using bbswitch)
RUNTIME_PM_DRIVER_DENYLIST="mei_me nouveau"

# USB devices to always keep powered (external GPUs, docks)
USB_ALLOWLIST=""

# ============================================================================
# APPLE MACBOOK (Linux)
# ============================================================================

# For MacBooks running Linux (T2 or older Intel)
# Note: Apple Silicon not yet supported

# Apple SMC fan control
# Handled by applesmc driver, not TLP

# Thunderbolt power management
# TB devices can draw significant power
# Runtime PM handles this automatically

# ============================================================================
# SURFACE DEVICES
# ============================================================================

# Microsoft Surface devices use platform_profile
# linux-surface kernel patches improve power management
# PLATFORM_PROFILE settings in 00-base apply

# ============================================================================
# DELL-SPECIFIC
# ============================================================================

# Dell laptops often support SMBIOS thermal modes
# Controlled via dell-smm-hwmon or libsmbios
# Values: Balanced, Cool-Bottom, Quiet, Performance

# Dell Command | Configure can set battery thresholds
# But requires proprietary tool - prefer UEFI settings

# ============================================================================
# HP-SPECIFIC  
# ============================================================================

# HP laptops may support hp-wmi battery settings
# Limited Linux support compared to Windows HP tools

# ============================================================================
# LENOVO (NON-THINKPAD)
# ============================================================================

# IdeaPad/Legion laptops use ideapad-laptop driver
# Conservation mode (ideapad_acpi):
# echo 1 > /sys/bus/platform/drivers/ideapad_acpi/VPC2004:00/conservation_mode

# ============================================================================
# CHROMEBOOK (Running Linux)
# ============================================================================

# Chromebooks running mainline Linux or chrultrabook
# Often have limited power management support
# cros_ec driver provides some functionality

# ============================================================================
# GENERIC LAPTOP DETECTION
# ============================================================================

# TLP auto-detects laptop type and applies appropriate settings
# Manual overrides can be placed here if detection fails

# Force ThinkPad mode (if not auto-detected)
# THINKPAD_FORCE=1

# Force specific battery driver
# BATTERY_DRIVER="thinkpad"
