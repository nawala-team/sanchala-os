<?xml version="1.0" encoding="UTF-8"?>
<!--
  SANCHALA OS - Monochrome Icon
  Version: 1.0
  Description: Single color icon using currentColor
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- Outer ring -->
  <circle cx="40" cy="40" r="35" fill="none" stroke="currentColor" stroke-width="3"/>
  
  <!-- Motion arcs -->
  <path d="M 40 7 A 33 33 0 0 1 71 32" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <path d="M 73 40 A 33 33 0 0 1 55 68" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 40 73 A 33 33 0 0 1 9 50" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Central hub -->
  <circle cx="40" cy="40" r="14" fill="currentColor"/>
  
  <!-- Gear spokes -->
  <rect x="38" y="16" width="4" height="14" rx="2" fill="currentColor"/>
  <rect x="38" y="50" width="4" height="14" rx="2" fill="currentColor"/>
  <rect x="16" y="38" width="14" height="4" rx="2" fill="currentColor"/>
  <rect x="50" y="38" width="14" height="4" rx="2" fill="currentColor"/>
  
  <!-- Center focal point -->
  <circle cx="40" cy="40" r="6" fill="#FFFFFF"/>
  <circle cx="40" cy="40" r="3.5" fill="currentColor"/>
</svg>
