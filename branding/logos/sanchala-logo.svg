<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Gradient untuk logo utama -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3949AB">
        <animate attributeName="stop-color" values="#3949AB;#536DFE;#3949AB" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#1A237E">
        <animate attributeName="stop-color" values="#1A237E;#3949AB;#1A237E" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <!-- Gradient untuk Astra (senjata/bintang) -->
    <linearGradient id="astraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB300">
        <animate attributeName="stop-color" values="#FFB300;#FFD54F;#FFB300" dur="2s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FF8F00">
        <animate attributeName="stop-color" values="#FF8F00;#FFB300;#FF8F00" dur="2s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Outer glow untuk Astra -->
    <filter id="astraGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#mainGradient)" filter="url(#glow)">
    <animate attributeName="r" values="88;92;88" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Inner ring -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#536DFE" stroke-width="2" opacity="0.5">
    <animate attributeName="r" values="73;77;73" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Astra Symbol - 8-pointed star (Divine Weapon) -->
  <g filter="url(#astraGlow)">
    <polygon points="100,30 108,80 100,70 92,80" fill="url(#astraGradient)">
      <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="20s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="100,30 108,80 100,70 92,80" fill="url(#astraGradient)">
      <animateTransform attributeName="transform" type="rotate" from="45 100 100" to="405 100 100" dur="20s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="100,30 108,80 100,70 92,80" fill="url(#astraGradient)">
      <animateTransform attributeName="transform" type="rotate" from="90 100 100" to="450 100 100" dur="20s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="100,30 108,80 100,70 92,80" fill="url(#astraGradient)">
      <animateTransform attributeName="transform" type="rotate" from="135 100 100" to="495 100 100" dur="20s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="100,30 108,80 100,70 92,80" fill="url(#astraGradient)">
      <animateTransform attributeName="transform" type="rotate" from="180 100 100" to="540 100 100" dur="20s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="100,30 108,80 100,70 92,80" fill="url(#astraGradient)">
      <animateTransform attributeName="transform" type="rotate" from="225 100 100" to="585 100 100" dur="20s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="100,30 108,80 100,70 92,80" fill="url(#astraGradient)">
      <animateTransform attributeName="transform" type="rotate" from="270 100 100" to="630 100 100" dur="20s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="100,30 108,80 100,70 92,80" fill="url(#astraGradient)">
      <animateTransform attributeName="transform" type="rotate" from="315 100 100" to="675 100 100" dur="20s" repeatCount="indefinite"/>
    </polygon>
  </g>
  
  <!-- Center circle -->
  <circle cx="100" cy="100" r="25" fill="#1A237E">
    <animate attributeName="r" values="23;27;23" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Inner core - pulsing -->
  <circle cx="100" cy="100" r="15" fill="url(#astraGradient)">
    <animate attributeName="r" values="13;17;13" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- S letter in center -->
  <text x="100" y="108" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1A237E" text-anchor="middle">
    S
    <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
  </text>
  
  <!-- Orbiting particles -->
  <circle cx="100" cy="35" r="4" fill="#FFD54F">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="35" r="3" fill="#536DFE">
    <animateTransform attributeName="transform" type="rotate" from="120 100 100" to="480 100 100" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="35" r="3" fill="#FFB300">
    <animateTransform attributeName="transform" type="rotate" from="240 100 100" to="600 100 100" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
