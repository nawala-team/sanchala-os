<?xml version="1.0" encoding="UTF-8"?>
<!--
  SANCHALA OS - Wordmark Only
  Version: 1.0
  Description: Text-only logo for headers, text contexts
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A237E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3949AB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#536DFE;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main wordmark -->
  <text x="10" y="42" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="600" fill="url(#textGradient)" letter-spacing="3">
    SANCHALA
  </text>
  
  <!-- Sanskrit subtitle -->
  <text x="12" y="56" font-family="'Noto Sans Devanagari', Inter, sans-serif" font-size="11" font-weight="400" fill="#536DFE" letter-spacing="1">
    संञ्चल — Set in Motion
  </text>
</svg>
