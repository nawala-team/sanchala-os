<?xml version="1.0" encoding="UTF-8"?>
<!--
  SANCHALA OS - White Icon Only
  Version: 1.0
  Description: White icon for dark backgrounds, boot screens
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <filter id="whiteIconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer motion ring -->
  <circle cx="40" cy="40" r="35" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.85"/>
  
  <!-- Motion arcs -->
  <g filter="url(#whiteIconGlow)">
    <path d="M 40 7 A 33 33 0 0 1 71 32" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="1"/>
    <path d="M 73 40 A 33 33 0 0 1 55 68" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <path d="M 40 73 A 33 33 0 0 1 9 50" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  </g>
  
  <!-- Inner gear structure -->
  <g fill="#FFFFFF">
    <circle cx="40" cy="40" r="14" opacity="0.95"/>
    
    <!-- Gear spokes -->
    <rect x="38" y="16" width="4" height="14" rx="2" opacity="0.9"/>
    <rect x="38" y="50" width="4" height="14" rx="2" opacity="0.9"/>
    <rect x="16" y="38" width="14" height="4" rx="2" opacity="0.9"/>
    <rect x="50" y="38" width="14" height="4" rx="2" opacity="0.9"/>
    
    <!-- Diagonal spokes -->
    <rect x="38" y="22" width="4" height="10" rx="2" transform="rotate(45 40 40)" opacity="0.7"/>
    <rect x="38" y="22" width="4" height="10" rx="2" transform="rotate(135 40 40)" opacity="0.7"/>
    <rect x="38" y="22" width="4" height="10" rx="2" transform="rotate(225 40 40)" opacity="0.7"/>
    <rect x="38" y="22" width="4" height="10" rx="2" transform="rotate(315 40 40)" opacity="0.7"/>
  </g>
  
  <!-- Center focal point -->
  <circle cx="40" cy="40" r="6" fill="#1A237E"/>
  <circle cx="40" cy="40" r="3.5" fill="#FFFFFF"/>
  
  <!-- Motion accent -->
  <path d="M 12 62 Q 4 45, 14 30" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
</svg>
