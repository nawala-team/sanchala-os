<?xml version="1.0" encoding="UTF-8"?>
<!--
  SANCHALA OS - White Logo Variant
  Version: 1.0
  Description: White/monochrome logo for dark backgrounds
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100">
  <defs>
    <linearGradient id="whiteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E0E0;stop-opacity:1" />
    </linearGradient>
    
    <filter id="whiteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Logo Mark - White variant -->
  <g id="logomark-white" transform="translate(10, 10)">
    <!-- Outer circle -->
    <circle cx="40" cy="40" r="36" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    
    <!-- Motion arcs -->
    <path d="M 40 6 A 34 34 0 0 1 72 28" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="1" filter="url(#whiteGlow)"/>
    <path d="M 74 40 A 34 34 0 0 1 56 70" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M 40 74 A 34 34 0 0 1 8 52" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Inner gear -->
    <g fill="#FFFFFF">
      <circle cx="40" cy="40" r="12" fill="#FFFFFF" opacity="0.95"/>
      
      <!-- Gear spokes -->
      <rect x="38" y="16" width="4" height="12" rx="2" opacity="0.9"/>
      <rect x="38" y="52" width="4" height="12" rx="2" opacity="0.9"/>
      <rect x="16" y="38" width="12" height="4" rx="2" opacity="0.9"/>
      <rect x="52" y="38" width="12" height="4" rx="2" opacity="0.9"/>
      
      <!-- Diagonal spokes -->
      <rect x="38" y="26" width="4" height="8" rx="2" transform="rotate(45 40 40)" opacity="0.7"/>
      <rect x="38" y="26" width="4" height="8" rx="2" transform="rotate(135 40 40)" opacity="0.7"/>
      <rect x="38" y="26" width="4" height="8" rx="2" transform="rotate(225 40 40)" opacity="0.7"/>
      <rect x="38" y="26" width="4" height="8" rx="2" transform="rotate(315 40 40)" opacity="0.7"/>
    </g>
    
    <!-- Center dot -->
    <circle cx="40" cy="40" r="5" fill="#1A237E"/>
    <circle cx="40" cy="40" r="3" fill="#FFFFFF"/>
    
    <!-- Motion trail -->
    <path d="M 15 65 Q 5 50, 15 35" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>
  
  <!-- Wordmark - White -->
  <g id="wordmark-white" transform="translate(100, 35)">
    <text x="0" y="30" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="600" fill="#FFFFFF" letter-spacing="2">
      SANCHALA
    </text>
    <text x="2" y="48" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#FFFFFF" letter-spacing="4" opacity="0.8">
      SET IN MOTION
    </text>
  </g>
</svg>
