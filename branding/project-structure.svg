<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 550" width="700" height="550">
  <defs>
    <linearGradient id="bgStruct" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <filter id="glowS">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="550" fill="url(#bgStruct)" rx="15"/>
  <rect width="700" height="550" fill="none" stroke="#3949AB" stroke-width="2" rx="15" opacity="0.5"/>
  
  <!-- Title -->
  <text x="350" y="35" text-anchor="middle" fill="#fff" font-family="Arial" font-size="20" font-weight="bold">📁 SANCHALA OS - Project Structure</text>
  
  <!-- Root -->
  <text x="40" y="70" fill="#FFB300" font-family="monospace" font-size="14" font-weight="bold">📦 sanchala-os/</text>
  
  <!-- ISO -->
  <text x="60" y="100" fill="#00d4ff" font-family="monospace" font-size="13">├── 📀 iso/</text>
  <text x="380" y="100" fill="#666" font-family="Arial" font-size="11">ISO Builder &amp; Live System</text>
  <text x="80" y="120" fill="#8b8ba7" font-family="monospace" font-size="11">│   ├── build-binary</text>
  <text x="80" y="138" fill="#8b8ba7" font-family="monospace" font-size="11">│   ├── packages/</text>
  <text x="80" y="156" fill="#8b8ba7" font-family="monospace" font-size="11">│   └── airootfs/</text>
  
  <!-- Filesystem -->
  <text x="60" y="186" fill="#22c55e" font-family="monospace" font-size="13">├── 🗂️ filesystem/</text>
  <text x="380" y="186" fill="#666" font-family="Arial" font-size="11">OS Identity &amp; Branding</text>
  <text x="80" y="206" fill="#8b8ba7" font-family="monospace" font-size="11">│   ├── os-release</text>
  <text x="80" y="224" fill="#8b8ba7" font-family="monospace" font-size="11">│   └── lsb-release</text>
  
  <!-- Pkgbuilds -->
  <text x="60" y="254" fill="#f97316" font-family="monospace" font-size="13">├── 📦 pkgbuilds/</text>
  <text x="380" y="254" fill="#666" font-family="Arial" font-size="11">Custom AUR Packages</text>
  <text x="80" y="274" fill="#8b8ba7" font-family="monospace" font-size="11">│   ├── sanchala-filesystem/</text>
  <text x="80" y="292" fill="#8b8ba7" font-family="monospace" font-size="11">│   ├── sanchala-settings/</text>
  <text x="80" y="310" fill="#8b8ba7" font-family="monospace" font-size="11">│   └── sanchala-guardian/</text>
  
  <!-- Security -->
  <text x="60" y="340" fill="#ef4444" font-family="monospace" font-size="13">├── 🔒 security/</text>
  <text x="380" y="340" fill="#666" font-family="Arial" font-size="11">8-Layer Security Config</text>
  <text x="80" y="360" fill="#8b8ba7" font-family="monospace" font-size="11">│   ├── kernel/</text>
  <text x="80" y="378" fill="#8b8ba7" font-family="monospace" font-size="11">│   ├── apparmor/</text>
  <text x="80" y="396" fill="#8b8ba7" font-family="monospace" font-size="11">│   └── firewall/</text>
  
  <!-- Tools -->
  <text x="60" y="426" fill="#a855f7" font-family="monospace" font-size="13">├── 🛠️ tools/</text>
  <text x="380" y="426" fill="#666" font-family="Arial" font-size="11">Custom Applications</text>
  <text x="80" y="446" fill="#8b8ba7" font-family="monospace" font-size="11">│   ├── sanchala-guardian/</text>
  <text x="80" y="464" fill="#8b8ba7" font-family="monospace" font-size="11">│   ├── sanchala-store/</text>
  <text x="80" y="482" fill="#8b8ba7" font-family="monospace" font-size="11">│   └── sanchala-browser/</text>
  
  <!-- Branding & Docs -->
  <text x="60" y="512" fill="#ec4899" font-family="monospace" font-size="13">├── 🎨 branding/</text>
  <text x="250" y="512" fill="#666" font-family="Arial" font-size="11">Visual Assets</text>
  <text x="60" y="535" fill="#7c3aed" font-family="monospace" font-size="13">└── 📚 docs/</text>
  <text x="250" y="535" fill="#666" font-family="Arial" font-size="11">Documentation</text>
  
  <!-- Decorative elements -->
  <circle cx="670" cy="70" r="3" fill="#FFB300" opacity="0.6">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="530" r="2" fill="#00d4ff" opacity="0.6">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
