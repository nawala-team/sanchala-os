<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="bgEco" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB300"/>
      <stop offset="100%" style="stop-color:#FF8F00"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#5b21b6"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <filter id="glowEco">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="300" fill="url(#bgEco)" rx="20"/>
  <rect width="800" height="300" fill="none" stroke="#7c3aed" stroke-width="2" rx="20" opacity="0.5">
    <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="bold" filter="url(#glowEco)">NAWALA ECOSYSTEM</text>
  <text x="400" y="70" text-anchor="middle" fill="#8b8ba7" font-family="Arial, sans-serif" font-size="14">Sanskrit-inspired Modern Infrastructure</text>
  
  <!-- Connection Lines -->
  <line x1="265" y1="170" x2="335" y2="170" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" values="10;0" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="465" y1="170" x2="535" y2="170" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" values="10;0" dur="1s" repeatCount="indefinite"/>
  </line>
  
  <!-- Sanchala Card -->
  <rect x="65" y="100" width="200" height="140" rx="15" fill="#1a1a3e" stroke="url(#goldGrad)" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="165" y="135" text-anchor="middle" font-size="30">💻</text>
  <text x="165" y="165" text-anchor="middle" fill="url(#goldGrad)" font-family="Arial, sans-serif" font-size="18" font-weight="bold">SANCHALA</text>
  <text x="165" y="185" text-anchor="middle" fill="#FFB300" font-family="Arial, sans-serif" font-size="14">संचल</text>
  <text x="165" y="210" text-anchor="middle" fill="#8b8ba7" font-family="Arial, sans-serif" font-size="11">Operating System</text>
  <text x="165" y="228" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="10">Foundation Layer</text>
  
  <!-- Nawala Card -->
  <rect x="300" y="100" width="200" height="140" rx="15" fill="#1a1a3e" stroke="url(#purpleGrad)" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.3s"/>
  </rect>
  <text x="400" y="135" text-anchor="middle" font-size="30">🔐</text>
  <text x="400" y="165" text-anchor="middle" fill="url(#purpleGrad)" font-family="Arial, sans-serif" font-size="18" font-weight="bold">NAWALA</text>
  <text x="400" y="185" text-anchor="middle" fill="#7c3aed" font-family="Arial, sans-serif" font-size="14">नवल</text>
  <text x="400" y="210" text-anchor="middle" fill="#8b8ba7" font-family="Arial, sans-serif" font-size="11">API Gateway</text>
  <text x="400" y="228" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="10">Security Layer</text>
  
  <!-- Raksha Card -->
  <rect x="535" y="100" width="200" height="140" rx="15" fill="#1a1a3e" stroke="url(#cyanGrad)" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.6s"/>
  </rect>
  <text x="635" y="135" text-anchor="middle" font-size="30">🛡️</text>
  <text x="635" y="165" text-anchor="middle" fill="url(#cyanGrad)" font-family="Arial, sans-serif" font-size="18" font-weight="bold">RAKSHA</text>
  <text x="635" y="185" text-anchor="middle" fill="#00d4ff" font-family="Arial, sans-serif" font-size="14">रक्षा</text>
  <text x="635" y="210" text-anchor="middle" fill="#8b8ba7" font-family="Arial, sans-serif" font-size="11">SIEM Platform</text>
  <text x="635" y="228" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="10">Monitoring Layer</text>
  
  <!-- Floating particles -->
  <circle cx="50" cy="50" r="2" fill="#FFB300" opacity="0.6">
    <animate attributeName="cy" values="50;250;50" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="250" r="2" fill="#00d4ff" opacity="0.6">
    <animate attributeName="cy" values="250;50;250" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="280" r="1.5" fill="#7c3aed" opacity="0.4">
    <animate attributeName="cy" values="280;20;280" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
