# Sanchala Scheduler - Hourly Cloud Sync Template
# SPDX-License-Identifier: GPL-3.0

[template]
name = "hourly-sync"
description = "Cloud sync every hour"
category = "sync"
icon = "folder-cloud"

[task]
name = "cloud-sync"
description = "Hourly Cloud Synchronization"
command = "/usr/bin/sanchala-cloud sync --quiet"
working_directory = "~"

[schedule]
type = "calendar"
calendar = "*:00:00"
persistent = true

[options]
notify_on_complete = false
notify_on_failure = true
log_output = true
require_network = true
