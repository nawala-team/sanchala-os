# Sanchala Scheduler - Boot Optimization Template
# SPDX-License-Identifier: GPL-3.0

[template]
name = "boot-optimize"
description = "Run optimization after system boot"
category = "performance"
icon = "speedometer"

[task]
name = "boot-optimize"
description = "Post-Boot System Optimization"
command = "/usr/bin/sanchala-boot-optimize --quick"
working_directory = "/"

[schedule]
type = "boot"
delay = "2min"
persistent = false

[options]
notify_on_complete = false
notify_on_failure = true
log_output = true
