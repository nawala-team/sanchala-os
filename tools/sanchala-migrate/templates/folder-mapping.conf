# Folder Mapping Template
# Maps source OS folders to Sanchala OS locations

# Windows Mappings
[windows]
Documents = ~/Documents
Downloads = ~/Downloads
Pictures = ~/Pictures
Music = ~/Music
Videos = ~/Videos
Desktop = ~/Desktop
"Saved Games" = ~/Games/Saves
Contacts = ~/Contacts
AppData/Roaming = ~/.config
.ssh = ~/.ssh

# macOS Mappings
[macos]
Documents = ~/Documents
Downloads = ~/Downloads
Pictures = ~/Pictures
Music = ~/Music
Movies = ~/Videos
Desktop = ~/Desktop
Library/Fonts = ~/.local/share/fonts/migrated
Library/Application Support = ~/.config
.ssh = ~/.ssh

# Linux Mappings
[linux]
Documents = ~/Documents
Downloads = ~/Downloads
Pictures = ~/Pictures
Music = ~/Music
Videos = ~/Videos
Desktop = ~/Desktop
.config = ~/.config
.local/share/fonts = ~/.local/share/fonts
.ssh = ~/.ssh

# Global Exclusions
[exclude]
patterns = ["*.tmp", "*.temp", "*~", ".DS_Store", "Thumbs.db", "desktop.ini", "*.lnk", ".Spotlight-*", ".Trashes", "$RECYCLE.BIN"]
