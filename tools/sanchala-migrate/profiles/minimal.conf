# Minimal Migration Profile
# Documents only - fastest migration

[source]
type = "auto"
detect_users = true

[documents]
enabled = true
folders = ["Documents", "Downloads", "Pictures"]
preserve_structure = false
exclude_patterns = ["*.tmp", "*.cache", "Thumbs.db", ".DS_Store"]

[browser]
enabled = false

[settings]
enabled = false

[fonts]
enabled = false

[ssh]
enabled = false

[advanced]
verify_integrity = true
create_backup = false
parallel_transfers = 4
max_file_size = 1024  # Skip files > 1GB
