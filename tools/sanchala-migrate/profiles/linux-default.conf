# Linux Default Migration Profile
# sanchala-migrate configuration for Linux distributions

[source]
type = "linux"
detect_users = true

[documents]
enabled = true
folders = ["Documents", "Downloads", "Pictures", "Music", "Videos", "Desktop"]
preserve_structure = true
exclude_patterns = ["*.tmp", "*~", ".cache", ".thumbnails", "lost+found"]

[browser]
enabled = true
import_bookmarks = true
import_passwords = false
import_history = false
import_extensions = true
browsers = ["chrome", "firefox", "brave"]

[config]
enabled = true
include = [".bashrc", ".zshrc", ".vimrc", ".gitconfig"]
exclude = [".cache", ".local/share/Trash"]

[settings]
enabled = true
wifi_profiles = true
keyboard_shortcuts = true

[fonts]
enabled = true
source = "~/.local/share/fonts"
user_fonts = true

[ssh]
enabled = false
show_guide = true

[advanced]
verify_integrity = true
create_backup = false
parallel_transfers = 4
max_file_size = 0
