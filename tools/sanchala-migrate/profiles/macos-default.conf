# macOS Default Migration Profile
# sanchala-migrate configuration for macOS

[source]
type = "macos"
detect_users = true

[documents]
enabled = true
folders = ["Documents", "Downloads", "Pictures", "Music", "Movies", "Desktop"]
preserve_structure = false
exclude_patterns = [".DS_Store", "._*", ".Spotlight-*", ".Trashes"]

[browser]
enabled = true
import_bookmarks = true
import_passwords = false  # Requires Keychain export
import_history = false
import_extensions = true
browsers = ["safari", "chrome", "firefox", "brave"]

[settings]
enabled = true
wifi_profiles = false  # Requires Keychain
keyboard_shortcuts = false  # Show mapping guide

[fonts]
enabled = true
source = "/Library/Fonts"
user_fonts = true

[ssh]
enabled = false  # Requires explicit consent
show_guide = true

[advanced]
verify_integrity = true
create_backup = false
parallel_transfers = 4
max_file_size = 0
