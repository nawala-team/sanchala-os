# Windows Default Migration Profile
# sanchala-migrate configuration for Windows 10/11

[source]
type = "windows"
detect_users = true

[documents]
enabled = true
folders = ["Documents", "Downloads", "Pictures", "Music", "Videos", "Desktop"]
preserve_structure = false
exclude_patterns = ["*.tmp", "*.lnk", "Thumbs.db", "desktop.ini"]

[browser]
enabled = true
import_bookmarks = true
import_passwords = false  # Requires explicit consent
import_history = false
import_extensions = true
browsers = ["chrome", "firefox", "edge", "brave"]

[settings]
enabled = true
wifi_profiles = true
keyboard_shortcuts = false  # Show mapping guide instead

[fonts]
enabled = true
source = "C:\\Windows\\Fonts"
user_fonts = true

[ssh]
enabled = false  # Requires explicit consent
show_guide = true

[advanced]
verify_integrity = true
create_backup = false
parallel_transfers = 4
max_file_size = 0  # 0 = unlimited
