# Sanchala Diagnostics - btop Configuration
# System monitor with macOS Activity Monitor-like experience

# Color theme matching Sanchala OS
color_theme = "sanchala"

# Update interval in milliseconds
update_ms = 1000

# Process sorting: pid, program, arguments, threads, user, memory, cpu
proc_sorting = "cpu"

# Reverse sorting order
proc_reversed = true

# Show processes as a tree
proc_tree = false

# Check cpu temperature
check_temp = true

# Draw graphs with higher resolution
graph_symbol = "braille"

# Show battery stats
show_battery = true

# Rounded corners on boxes
rounded_corners = true

# Show process memory as percentage
proc_mem_bytes = false

# Per-core CPU graphs
cpu_single_graph = false

# Show CPU frequency
show_cpu_freq = true

# Show disk activity
show_disks = true

# Show network throughput
show_net = true

# Net download/upload shown as bytes
net_download_bytes = true
net_upload_bytes = true

# Enable vim-style navigation
vim_keys = false

# Show init
show_init = false

# Custom CPU sensor
cpu_sensor = "Auto"

# Disable GPU stats (if needed)
show_gpu_info = true

# Process info default sorting
proc_info_smaps = false

# Theme colors (Sanchala blue accent)
theme[main_bg]="#1e1e2e"
theme[main_fg]="#cdd6f4"
theme[title]="#89b4fa"
