# ============================================
# SANCHALA OS - VkBasalt Configuration
# ============================================
# Location: ~/.config/vkBasalt/vkBasalt.conf
# Enable with: ENABLE_VKBASALT=1
# ============================================

# Effects to apply (in order)
effects = cas

# Contrast Adaptive Sharpening (CAS)
casSharpness = 0.4

# FXAA (Fast Approximate Anti-Aliasing)
# fxaaQualitySubpix = 0.75
# fxaaQualityEdgeThreshold = 0.125
# fxaaQualityEdgeThresholdMin = 0.0312

# SMAA (Subpixel Morphological Anti-Aliasing)
# smaaEdgeDetection = luma
# smaaThreshold = 0.05
# smaaCornerRounding = 25

# Deband (removes color banding)
# debandAvgdiff = 3.4
# debandMaxdiff = 6.8
# debandMidtol = 3.3
# debandRange = 16.0

# LUT (Look-Up Table for color grading)
# lutFile = /path/to/lut.png

# Toggle key
toggleKey = Home
