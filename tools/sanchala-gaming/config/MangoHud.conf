# ============================================
# SANCHALA OS - MangoHud Default Configuration
# ============================================
# Location: ~/.config/MangoHud/MangoHud.conf
# ============================================

# === Position & Appearance ===
position=top-left
font_size=24
background_alpha=0.4
round_corners=8
text_outline
text_outline_thickness=1.5

# === Colors (Sanchala Theme) ===
gpu_color=2E9EFF
cpu_color=FF6B35
vram_color=AD5DFF
ram_color=00D68F
engine_color=FFFFFF
io_color=FFB800
frametime_color=00CED1
background_color=1A1A2E
text_color=FFFFFF

# === Metrics to Display ===
fps
frametime=0
frame_timing=1
cpu_stats
cpu_temp
cpu_power
cpu_mhz
gpu_stats
gpu_temp
gpu_power
gpu_mem_clock
vram
ram
io_read
io_write

# === FPS Limits & Warnings ===
fps_limit=0
fps_color_change
fps_value=30,60

# === Graphs ===
frame_timing
histogram

# === Toggle & Controls ===
toggle_hud=Shift_R+F12
toggle_logging=Shift_L+F2

# === Logging ===
output_folder=/tmp/mangohud_logs
log_duration=30
autostart_log=0

# === Advanced ===
vsync=0
gl_vsync=0
vulkan_driver

# === Wine/Proton ===
wine
winesync

# === Presets ===
# Use with: MANGOHUD_CONFIG=preset=X
# 0 = minimal (fps only)
# 1 = basic
# 2 = default
# 3 = full
# 4 = detailed
