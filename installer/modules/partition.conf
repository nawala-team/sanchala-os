#
# Sanchala OS Installer - Partition Module
# Documentation: /docs/storage/

# ═══════════════════════════════════════════════════════════════════
# EFI SYSTEM PARTITION
# ═══════════════════════════════════════════════════════════════════
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M
efiSystemPartitionName: "EFI"

# ═══════════════════════════════════════════════════════════════════
# SWAP CONFIGURATION
# ═══════════════════════════════════════════════════════════════════
userSwapChoices:
    - none       # No swap (not recommended)
    - small      # 2GB or √RAM, whichever smaller
    - suspend    # RAM size (for hibernation)
    - file       # Swapfile in @swap subvolume

# ═══════════════════════════════════════════════════════════════════
# INSTALLER UI OPTIONS
# ═══════════════════════════════════════════════════════════════════
drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: erase
initialSwapChoice: suspend
defaultPartitionTableType: gpt

# ═══════════════════════════════════════════════════════════════════
# FILESYSTEM CONFIGURATION
# ═══════════════════════════════════════════════════════════════════
defaultFileSystemType: "btrfs"
availableFileSystemTypes: ["btrfs", "ext4", "xfs"]

requiredPartitionTableType:
    - gpt

# ═══════════════════════════════════════════════════════════════════
# LUKS2 ENCRYPTION
# ═══════════════════════════════════════════════════════════════════
preCheckEncryptionAvailability: true
LUKSGenerationPreference: luks2
allowEncryptionAlgorithmChoice: true

luksOptions:
    cipher: "aes-xts-plain64"
    keySize: 512
    hash: "sha256"
    pbkdf: "argon2id"
    sectorSize: 4096

# ═══════════════════════════════════════════════════════════════════
# BTRFS SUBVOLUME LAYOUT
# See: /docs/storage/BTRFS-SUBVOLUME-LAYOUT.md
# ═══════════════════════════════════════════════════════════════════
btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /var/log
      subvolume: /@log
    - mountPoint: /var/cache
      subvolume: /@cache
    - mountPoint: /.snapshots
      subvolume: /@snapshots
    - mountPoint: /var/lib/flatpak
      subvolume: /@flatpak
    - mountPoint: /var/tmp
      subvolume: /@tmp

btrfsSwapSubvol: /@swap

# ═══════════════════════════════════════════════════════════════════
# MOUNT OPTIONS (optimized for SSD/NVMe)
# ═══════════════════════════════════════════════════════════════════
mountOptions:
    - filesystem: btrfs
      options: [compress=zstd:3, noatime, space_cache=v2, discard=async, ssd]
    - filesystem: btrfs_swap
      options: [nodatacow, noatime, discard=async, ssd]
    - filesystem: ext4
      options: [noatime, discard]
    - filesystem: xfs
      options: [noatime, discard]
    - filesystem: vfat
      options: [umask=0077, shortname=mixed]

# ═══════════════════════════════════════════════════════════════════
# POST-INSTALL HOOKS
# ═══════════════════════════════════════════════════════════════════
postInstallCommands:
    # Setup snapper for root
    - "snapper --no-dbus -c root create-config /"
    # Setup snapper for home
    - "snapper --no-dbus -c home create-config /home"
    # Enable snapper timers
    - "systemctl enable snapper-timeline.timer"
    - "systemctl enable snapper-cleanup.timer"
    - "systemctl enable snapper-boot.timer"
    # Enable GRUB snapshot boot entries
    - "systemctl enable grub-btrfsd"
    # Enable weekly scrub
    - "systemctl enable btrfs-scrub@-.timer"
