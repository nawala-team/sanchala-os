# SANCHALA OS - Input Systems Configuration
# ==========================================
# Install script for input layer packages

# Touchpad & Gesture Support
PACKAGES_INPUT=(
    # Core libinput
    "libinput"
    "xf86-input-libinput"
    "libinput-gestures"
    
    # Touchégg for advanced gestures
    "touchegg"
    
    # Wacom tablet support
    "xf86-input-wacom"
    "libwacom"
    "kcm-wacomtablet"
    
    # Digimend for Huion/XP-Pen/etc
    "digimend-kernel-drivers-dkms"
    
    # IME - Fcitx5
    "fcitx5"
    "fcitx5-gtk"
    "fcitx5-qt"
    "fcitx5-configtool"
    
    # CJK Input Methods
    "fcitx5-chinese-addons"   # Chinese Pinyin
    "fcitx5-mozc"             # Japanese
    "fcitx5-hangul"           # Korean
    "fcitx5-chewing"          # Chinese Traditional
    
    # CJK Fonts
    "noto-fonts-cjk"
    
    # On-screen keyboard
    "maliit-keyboard"
    "maliit-framework"
    
    # Utilities
    "xdotool"
    "evtest"
    "xinput"
)

# Optional - uncomment as needed
# "fcitx5-unikey"           # Vietnamese
# "fcitx5-anthy"            # Japanese alternative
# "fcitx5-kkc"              # Japanese Kana Kanji
# "fcitx5-m17n"             # Multi-language
