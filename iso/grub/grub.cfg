# SANCHALA OS - GRUB Configuration (UEFI Boot)

# Load modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod all_video
insmod font

# Graphics setup
if loadfont "${prefix}/fonts/unicode.pf2"; then
    insmod gfxterm
    set gfxmode="auto"
    terminal_input console
    terminal_output gfxterm
fi

# Theme
insmod png
set theme="${prefix}/themes/sanchala/theme.txt"
export theme

# Default settings
set timeout=10
set default="sanchala"

# Boot entries
menuentry "Sanchala OS (Live)" --class sanchala --class gnu-linux --class os --id 'sanchala' {
    set gfxpayload=keep
    linux /sanchala/boot/x86_64/vmlinuz-linux-hardened archisobasedir=sanchala archisolabel=SANCHALA_202608 cow_spacesize=2G quiet splash loglevel=3 systemd.show_status=auto rd.udev.log_level=3
    initrd /sanchala/boot/x86_64/initramfs-linux-hardened.img
}

menuentry "Sanchala OS (NVIDIA Graphics)" --class sanchala --class gnu-linux --class os --id 'sanchala-nvidia' {
    set gfxpayload=keep
    linux /sanchala/boot/x86_64/vmlinuz-linux-hardened archisobasedir=sanchala archisolabel=SANCHALA_202608 cow_spacesize=2G quiet splash nvidia-drm.modeset=1
    initrd /sanchala/boot/x86_64/initramfs-linux-hardened.img
}

menuentry "Sanchala OS (Safe Mode)" --class sanchala --class gnu-linux --class os --id 'sanchala-safe' {
    set gfxpayload=keep
    linux /sanchala/boot/x86_64/vmlinuz-linux-hardened archisobasedir=sanchala archisolabel=SANCHALA_202608 cow_spacesize=2G nomodeset
    initrd /sanchala/boot/x86_64/initramfs-linux-hardened.img
}

menuentry "Sanchala OS (Accessibility - Screen Reader)" --class sanchala --class accessibility --id 'sanchala-a11y' {
    set gfxpayload=keep
    linux /sanchala/boot/x86_64/vmlinuz-linux-hardened archisobasedir=sanchala archisolabel=SANCHALA_202608 cow_spacesize=2G quiet splash accessibility=on
    initrd /sanchala/boot/x86_64/initramfs-linux-hardened.img
}

menuentry "Run Memtest86+" --class memtest --id 'memtest' {
    linux /sanchala/boot/memtest86+/memtest.bin
}

menuentry "UEFI Firmware Settings" --class efi --id 'uefi-firmware' {
    fwsetup
}

menuentry "Reboot" --class restart --id 'reboot' {
    reboot
}

menuentry "Shutdown" --class shutdown --id 'shutdown' {
    halt
}
