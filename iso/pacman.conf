#
# SANCHALA OS - Pacman Configuration for ISO Build
# /etc/pacman.conf
#

[options]
HoldPkg     = pacman glibc
Architecture = x86_64
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# ============================================
# OFFICIAL REPOSITORIES
# ============================================

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# ============================================
# SANCHALA OS REPOSITORY (Custom packages)
# ============================================
# Uncomment when Sanchala repo is available
# [sanchala]
# SigLevel = Optional TrustAll
# Server = https://repo.sanchala.id/$arch

# ============================================
# AUR HELPER REPOSITORY (for chaotic-aur)
# ============================================
# Uncomment if using chaotic-aur
# [chaotic-aur]
# Include = /etc/pacman.d/chaotic-mirrorlist
