# ============================================
# SANCHALA OS - OBS Studio Profile
# ============================================
# Optimized recording profile
# ============================================

[General]
Name=SANCHALA Recording

[Video]
BaseCX=1920
BaseCY=1080
OutputCX=1920
OutputCY=1080
FPSType=0
FPSCommon=60
FPSInt=60
FPSNum=60
FPSDen=1
ScaleType=bicubic
ColorFormat=NV12
ColorSpace=709
ColorRange=Partial

[Audio]
SampleRate=48000
ChannelSetup=Stereo

[Output]
Mode=Simple
FilenameFormatting=%CCYY-%MM-%DD_%hh-%mm-%ss
RecFilePath[$e]=$HOME/Videos/Recordings
RecFormat=mkv

[AdvOut]
RecType=Standard
RecFormat2=mkv
RecTracks=1
RecEncoder=ffmpeg_vaapi
RecFilePath[$e]=$HOME/Videos/Recordings
FFOutputToFile=true
FFFormat=
FFFormatMimeType=

[SimpleOutput]
FilePath[$e]=$HOME/Videos/Recordings
RecFormat=mkv
VBitrate=6000
ABitrate=192
UseAdvanced=true
Preset=quality
RecQuality=IndistinguishableQuality
StreamEncoder=x264
RecEncoder=ffmpeg_vaapi

[Hotkeys]
OBSBasic.StartRecording=Super+Shift+R
OBSBasic.StopRecording=Super+Shift+R
OBSBasic.PauseRecording=Super+Shift+P
