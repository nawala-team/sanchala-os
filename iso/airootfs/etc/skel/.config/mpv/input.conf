# ============================================================
# SANCHALA OS - MPV Input Bindings
# ============================================================
# Intuitive keyboard shortcuts for video playback
# ============================================================

# Playback Control
SPACE cycle pause
p cycle pause
. frame-step
, frame-back-step
< playlist-prev
> playlist-next
ENTER playlist-next

# Seeking
RIGHT seek 5
LEFT seek -5
UP seek 30
DOWN seek -30
Shift+RIGHT seek 60
Shift+LEFT seek -60
Ctrl+RIGHT seek 120
Ctrl+LEFT seek -120
l ab-loop
L cycle-values loop-file "inf" "no"

# Volume
0 add volume 5
9 add volume -5
m cycle mute
WHEEL_UP add volume 2
WHEEL_DOWN add volume -2

# Playback Speed
[ multiply speed 0.9091
] multiply speed 1.1
{ multiply speed 0.5
} multiply speed 2.0
BS set speed 1.0

# Video
f cycle fullscreen
Ctrl+s screenshot
Ctrl+Shift+s screenshot video
a cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "-1"
d cycle deinterlace
1 add contrast -1
2 add contrast 1
3 add brightness -1
4 add brightness 1
5 add gamma -1
6 add gamma 1
7 add saturation -1
8 add saturation 1

# Subtitles
v cycle sub-visibility
j cycle sub
J cycle sub down
z add sub-delay -0.1
Z add sub-delay 0.1
x add sub-delay +0.1
r add sub-pos -1
R add sub-pos +1
u cycle-values sub-ass-override "force" "no"
Ctrl+j add sub-scale -0.1
Ctrl+Shift+j add sub-scale 0.1

# Audio
# cycle audio track
Ctrl+a cycle audio
+ add audio-delay 0.100
- add audio-delay -0.100

# Window
ESC set fullscreen no
q quit
Q quit-watch-later
Ctrl+q quit
w add panscan -0.1
W add panscan +0.1
e add panscan +0.1
Alt+0 set window-scale 0.5
Alt+1 set window-scale 1.0
Alt+2 set window-scale 2.0
Alt+ENTER cycle fullscreen

# Chapter Navigation
! add chapter -1
@ add chapter 1
Ctrl+LEFT add chapter -1
Ctrl+RIGHT add chapter 1

# Playlist
Ctrl+p show-text ${playlist}
P show-progress

# OSD
i script-binding stats/display-stats
I script-binding stats/display-stats-toggle
` script-binding console/enable
o show-progress
O no-osd cycle-values osd-level 3 1
TAB script-binding stats/display-stats-toggle

# Filters
Ctrl+1 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_VL.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode A (HQ)"
Ctrl+0 no-osd change-list glsl-shaders clr ""; show-text "Shaders cleared"

# Misc
? show-text "${filename}"
/ cycle-values af "lavfi=[loudnorm=I=-16:TP=-3:LRA=4]" ""
