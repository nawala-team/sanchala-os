# ============================================
# SANCHALA OS - MPV Hardware Acceleration
# ============================================
# Default MPV configuration for video playback
# ============================================

# Hardware decoding
hwdec=auto-safe
vo=gpu-next
gpu-api=vulkan

# Quality settings
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell

# Performance
gpu-shader-cache-dir=~/.cache/mpv-shaders
vulkan-async-compute=yes
vulkan-async-transfer=yes
vulkan-queue-count=1

# Audio
audio-channels=stereo
audio-normalize-downmix=yes

# Subtitles
sub-auto=fuzzy
sub-font="Noto Sans"
sub-font-size=42

# Screenshots
screenshot-format=png
screenshot-dir=~/Pictures/Screenshots
screenshot-template="%F-%P"

# OSD
osd-font="Inter"
osd-font-size=32
osd-duration=2000
