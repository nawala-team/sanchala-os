# ============================================================================
# SANCHALA OS - KDE Connect Notification Plugins
# ============================================================================
# Location: ~/.config/kdeconnect/plugins-notifications.conf
# Notification mirroring and phone call handling
# ============================================================================

[Plugin][notifications]
enabled=true
receiveNotifications=true
filterByApp=true
allowedApps=
blockedApps=com.android.systemui
showContent=true
showIcons=true
allowDismiss=true
allowReply=true
persistentNotifications=false
maxNotifications=50
deduplicate=true
ignoreOngoing=true
iconCachePath=~/.cache/kdeconnect/notification-icons

[Plugin][pausemusic]
enabled=true
pauseOnIncoming=true
pauseOnOutgoing=true
resumeAfterCall=true
pauseDelay=500
resumeDelay=1000
muteInsteadOfPause=false
affectedPlayers=

[Plugin][photo]
enabled=true
autoSave=true
saveDirectory=~/Pictures/Phone Camera
filenamePattern=%Y-%m-%d_%H-%M-%S
openAfterReceive=true
fullResolution=true
maxImageSize=0

[Plugin][ping]
enabled=true
pingMessage=Ping!
notificationSound=true
notificationTimeout=3000
showCustomMessage=true

[Plugin][sendnotifications]
enabled=true
filterByApp=true
includeApps=
excludeApps=plasmashell,kdeconnect
includeTransient=false
includePersistent=true
rateLimit=30
sendIcons=true
iconSize=64

[Plugin][telephony]
enabled=true
showIncomingCall=true
showCallerId=true
showContactPhoto=true
showCallActions=true
ringDesktop=true
ringSound=/usr/share/sounds/sanchala/phone-ring.ogg
ringDuration=30
notifyMissedCall=true
showCallDuration=true
logCalls=true
callLogPath=~/.local/share/kdeconnect/calls
autoAnswerIntegration=false
