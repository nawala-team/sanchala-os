# ============================================
# SANCHALA OS - Accessibility Settings
# ============================================
# Master accessibility configuration
# WCAG 2.1 AA Compliance Target
# ~/.config/sanchala/accessibility/accessibility.conf
# ============================================

[General]
# Enable accessibility features globally
Enabled=true

# Accessibility profile: default, low-vision, blind, motor, cognitive
Profile=default

# First-run accessibility setup completed
SetupComplete=false

# Show accessibility options in first-run wizard
ShowInWelcome=true

# Quick access shortcut for accessibility panel
QuickAccessShortcut=Super+U

# ============================================
# Screen Reader (Orca)
# ============================================
[ScreenReader]
Enabled=false
AutoStart=false
ToggleShortcut=Alt+Super+S
SpeechRate=50
SpeechPitch=5
SpeechVolume=10
KeyEcho=words
Verbosity=verbose
AnnounceNotifications=true
ReadTooltips=false
PreferredVoice=
Language=

# ============================================
# Visual Accommodations
# ============================================
[Visual]
# High contrast: off, high-contrast-light, high-contrast-dark, inverted
HighContrastMode=off
# Color filter: none, protanopia, deuteranopia, tritanopia, achromatopsia
ColorFilter=none
ColorFilterIntensity=100
ReduceTransparency=false
ReduceMotion=false
RemoveBackgroundImages=false

# ============================================
# Cursor and Pointer
# ============================================
[Cursor]
LargeCursor=false
# Cursor size: 24, 32, 48, 64, 96
CursorSize=24
CursorTheme=default
CustomCursorColor=#FF5722
CursorBlink=true
CursorBlinkRate=530
LocateCursor=false
CursorHalo=false
CursorHaloColor=#FFEB3B
CursorHaloSize=30

# ============================================
# Focus Indicators
# ============================================
[Focus]
EnhancedFocus=true
FocusWidth=2
FocusColor=#1A73E8
FocusStyle=solid
ShowFocusOnClick=true
AlwaysShowCaret=true

# ============================================
# Keyboard Accessibility
# ============================================
[Keyboard]
StickyKeys=false
StickyKeysLock=true
StickyKeysSound=true
StickyKeysIndicator=true
SlowKeys=false
SlowKeysDelay=300
BounceKeys=false
BounceKeysDelay=300
ToggleKeysSound=true
MouseKeys=false
MouseKeysSpeed=50
MouseKeysAcceleration=true
OnScreenKeyboard=false
OnScreenKeyboardApp=maliit

# ============================================
# Motor Accessibility
# ============================================
[Motor]
DwellClick=false
DwellTime=1200
DwellAction=single
DwellIndicator=true
SimulatedSecondaryClick=false
SecondaryClickDelay=1200
KeyboardOnlyMode=false
SpatialNavigation=false

# ============================================
# Audio Accessibility
# ============================================
[Audio]
VisualAlerts=false
VisualAlertType=window-flash
VisualAlertColor=#FF5722
MonoAudio=false
AudioBalance=0
PreferCaptions=false

# ============================================
# Reading Assistance
# ============================================
[Reading]
Magnifier=false
MagnificationLevel=2.0
MagnifierMode=full-screen
MagnifierFollows=both
MagnifierInvert=false
MagnifierCrosshair=false
ReadingGuide=false
ReadingGuideColor=#FFEB3B
ReadingGuideOpacity=30

# ============================================
# Cognitive Accessibility
# ============================================
[Cognitive]
SimplifiedUI=false
ReduceDistractions=false
AutoHideUI=false
TimeoutMultiplier=1.0
ExtendedNotificationTime=false
FocusMode=false

