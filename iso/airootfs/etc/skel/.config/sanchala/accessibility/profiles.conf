# ============================================
# SANCHALA OS - Accessibility Profiles
# ============================================
# Pre-configured accessibility profiles
# ~/.config/sanchala/accessibility/profiles.conf
# ============================================

[Default]
Name=Default
Description=Standard settings with basic accessibility support
ScreenReader=false
HighContrast=false
LargeText=false
LargeCursor=false
ReduceMotion=false
StickyKeys=false
Magnifier=false

[LowVision]
Name=Low Vision
Description=Enhanced visibility for users with low vision
ScreenReader=false
HighContrast=false
LargeText=true
FontScale=1.5
LargeCursor=true
CursorSize=64
CursorHalo=true
ReduceMotion=true
ReduceTransparency=true
Magnifier=true
MagnificationLevel=2.0
EnhancedFocus=true
FocusWidth=4
MinimumFontSize=16
BoldText=true

[Blind]
Name=Screen Reader User
Description=Optimized for screen reader users
ScreenReader=true
ScreenReaderAutoStart=true
HighContrast=false
LargeText=false
ReduceMotion=true
ReduceTransparency=true
AnnounceNotifications=true
Verbosity=verbose
KeyEcho=words
EnhancedFocus=true

[HighContrastLight]
Name=High Contrast Light
Description=Maximum contrast with light background
ScreenReader=false
HighContrast=true
HighContrastMode=high-contrast-light
ColorScheme=SanchalaHighContrastLight
LargeText=false
LargeCursor=true
CursorSize=48
CursorTheme=breeze_cursors_hc_light
ReduceTransparency=true
RemoveBackgroundImages=true
EnhancedFocus=true
FocusWidth=4

[HighContrastDark]
Name=High Contrast Dark
Description=Maximum contrast with dark background
ScreenReader=false
HighContrast=true
HighContrastMode=high-contrast-dark
ColorScheme=SanchalaHighContrastDark
LargeText=false
LargeCursor=true
CursorSize=48
CursorTheme=breeze_cursors_hc_dark
ReduceTransparency=true
RemoveBackgroundImages=true
EnhancedFocus=true
FocusWidth=4

[Motor]
Name=Motor Accessibility
Description=For users with motor impairments
ScreenReader=false
HighContrast=false
LargeText=false
LargeCursor=true
CursorSize=64
StickyKeys=true
StickyKeysLock=true
SlowKeys=true
SlowKeysDelay=300
BounceKeys=true
BounceKeysDelay=300
MouseKeys=true
DwellClick=false
KeyboardOnlyMode=true
EnhancedFocus=true
FocusWidth=4

[Cognitive]
Name=Cognitive Accessibility
Description=Simplified interface with reduced distractions
ScreenReader=false
HighContrast=false
LargeText=true
FontScale=1.25
ReduceMotion=true
ReduceTransparency=true
SimplifiedUI=true
ReduceDistractions=true
TimeoutMultiplier=2.0
ExtendedNotificationTime=true
EnhancedFocus=true

[ColorBlindProtanopia]
Name=Color Blind (Red-Green/Protanopia)
Description=Adjusted colors for protanopia
ColorFilter=protanopia
ColorFilterIntensity=100
EnhancedFocus=true

[ColorBlindDeuteranopia]
Name=Color Blind (Red-Green/Deuteranopia)
Description=Adjusted colors for deuteranopia
ColorFilter=deuteranopia
ColorFilterIntensity=100
EnhancedFocus=true

[ColorBlindTritanopia]
Name=Color Blind (Blue-Yellow/Tritanopia)
Description=Adjusted colors for tritanopia
ColorFilter=tritanopia
ColorFilterIntensity=100
EnhancedFocus=true
