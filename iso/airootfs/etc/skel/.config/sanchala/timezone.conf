# ============================================================================
# SANCHALA OS - Timezone Configuration
# ============================================================================
# Location: ~/.config/sanchala/timezone.conf
# Automatic timezone detection and management
# ============================================================================

[General]
# Enable automatic timezone detection
AutoDetect=true

# Detection method priority (comma-separated)
# geolocation: Use IP-based geolocation services
# gps: Use GPS/GNSS location (if available)
# network: Use network-based location
# manual: User-configured timezone
DetectionOrder=gps,network,geolocation,manual

# Manual timezone (used when AutoDetect=false or as fallback)
# Format: IANA timezone database name
ManualTimezone=

# Confirm timezone changes before applying
ConfirmChanges=true

# Notification on timezone change
NotifyOnChange=true

[GeoLocation]
# Enable IP-based geolocation for timezone
Enabled=true

# Geolocation service providers (in priority order)
# Privacy-respecting services preferred
Providers=mozilla,ip-api,ipinfo

# Mozilla Location Service (privacy-focused)
MozillaLocationService=https://location.services.mozilla.com/v1/geolocate

# Cache geolocation results (hours)
CacheDuration=24

# Minimum accuracy required (kilometers)
MinAccuracyKm=100

# Use geolocation only on WiFi (save mobile data)
WifiOnly=false

[GPS]
# Use GPS/GNSS for timezone detection
Enabled=true

# GPS timeout (seconds)
Timeout=30

# Minimum accuracy required (meters)
MinAccuracyMeters=1000

# Power mode: low, balanced, high
PowerMode=low

# Update interval when traveling (minutes)
TravelUpdateInterval=30

[Network]
# Use network-based location (cell towers, WiFi)
Enabled=true

# Network location timeout (seconds)
Timeout=15

[Travel]
# Automatic timezone handling while traveling
AutoTravelMode=true

# Detect travel based on timezone change
DetectTravel=true

# Show both home and local time while traveling
ShowDualTime=true

# Home timezone (set automatically from primary location)
HomeTimezone=

# Travel notification
NotifyOnTravel=true

# Revert to home timezone after returning
AutoRevert=true
RevertDelay=24

[Privacy]
# Privacy settings for location services

# Anonymize location requests
AnonymizeRequests=true

# Don't store location history
NoLocationHistory=true

# Use approximate location only for timezone
ApproximateOnly=true

# Offline timezone database (no network needed)
UseOfflineDatabase=true
OfflineDatabasePath=/usr/share/sanchala/timezone/tzdb.dat

[DST]
# Daylight Saving Time handling

# Notify before DST transitions
NotifyDSTChange=true

# Hours before DST to notify
NotifyHoursBefore=24

# Remind about DST in calendar
AddDSTToCalendar=true

# Adjust alarms for DST automatically
AutoAdjustAlarms=true

# Show DST indicator in clock
ShowDSTIndicator=true

[Advanced]
# Use high-precision time sources
HighPrecision=false

# Leap second handling
LeapSecondMode=smear

# Hardware clock sync (RTC)
SyncHardwareClock=true
HardwareClockUTC=true

# Time format preferences
Use24HourFormat=auto
ShowSeconds=false
ShowMilliseconds=false

# Week start day (0=Sunday, 1=Monday)
WeekStartDay=1

# Calendar system (gregorian, persian, hebrew, islamic, etc.)
CalendarSystem=gregorian

# Locale-specific date format
UseLocleDateFormat=true
