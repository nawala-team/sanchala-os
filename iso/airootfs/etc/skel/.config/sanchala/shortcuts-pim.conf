# ============================================================================
# SANCHALA OS - PIM Keyboard Shortcuts
# ============================================================================
# Global shortcuts for PIM applications
# ============================================================================

[korganizer]
# Open KOrganizer
_k_friendly_name=KOrganizer
ShowCalendar=Meta+C,Meta+C,Open Calendar

[kontact]
# Open Kontact (unified PIM)
_k_friendly_name=Kontact
ShowKontact=Meta+Shift+K,Meta+Shift+K,Open Kontact

[kaddressbook]
# Open KAddressBook
_k_friendly_name=KAddressBook
ShowContacts=Meta+Shift+A,Meta+Shift+A,Open Contacts

[kmail]
# Open KMail
_k_friendly_name=KMail
ShowMail=Meta+M,Meta+M,Open Mail

[sanchala-pim]
# Sanchala PIM shortcuts
_k_friendly_name=Sanchala PIM
QuickAddEvent=Meta+Shift+C,Meta+Shift+C,Quick Add Event
TodayView=Meta+Alt+T,Meta+Alt+T,Today View
NewContact=Meta+Shift+N,Meta+Shift+N,New Contact
ComposeEmail=Meta+Shift+M,Meta+Shift+M,Compose Email
