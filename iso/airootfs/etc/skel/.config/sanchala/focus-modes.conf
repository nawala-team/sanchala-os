# ============================================================================
# SANCHALA OS - Focus Modes Configuration
# ============================================================================
# Location: ~/.config/sanchala/focus-modes.conf
# macOS Monterey-style Focus modes with advanced automation
# ============================================================================

[General]
Enabled=true
ActiveMode=
AllowMultiple=false
SyncAcrossDevices=true
ShowInStatusBar=true
ToggleShortcut=Meta+Shift+F
QuickToggleShortcut=Meta+F

# ============================================================================
# WORK FOCUS
# ============================================================================
[Work]
Enabled=true
DisplayName=Work
Description=Minimize distractions during work hours
Icon=briefcase-symbolic
Color=#3949AB

[Work][Notifications]
AllowedApps=org.kde.kalendar,org.kde.kmail2,thunderbird,slack,microsoft-teams,zoom
SilencedApps=discord,telegram-desktop,signal-desktop,whatsapp,steam,spotify
AllowTimeSensitive=true
AllowCalls=true
AllowRepeatCallers=true

[Work][Automation]
Enabled=true
WiFiNetworks=office-5g,office-2.4g
TriggerApps=libreoffice-writer,code,jetbrains-idea
ScheduleEnabled=true
ScheduleStart=09:00
ScheduleEnd=17:00
ScheduleDays=Mon,Tue,Wed,Thu,Fri

[Work][Status]
ShareWithContacts=true
StatusMessage=At work. Notifications limited.
AutoReplyEnabled=false

# ============================================================================
# PERSONAL FOCUS
# ============================================================================
[Personal]
Enabled=true
DisplayName=Personal
Description=Connect with friends and family
Icon=user-symbolic
Color=#00C853

[Personal][Notifications]
AllowedApps=telegram-desktop,signal-desktop,whatsapp,discord
SilencedApps=slack,microsoft-teams,org.kde.kmail2,thunderbird
AllowTimeSensitive=true
AllowCalls=true
AllowRepeatCallers=true

[Personal][Automation]
Enabled=true
WiFiNetworks=home-wifi,home-5g
TriggerApps=
ScheduleEnabled=false

[Personal][Status]
ShareWithContacts=false
AutoReplyEnabled=false

# ============================================================================
# SLEEP FOCUS
# ============================================================================
[Sleep]
Enabled=true
DisplayName=Sleep
Description=Wind down and rest peacefully
Icon=moon-symbolic
Color=#7C4DFF

[Sleep][Notifications]
AllowedApps=
SilencedApps=all
AllowTimeSensitive=false
AllowCalls=false
AllowEmergencyContacts=true
AllowAlarms=true

[Sleep][Automation]
Enabled=true
ScheduleEnabled=true
ScheduleStart=22:00
ScheduleEnd=07:00
ScheduleDays=Mon,Tue,Wed,Thu,Fri,Sat,Sun
SyncWithBedtime=true

[Sleep][Display]
DimLockScreen=true
DimLevel=30
UseDarkWallpaper=true
EnableNightLight=true
NightLightStrength=50

[Sleep][Status]
ShareWithContacts=true
StatusMessage=Sleeping. Notifications silenced until morning.
AutoReplyEnabled=true
AutoReplyMessage=I'm sleeping. I'll get back to you in the morning.

# ============================================================================
# GAMING FOCUS
# ============================================================================
[Gaming]
Enabled=true
DisplayName=Gaming
Description=Immersive gaming without interruptions
Icon=input-gaming-symbolic
Color=#FF5722

[Gaming][Notifications]
AllowedApps=discord,steam
SilencedApps=all
AllowTimeSensitive=false
AllowCalls=true
AllowRepeatCallers=true

[Gaming][Automation]
Enabled=true
TriggerApps=steam,lutris,heroic,bottles,gamescope
RequireFullScreen=true

[Gaming][Performance]
EnableGameMode=true
DisableCompositorEffects=false
GameProcessPriority=high

[Gaming][Status]
ShareWithContacts=false
StatusMessage=Gaming. Will respond later.
AutoReplyEnabled=false

# ============================================================================
# MEETING FOCUS
# ============================================================================
[Meeting]
Enabled=true
DisplayName=Meeting
Description=Stay focused during video calls
Icon=camera-video-symbolic
Color=#2196F3

[Meeting][Notifications]
AllowedApps=zoom,microsoft-teams,google-meet,slack,webex
SilencedApps=all
AllowTimeSensitive=true
AllowCalls=false

[Meeting][Automation]
Enabled=true
TriggerApps=zoom,microsoft-teams,google-meet,webex
SyncWithCalendar=true
MeetingLeadTime=5
AutoDisableOnCallEnd=true

[Meeting][Privacy]
HideNotificationContent=true
MuteSystemSounds=true

[Meeting][Status]
ShareWithContacts=true
StatusMessage=In a meeting
AutoReplyEnabled=true
AutoReplyMessage=I'm in a meeting. I'll respond when it's over.

# ============================================================================
# DRIVING FOCUS
# ============================================================================
[Driving]
Enabled=true
DisplayName=Driving
Description=Safe driving without distractions
Icon=car-symbolic
Color=#FF9800

[Driving][Notifications]
AllowedApps=
SilencedApps=all
AllowTimeSensitive=false
AllowCalls=true
AllowRepeatCallers=true
ReadAloud=true

[Driving][Automation]
Enabled=true
BluetoothDevices=car-audio,car-handsfree
MotionDetection=false

[Driving][Safety]
SuppressVisualNotifications=true
AudioOnly=true
SimplifiedInterface=true

[Driving][Status]
ShareWithContacts=true
StatusMessage=Driving. Hands-free only.
AutoReplyEnabled=true
AutoReplyMessage=I'm driving. I'll reply when I arrive safely.

# ============================================================================
# READING FOCUS
# ============================================================================
[Reading]
Enabled=true
DisplayName=Reading
Description=Quiet time for reading and learning
Icon=book-symbolic
Color=#795548

[Reading][Notifications]
AllowedApps=
SilencedApps=all
AllowTimeSensitive=false
AllowCalls=false
AllowRepeatCallers=true

[Reading][Automation]
Enabled=true
TriggerApps=foliate,calibre,okular,evince

[Reading][Display]
EnableReadingMode=true
WarmthLevel=30
ReduceBlueLight=true

[Reading][Status]
ShareWithContacts=false
StatusMessage=Reading
AutoReplyEnabled=false

# ============================================================================
# EMERGENCY CONTACTS
# ============================================================================
[EmergencyContacts]
Enabled=true
ContactIDs=
# Format: name:phone (e.g., Mom:+1234567890)

# ============================================================================
# LINKED DEVICES
# ============================================================================
[LinkedDevices]
SyncEnabled=true
DeviceIDs=
SyncToAll=true
ReceiveFromOthers=true
