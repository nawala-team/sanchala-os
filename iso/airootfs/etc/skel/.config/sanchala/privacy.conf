# ============================================
# SANCHALA OS - Privacy Settings
# ============================================
# Privacy-first defaults
# All telemetry OFF by default
# ============================================

[Location]
Enabled=false
AllowedApps=

[Camera]
Enabled=true
ShowIndicator=true
AllowedApps=

[Microphone]
Enabled=true
ShowIndicator=true
AllowedApps=

[ScreenRecording]
ShowIndicator=true
AllowedApps=

[FileAccess]
DownloadsFolder=allowed
DocumentsFolder=ask
FullDiskAccess=deny
RemovableMedia=ask

[Analytics]
UsageData=false
CrashReports=false
FeatureSuggestions=false

[RecentActivity]
TrackRecentFiles=true
TrackRecentApps=true
MaxRecentFiles=20
MaxAgeDays=7

[Clipboard]
SaveHistory=true
MaxHistorySize=100
ClearOnLogout=false
AutoClearSensitive=true
SensitiveTimeout=30
SyncEnabled=true
SyncSensitiveData=false
