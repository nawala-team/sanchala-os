# ============================================================================
# SANCHALA OS - Calendar Widget Integration
# ============================================================================
# Plasma calendar widget and system integration
# ============================================================================

[General]
# Enable calendar widget integration
Enabled=true

# Show events in Plasma calendar popup
ShowEventsInCalendar=true

# Maximum events to show in popup
MaxEventsInPopup=10

# Days ahead to show in popup
DaysAhead=7

[Widget]
# Show week numbers in calendar widget
ShowWeekNumbers=true

# First day of week (follows KOrganizer setting)
UseKOrganizerFirstDay=true

# Highlight today
HighlightToday=true

# Show lunar calendar (for supported locales)
ShowLunarCalendar=false

# Show holidays
ShowHolidays=true

# Holiday region (ISO 3166-1 alpha-2)
HolidayRegion=

[EventDisplay]
# Event display format in widget
ShowEventTime=true
ShowEventLocation=false
ShowEventCalendarColor=true

# Truncate long event names
TruncateEventNames=true
MaxEventNameLength=40

# Show all-day events first
AllDayEventsFirst=true

[QuickAdd]
# Enable quick event creation from widget
QuickAddEnabled=true

# Natural language parsing
NaturalLanguageParsing=true

# Default calendar for quick-add events
QuickAddDefaultCalendar=

# Examples of natural language:
# "Meeting tomorrow at 2pm"
# "Lunch with John next Monday"
# "Team standup every weekday at 9am"

[Notifications]
# Show upcoming event notifications
UpcomingEventNotification=true

# Minutes before event to notify
NotificationLeadTime=15

# Show notification for all-day events
NotifyAllDayEvents=true

# All-day notification time
AllDayNotificationTime=08:00

[Birthday]
# Show birthdays from contacts
ShowBirthdays=true

# Birthday notification days ahead
BirthdayNotificationDays=3

# Birthday notification time
BirthdayNotificationTime=09:00

[Tasks]
# Show tasks in calendar widget
ShowTasks=true

# Only show tasks due today
TasksTodayOnly=false

# Show overdue tasks
ShowOverdueTasks=true

# Task priority threshold (1-9, show all above)
TaskPriorityThreshold=5

[SystemTray]
# Show calendar indicator in system tray
ShowInSystemTray=false

# Blink for upcoming events
BlinkForUpcoming=false

[Shortcuts]
# Open full calendar from widget
OpenCalendarShortcut=Meta+C

# Quick add event
QuickAddShortcut=Meta+Shift+C

# Today view
TodayShortcut=Meta+Alt+T
