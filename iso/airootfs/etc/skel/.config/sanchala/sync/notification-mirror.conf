# ============================================================================
# SANCHALA OS - Notification Mirroring Configuration
# ============================================================================
# Location: ~/.config/sanchala/sync/notification-mirror.conf
# Phone notification mirroring for seamless multi-device experience
# ============================================================================

[General]
# Enable notification mirroring
Enabled=true

# Mirror direction: from_phone, to_phone, bidirectional
Direction=bidirectional

# Backend provider
Provider=kdeconnect

# Data storage
DataDir=~/.local/share/sanchala/sync/notifications

# Icon cache
IconCache=~/.cache/sanchala/sync/notification-icons

[FromPhone]
# Mirror notifications from phone to desktop
Enabled=true

# Show popup notifications
ShowPopup=true

# Store in notification history
StoreInHistory=true

# Allow dismissing from desktop
AllowDismiss=true

# Allow inline reply
AllowReply=true

# Show notification content
ShowContent=true

# Show app icons
ShowIcons=true

# Notification grouping
GroupByApp=true

# Maximum notifications per app in group
MaxPerGroup=5

# Deduplication
Deduplicate=true

# Notification timeout (ms, 0 = use system default)
Timeout=0

[FromPhone][Filtering]
# Enable app filtering
Enabled=true

# Filter mode: allowlist, blocklist
Mode=blocklist

# Blocked apps (Android package names)
BlockedApps=com.android.systemui,com.android.vending,com.google.android.gms

# Allowed apps (when mode=allowlist)
AllowedApps=

# Block ongoing notifications
BlockOngoing=true

# Block group summary notifications
BlockGroupSummary=true

# Priority filter: all, high, urgent
MinPriority=all

[FromPhone][Categories]
# Per-category settings

[FromPhone][Categories][messaging]
Enabled=true
ShowContent=true
AllowReply=true
Sound=true
Priority=high

[FromPhone][Categories][email]
Enabled=true
ShowContent=true
AllowReply=true
Sound=true
Priority=normal

[FromPhone][Categories][social]
Enabled=true
ShowContent=true
AllowReply=false
Sound=true
Priority=normal

[FromPhone][Categories][news]
Enabled=false
ShowContent=false
AllowReply=false
Sound=false
Priority=low

[FromPhone][Categories][promo]
Enabled=false
ShowContent=false
AllowReply=false
Sound=false
Priority=low

[ToPhone]
# Send desktop notifications to phone
Enabled=false

# Filter mode: allowlist, blocklist
Mode=blocklist

# Blocked apps
BlockedApps=plasmashell,kdeconnect,org.kde.discover

# Include transient notifications
IncludeTransient=false

# Rate limit (notifications per minute)
RateLimit=20

# Send icons
SendIcons=true

[Privacy]
# Hide content on lock screen
HideOnLockScreen=true

# Hide content during screen share
HideDuringScreenShare=true

# Sensitive app list (always hide content)
SensitiveApps=banking,authenticator,password

# Respect phone DND mode
RespectPhoneDND=true

# Sync DND state
SyncDNDState=true

[Actions]
# Quick actions for mirrored notifications

# Reply action enabled
ReplyEnabled=true

# Mark as read action
MarkReadEnabled=true

# Dismiss action
DismissEnabled=true

# Mute app action
MuteAppEnabled=true

# Open on phone action
OpenOnPhoneEnabled=true

[Sounds]
# Play sound for mirrored notifications
Enabled=true

# Use phone's notification sound
UsePhoneSound=false

# Default sound
DefaultSound=/usr/share/sounds/sanchala/notification-mirror.ogg

# Per-category sounds
MessagingSound=/usr/share/sounds/sanchala/message.ogg
CallSound=/usr/share/sounds/sanchala/phone-ring.ogg
