# ============================================================================
# SANCHALA OS - SMS & Calls Configuration
# ============================================================================
# Location: ~/.config/sanchala/sync/sms-calls.conf
# Phone call and SMS handling from desktop
# ============================================================================

[General]
# Enable SMS/Calls integration
Enabled=true

# Backend provider
Provider=kdeconnect

# Data storage
DataDir=~/.local/share/sanchala/sync/telephony

# Database file
DatabaseFile=~/.local/share/sanchala/sync/telephony/messages.db

[SMS]
# SMS messaging from desktop
Enabled=true

# Sync conversations from phone
SyncConversations=true

# Sync interval (minutes)
SyncInterval=15

# Maximum conversations to sync
MaxConversations=100

# Messages per conversation to sync
MessagesPerConversation=100

# Store messages locally
StoreLocally=true

# Full-text search enabled
FullTextSearch=true

# MMS support
MMSEnabled=true

# Download MMS attachments
DownloadAttachments=true

# Attachment storage
AttachmentDir=~/.local/share/sanchala/sync/telephony/attachments

# Send SMS from desktop
SendEnabled=true

# Default SMS app
DefaultApp=sanchala-messages

# Quick reply from notifications
QuickReply=true

# Suggested replies
SuggestedReplies=true

# Contact integration
ContactLookup=true

# Show contact photos
ShowContactPhotos=true

[SMS][Notifications]
# Notification settings for SMS
Enabled=true

# Show message preview
ShowPreview=true

# Show sender photo
ShowPhoto=true

# Group by conversation
GroupByConversation=true

# Sound enabled
Sound=true

# Sound file
SoundFile=/usr/share/sounds/sanchala/message.ogg

# Vibration pattern (if supported)
Vibration=short

# LED color (if supported)
LEDColor=#00FF00

[Calls]
# Phone call handling
Enabled=true

# Show incoming call notification
ShowIncoming=true

# Show outgoing call notification
ShowOutgoing=true

# Show missed call notification
ShowMissed=true

# Caller ID lookup
CallerIDLookup=true

# Show contact photo
ShowContactPhoto=true

# Ring desktop on incoming call
RingDesktop=true

# Ring sound
RingSound=/usr/share/sounds/sanchala/phone-ring.ogg

# Ring duration (seconds)
RingDuration=30

# Call actions in notification
ShowActions=true

# Available actions: answer, reject, message
Actions=answer,reject,message

# Quick reject messages
RejectMessages=I'll call you back,In a meeting,Can't talk right now,What's up?

# Mute desktop audio on call
MuteOnCall=true

# Pause media on call
PauseMediaOnCall=true

# Resume media after call
ResumeMediaAfterCall=true

# Log calls
LogCalls=true

# Call log retention (days)
CallLogRetention=90

[Calls][Notifications]
# Incoming call notification style
IncomingStyle=fullscreen

# Notification timeout (0 = until answered/rejected)
Timeout=0

# Critical notification (bypass DND)
Critical=true

# Show call duration
ShowDuration=true

# End call notification
ShowEndNotification=true

[Voicemail]
# Voicemail integration (if supported)
Enabled=true

# Download voicemails
DownloadEnabled=true

# Storage directory
StorageDir=~/.local/share/sanchala/sync/telephony/voicemail

# Transcription (if available)
Transcription=true

# Notification for new voicemail
NotifyNew=true

[Privacy]
# Hide caller ID on lock screen
HideCallerOnLock=true

# Hide message content on lock screen
HideMessageOnLock=true

# Secure message storage
EncryptStorage=true

# Auto-delete old messages (days, 0 = never)
AutoDeleteDays=0

# Exclude from backup
ExcludeFromBackup=false
