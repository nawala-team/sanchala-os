# ============================================================================
# SANCHALA OS - Critical Alerts Configuration
# ============================================================================
# Location: ~/.config/sanchala/critical-alerts.conf
# Emergency and critical notification handling
# ============================================================================

[General]
Enabled=true
BypassAllFilters=true
BypassDND=true
BypassFocusModes=true
RequireAcknowledgment=true

[Display]
AlwaysOnTop=true
PersistUntilDismissed=true
FullScreenInterrupt=true
WakeScreen=true
ScreenBrightness=100
ShowOnAllMonitors=false

[Appearance]
UseAlertStyle=true
BackgroundColor=#FF1744
TextColor=#FFFFFF
IconSize=64
BorderWidth=3
BorderColor=#FF5252
PulsatingBorder=true
PulseInterval=1000

[Sound]
Enabled=true
BypassMute=true
Volume=100
AlertSound=/usr/share/sounds/sanchala/notifications/critical.ogg
RepeatEnabled=false
RepeatInterval=30000
RepeatCount=3

[Haptics]
Enabled=true
Pattern=urgent
Duration=500

# ============================================================================
# CRITICAL CATEGORIES
# ============================================================================

[Category][security]
Enabled=true
DisplayName=Security Alert
Icon=security-high-symbolic
Description=Security threats and breaches
Sources=sanchala-guardian,firewall,antivirus,auth

[Category][battery]
Enabled=true
DisplayName=Battery Critical
Icon=battery-empty-symbolic
Description=Battery level critical
Threshold=5
Sources=org.kde.powerdevil,upower

[Category][disk]
Enabled=true
DisplayName=Disk Space Critical
Icon=drive-harddisk-symbolic
Description=Storage space critically low
Threshold=95
Sources=org.kde.plasma-systemmonitor,baloo

[Category][memory]
Enabled=true
DisplayName=Memory Critical
Icon=memory-symbolic
Description=System memory critically low
Threshold=95
Sources=org.kde.plasma-systemmonitor

[Category][temperature]
Enabled=true
DisplayName=Overheating
Icon=temperature-symbolic
Description=Hardware temperature critical
Threshold=90
Sources=org.kde.plasma-systemmonitor,sensors

[Category][network-security]
Enabled=true
DisplayName=Network Security
Icon=network-error-symbolic
Description=Network security threats
Sources=firewall,networkmanager

[Category][system-failure]
Enabled=true
DisplayName=System Failure
Icon=dialog-error-symbolic
Description=Critical system errors
Sources=systemd,journald,kernel

[Category][data-loss]
Enabled=true
DisplayName=Data Loss Warning
Icon=data-warning-symbolic
Description=Potential data loss detected
Sources=btrfs,smartctl,backup

# ============================================================================
# EMERGENCY CONTACTS
# ============================================================================

[Emergency]
ShowEmergencyButton=true
EmergencyNumber=911
LocalEmergencyNumbers=

# ============================================================================
# ACKNOWLEDGMENT
# ============================================================================

[Acknowledgment]
RequireAction=true
TimeoutAction=snooze
TimeoutDuration=60000
SnoozeOptions=5,15,30,60
DefaultSnooze=15
MaxSnoozeCount=3
