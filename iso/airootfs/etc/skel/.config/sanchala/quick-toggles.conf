# Sanchala Quick Toggles Configuration
# Customize which toggles appear in Control Center

[General]
# Number of columns in toggle grid
GridColumns=3

# Show text labels below icons
ShowLabels=true

# Show status subtitles (e.g., connected WiFi name)
ShowSubtitles=true

# Animation duration for toggle state changes
AnimationDuration=200

[EnabledToggles]
# Core toggles (recommended to keep enabled)
wifi=true
bluetooth=true
dnd=true
darkmode=true
screencast=true
focus=true

# Additional toggles (disabled by default)
nightlight=false
airplane=false
hotspot=false
vpn=false
rotation=false
battery=false
location=false
caffeine=false

[ToggleOrder]
# Order of toggles in the grid (left-to-right, top-to-bottom)
Order=wifi,bluetooth,dnd,darkmode,screencast,focus,nightlight,airplane,hotspot,vpn

[WiFi]
# Show signal strength in subtitle
ShowSignalStrength=true

# Remember last connected network
RememberNetwork=true

[Bluetooth]
# Show connected device name
ShowDeviceName=true

# Quick connect to last device
QuickConnect=true

[DND]
# Default duration when enabled (minutes, 0 = until manually disabled)
DefaultDuration=0

# Allow calls from favorites
AllowFavorites=true

# Allow repeated calls (same number within 3 minutes)
AllowRepeated=true

[DarkMode]
# Auto switch based on time
AutoSwitch=false

# Auto switch times (24h format)
LightModeStart=07:00
DarkModeStart=19:00

[Focus]
# Available focus modes
AvailableModes=Off,Work,Personal,Sleep,Custom

# Show timer when focus mode is active
ShowTimer=true

[CustomToggles]
# Define custom toggles here
# Format: name=icon,label,command_on,command_off

# Example:
# mycustom=custom-icon,My Toggle,command-to-enable,command-to-disable
