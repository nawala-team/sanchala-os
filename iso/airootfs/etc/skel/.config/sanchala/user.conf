# ============================================
# SANCHALA OS - User Profile (skel template)
# ============================================
# Default user preferences for new accounts
# ~/.config/sanchala/user.conf
# ============================================

[User]
# Profile template used (standard, administrator, child, work)
Template=standard

# Account creation timestamp
CreatedAt=

# First login completed
SetupComplete=false

[Appearance]
# Theme: SanchalaLight, SanchalaDark, SanchalaAuto
Theme=SanchalaAuto

# Auto-switch dark mode at sunset
AutoDarkMode=true

# Accent color (hex or name)
AccentColor=#3949AB

# Icon theme
IconTheme=SanchalaPapirus

# Cursor theme
CursorTheme=breeze_cursors

# Font scaling (1.0 = 100%)
FontScale=1.0

[Desktop]
# Show icons on desktop
ShowDesktopIcons=false

# Panel position: bottom, top, left, right
PanelPosition=bottom

# Enable dock magnification
DockMagnification=true

# Number of virtual desktops
VirtualDesktops=2

# Hot corners enabled
HotCorners=true

[Privacy]
# Allow telemetry (always false by default)
Telemetry=false

# Track recent files
RecentFiles=true

# Location services: enabled, disabled, ask
Location=ask

# Clipboard history
ClipboardHistory=true

# Clear clipboard on lock
ClearClipboardOnLock=false

[Notifications]
# Do Not Disturb schedule
DndEnabled=false
DndStart=22:00
DndEnd=08:00

# Show notification content on lock screen
ShowOnLockScreen=false

# Notification sounds
SoundsEnabled=true

[Power]
# Laptop lid close action: suspend, hibernate, nothing, lock
LidCloseAction=suspend

# Power button action: poweroff, suspend, ask
PowerButtonAction=ask

# Auto-suspend timeout (minutes, 0 = never)
AutoSuspend=30

# Screen blank timeout (minutes)
ScreenBlank=10
