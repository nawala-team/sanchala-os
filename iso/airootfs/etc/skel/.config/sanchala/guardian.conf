# ============================================
# SANCHALA OS - Guardian Security Settings
# ============================================
# Sanchala Guardian configuration
# ============================================

[Guardian]
ProtectionLevel=high
AutoScan=weekly
RealTimeProtection=true
NotifyOnThreat=true

[Firewall]
Enabled=true
DefaultIncoming=deny
DefaultOutgoing=allow
LogBlocked=true
LogLevel=low

[AppArmor]
Enforcing=true
NotifyOnDeny=true
AuditMode=false

[Updates]
AutoSecurityUpdates=true
NotifyOnAvailable=true
CheckInterval=3600

[Network]
DNSOverHTTPS=true
MACRandomization=true
VPNKillSwitch=false
