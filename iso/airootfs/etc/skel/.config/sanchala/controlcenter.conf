# Sanchala Control Center Configuration
# Default settings for new users

[General]
# Show Now Playing media widget
ShowMediaWidget=true

# Show brightness slider (disable on desktops without backlight)
ShowBrightnessSlider=true

# Number of toggle columns (2-4)
GridColumns=3

# Animation duration in milliseconds
AnimationDuration=200

# Panel width in pixels
PanelWidth=340

[Toggles]
# Enabled toggles (comma-separated)
Enabled=wifi,bluetooth,dnd,darkmode,screencast,focus

# Toggle order (comma-separated)
Order=wifi,bluetooth,dnd,darkmode,screencast,focus

# Additional available toggles:
# nightlight, airplane, hotspot, vpn, rotation, battery, location, caffeine

[Volume]
# Show per-app volume controls
ShowPerAppVolume=true

# Maximum volume (100 = normal, 150 = with boost)
MaxVolume=150

# Default output device (auto = system default)
DefaultOutput=auto

[Brightness]
# Enable auto-brightness (requires ambient light sensor)
AutoBrightness=false

# Minimum brightness level (prevents completely dark screen)
MinBrightness=5

[NightLight]
# Enable Night Light feature
Enabled=true

# Schedule mode: manual, sunset, custom
ScheduleMode=sunset

# Custom schedule times (24h format)
CustomStart=22:00
CustomEnd=06:00

# Default color temperature in Kelvin
DefaultTemperature=4500

[Focus]
# Available focus modes
Modes=Off,Work,Personal,Sleep

# Default focus mode
DefaultMode=Off

# Work mode settings
WorkMode.DND=true
WorkMode.BlockNotifications=true
WorkMode.AllowCalls=false

# Sleep mode settings  
SleepMode.DND=true
SleepMode.DimScreen=true
SleepMode.NightLight=true
