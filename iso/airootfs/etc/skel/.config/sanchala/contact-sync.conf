# ============================================================================
# SANCHALA OS - Contact Sync Specification
# ============================================================================
# Cross-device contact synchronization
# ============================================================================

[General]
# Enable contact sync
Enabled=true

# Primary contact source
PrimarySource=local

# Merge contacts from multiple sources
MergeFromMultipleSources=true

[Sources]
# Local address book
LocalEnabled=true

# CardDAV (configured in pim-sync.conf)
CardDAVEnabled=true

# KDE Connect (phone contacts)
KDEConnectEnabled=true

# LDAP (enterprise)
LDAPEnabled=false

# Import sources
VCardImportEnabled=true
CSVImportEnabled=true

[Sync]
# Sync frequency (minutes)
SyncInterval=15

# Bidirectional sync
BidirectionalSync=true

# Sync direction preference on conflict: local, remote, ask
ConflictPreference=ask

# Sync deleted contacts
SyncDeletes=true

# Soft delete (move to trash first)
SoftDelete=true

# Trash retention (days)
TrashRetention=30

[Fields]
# Fields to sync (all by default)
SyncName=true
SyncNickname=true
SyncPhoto=true
SyncBirthday=true
SyncAnniversary=true
SyncEmail=true
SyncPhone=true
SyncAddress=true
SyncOrganization=true
SyncTitle=true
SyncWebsite=true
SyncNotes=true
SyncCategories=true
SyncCustomFields=true

# Sensitive fields (require unlock to view/sync)
ProtectNotes=false
ProtectCustomFields=false

[Photos]
# Sync contact photos
SyncPhotos=true

# Photo sync direction: both, toServer, fromServer
PhotoSyncDirection=both

# Resize photos for sync
ResizePhotos=true

# Maximum photo dimension (pixels)
MaxPhotoDimension=512

# Photo quality (JPEG, 1-100)
PhotoQuality=85

[Merge]
# Auto-detect duplicate contacts
AutoDetectDuplicates=true

# Duplicate detection fields
DuplicateCheckFields=email,phone,name

# Confidence threshold for auto-merge (0-100)
AutoMergeThreshold=95

# Manual review threshold (0-100)
ManualReviewThreshold=70

# Merge strategy: keepBoth, mergeFields, askUser
MergeStrategy=askUser

[Groups]
# Sync contact groups/categories
SyncGroups=true

# Map groups to CardDAV categories
MapGroupsToCategories=true

# Sync group membership changes
SyncGroupMembership=true

[KDEConnect]
# Sync phone contacts via KDE Connect
Enabled=true

# Sync direction: fromPhone, toPhone, bidirectional
SyncDirection=bidirectional

# Require pairing confirmation
RequirePairing=true

# Sync on phone connection
SyncOnConnect=true

# Contact match field: phone, email, name
MatchField=phone

[LDAP]
# LDAP integration for enterprise
Enabled=false

# LDAP server URL
ServerUrl=

# Bind DN
BindDN=

# Base DN for search
BaseDN=

# Use TLS
UseTLS=true

# Read-only (don't push changes to LDAP)
ReadOnly=true

# Cache LDAP contacts locally
CacheLocally=true

# Cache refresh interval (hours)
CacheRefreshInterval=24

[Privacy]
# Anonymize contacts in logs
AnonymizeInLogs=true

# Encrypt contact cache
EncryptCache=false

# Clear cache on logout
ClearCacheOnLogout=false

# Export restrictions
AllowExport=true
RequireAuthForExport=false

[Notifications]
# Notify on sync complete
NotifyOnSyncComplete=false

# Notify on sync error
NotifyOnSyncError=true

# Notify on merge suggestions
NotifyOnMergeSuggestion=true

# Notify on new shared contact
NotifyOnShare=true

[Import]
# Supported import formats
SupportVCard=true
SupportCSV=true
SupportLDIF=true

# Import duplicate handling: ask, merge, skip, add
DuplicateHandling=ask

# Default address book for import
DefaultImportAddressBook=

[Export]
# Default export format: vcard30, vcard40, csv
DefaultExportFormat=vcard40

# Include photos in export
IncludePhotos=true

# Export encoding: utf8, latin1
ExportEncoding=utf8
