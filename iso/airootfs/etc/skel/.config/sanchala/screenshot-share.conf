# ============================================
# SANCHALA OS - Screenshot Share Configuration
# ============================================
# Quick share actions for screenshots
# Privacy-respecting defaults
# ============================================

[General]
# Default share action
defaultAction=clipboard

# Auto-delete uploaded files after (hours, 0=never)
autoDeleteAfter=0

# Show notification after share
showNotification=true

# Confirm before sharing to cloud
confirmCloudShare=true

[Clipboard]
enabled=true
name=Copy to Clipboard
icon=edit-copy
shortcut=Ctrl+C
# Copy both image and file path
copyImageAndPath=false

[LocalFile]
enabled=true
name=Save to File
icon=document-save
shortcut=Ctrl+S
# Default save directory
directory[$e]=$HOME/Pictures/Screenshots
# Filename format
format=Screenshot_%Y-%m-%d_%H-%M-%S.png

[Imgur]
enabled=false
name=Upload to Imgur
icon=internet-services
shortcut=Ctrl+Shift+I
# Anonymous upload (no account needed)
anonymous=true
# Delete hash storage (for deletion later)
storeDeleteHash=true
# Client ID (user can set their own)
clientId=

[Nextcloud]
enabled=false
name=Upload to Nextcloud
icon=folder-cloud
shortcut=Ctrl+Shift+N
# Server URL (user configurable)
serverUrl=
# Upload directory on server
uploadDir=/Screenshots
# Share link expiration (days, 0=never)
shareExpiration=7
# Password protect shared links
passwordProtect=false

[WebDAV]
enabled=false
name=Upload via WebDAV
icon=folder-remote
shortcut=Ctrl+Shift+W
serverUrl=
uploadDir=/Screenshots
username=
# Password stored in KWallet
useKWallet=true

[Email]
enabled=true
name=Send via Email
icon=mail-send
shortcut=Ctrl+Shift+E
# Compress large images before sending
compressLargeImages=true
maxImageSize=2048
# Default mail client
useDefaultMailer=true

[Print]
enabled=true
name=Print Screenshot
icon=document-print
shortcut=Ctrl+P

[CustomActions]
# User-defined share actions
count=0

# Example custom action:
# [CustomAction_1]
# enabled=true
# name=Upload to My Server
# icon=server-database
# shortcut=Ctrl+Shift+U
# command=curl -F "file=@%f" https://my.server/upload
# showOutput=true
