# ============================================================================
# SANCHALA OS - libinput-gestures Configuration
# ============================================================================
# Alternative gesture daemon (lighter than Touchégg)
# Location: ~/.config/libinput-gestures/libinput-gestures.conf
# ============================================================================

# Gesture format: gesture <type> <fingers> <direction> <command>

# ============================================================================
# 3-FINGER SWIPES - Desktop Navigation
# ============================================================================

# Swipe up: Overview (Mission Control)
gesture swipe up 3 qdbus org.kde.kglobalaccel /component/kwin invokeShortcut "Overview"

# Swipe down: Minimize all / Show Desktop
gesture swipe down 3 qdbus org.kde.kglobalaccel /component/kwin invokeShortcut "MinimizeAll"

# Swipe left: Next desktop
gesture swipe left 3 qdbus org.kde.kglobalaccel /component/kwin invokeShortcut "Switch One Desktop to the Right"

# Swipe right: Previous desktop
gesture swipe right 3 qdbus org.kde.kglobalaccel /component/kwin invokeShortcut "Switch One Desktop to the Left"

# ============================================================================
# 4-FINGER SWIPES - Window Management
# ============================================================================

# Swipe up: Desktop Grid
gesture swipe up 4 qdbus org.kde.kglobalaccel /component/kwin invokeShortcut "ShowDesktopGrid"

# Swipe down: Show Desktop
gesture swipe down 4 qdbus org.kde.kglobalaccel /component/kwin invokeShortcut "Show Desktop"

# Swipe left: Next window (Alt+Tab)
gesture swipe left 4 xdotool key alt+Tab

# Swipe right: Previous window (Alt+Shift+Tab)
gesture swipe right 4 xdotool key alt+shift+Tab

# ============================================================================
# PINCH GESTURES
# ============================================================================

# Pinch in (4 fingers): Show Desktop
gesture pinch in 4 qdbus org.kde.kglobalaccel /component/kwin invokeShortcut "Show Desktop"

# Pinch out (4 fingers): Overview
gesture pinch out 4 qdbus org.kde.kglobalaccel /component/kwin invokeShortcut "Overview"

# Pinch in (3 fingers): Zoom out
gesture pinch in 3 xdotool key ctrl+minus

# Pinch out (3 fingers): Zoom in
gesture pinch out 3 xdotool key ctrl+plus

# ============================================================================
# 2-FINGER PINCH (for apps that support it)
# ============================================================================

# Pinch in: Zoom out
gesture pinch in 2 xdotool key ctrl+minus

# Pinch out: Zoom in
gesture pinch out 2 xdotool key ctrl+plus

# ============================================================================
# CONFIGURATION OPTIONS
# ============================================================================

# Device to use (leave empty for auto-detect)
# device all

# Swipe threshold (default: 0)
swipe_threshold 0

# Timeout for gesture completion in ms (default: 1000)
timeout 1000
