# ============================================================================
# SANCHALA OS - Fcitx5 Clipboard Integration
# ============================================================================
# Location: ~/.config/fcitx5/conf/clipboard.conf
# Clipboard manager addon settings
# ============================================================================

# Number of clipboard entries to keep
Number of entries=10

# Trigger key for clipboard history
TriggerKey=Control+semicolon

# Paste primary clipboard
PastePrimaryKey=Control+Shift+semicolon
