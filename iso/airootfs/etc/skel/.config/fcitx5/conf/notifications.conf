# ============================================================================
# SANCHALA OS - Fcitx5 Notifications
# ============================================================================
# Location: ~/.config/fcitx5/conf/notifications.conf
# Notification settings for input method events
# ============================================================================

# Show notification when input method changes
ShowInputMethodChanged=True

# Show notification timeout (ms, 0 = use system default)
ShowInputMethodChangedTimeout=1000

# Show only in X11 mode
ShowInputMethodChangedOnlyOnX11=False
