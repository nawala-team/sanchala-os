# ============================================
# SANCHALA OS - Orca Screen Reader Settings
# ============================================
# Optimized defaults for WCAG 2.1 AA compliance
# ~/.config/orca/user-settings.conf
# ============================================

import orca.settings

# ============================================
# General Settings
# ============================================
orca.settings.enableSpeech = True
orca.settings.enableBraille = False
orca.settings.enableBrailleMonitor = False
orca.settings.enableEchoByCharacter = False
orca.settings.enableEchoByWord = True
orca.settings.enableEchoBySentence = False
orca.settings.enableKeyEcho = True
orca.settings.enablePrintableKeys = True
orca.settings.enableModifierKeys = True
orca.settings.enableFunctionKeys = True
orca.settings.enableActionKeys = True
orca.settings.enableNavigationKeys = False
orca.settings.enableDiacriticalKeys = False

# ============================================
# Speech Settings
# ============================================
orca.settings.speechServerFactory = "speechdispatcherfactory"
orca.settings.speechServerInfo = None
orca.settings.voices = {
    "default": {
        "established": False,
        "family": {
            "name": "",
            "lang": "",
            "dialect": "",
            "variant": ""
        },
        "rate": 50.0,
        "pitch": 5.0,
        "volume": 10.0
    },
    "uppercase": {
        "average-pitch": 7.0
    },
    "hyperlink": {
        "average-pitch": 3.0
    },
    "system": {
        "established": False,
        "family": {
            "name": "",
            "lang": "",
            "dialect": "",
            "variant": ""
        },
        "rate": 50.0,
        "pitch": 5.0,
        "volume": 10.0
    }
}

# Speech rate (words per minute adjustment)
# Range: 0-100, default 50
orca.settings.speechRate = 50

# Speech pitch
# Range: 0-10, default 5
orca.settings.speechPitch = 5.0

# Speech volume
# Range: 0-10, default 10
orca.settings.speechVolume = 10.0

# ============================================
# Verbosity Settings
# ============================================
orca.settings.verbalizePunctuationStyle = orca.settings.PUNCTUATION_STYLE_SOME
orca.settings.speechVerbosityLevel = orca.settings.VERBOSITY_LEVEL_VERBOSE
orca.settings.readFullRowInGUITable = True
orca.settings.readFullRowInDocumentTable = True
orca.settings.readFullRowInSpreadSheet = False

# ============================================
# Navigation Settings
# ============================================
orca.settings.structuralNavigationEnabled = True
orca.settings.caretNavigationEnabled = True
orca.settings.layoutMode = True

# ============================================
# Presentation Settings
# ============================================
orca.settings.presentToolTips = False
orca.settings.presentDateFormat = "%A, %B %d, %Y"
orca.settings.presentTimeFormat = "%I:%M %p"
orca.settings.presentRequiredState = True

# ============================================
# Table Navigation
# ============================================
orca.settings.speakCellCoordinates = True
orca.settings.speakCellSpan = True
orca.settings.speakCellHeaders = True

# ============================================
# Progress Bar Settings
# ============================================
orca.settings.progressBarUpdateInterval = 10
orca.settings.progressBarVerbosity = orca.settings.PROGRESS_BAR_APPLICATION

# ============================================
# Mouse Review (for low vision users)
# ============================================
orca.settings.enableMouseReview = False
orca.settings.mouseDwellDelay = 0

# ============================================
# Braille Settings (for braille display users)
# ============================================
orca.settings.enableBraille = False
orca.settings.brailleRolenameStyle = orca.settings.BRAILLE_ROLENAME_STYLE_LONG
orca.settings.brailleSelectorIndicator = orca.settings.BRAILLE_SEL_BOTH
orca.settings.brailleLinkIndicator = orca.settings.BRAILLE_LINK_BOTH
orca.settings.enableBrailleContext = True
orca.settings.disableBrailleEOL = False
orca.settings.brailleContractionTable = ""
orca.settings.enableContractedBraille = False
orca.settings.brailleFlashTime = 5000

# ============================================
# Key Bindings - Sanchala OS Customized
# ============================================
# Alt+Super+S: Toggle Orca (set in KDE shortcuts)
# Orca+H: Help
# Orca+Space: Preferences
# Orca+Q: Quit
# Insert or Caps_Lock as Orca modifier (configurable)

orca.settings.orcaModifierKeys = ["Insert", "KP_Insert"]
orca.settings.keyBindingsMap = {}
orca.settings.pronunciationMap = {}

# ============================================
# Profile Management
# ============================================
orca.settings.startingProfile = ["Default", "default"]
