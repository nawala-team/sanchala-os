# ============================================================================
# SANCHALA OS - mkinitcpio Configuration
# ============================================================================
# Install: /etc/mkinitcpio.conf
# Purpose: Configure initramfs generation for Sanchala OS
# ============================================================================

# Modules to load early (before hooks)
MODULES=(btrfs)

# Binary files to include
BINARIES=()

# Files to include
FILES=()

# Hooks - Order matters!
# base        - Essential init
# systemd     - Use systemd in initramfs (faster, cleaner)
# autodetect  - Auto-detect needed modules
# modconf     - Load /etc/modprobe.d configs
# kms         - Kernel Mode Setting (early graphics)
# keyboard    - Keyboard support (for LUKS password)
# sd-vconsole - Console fonts
# block       - Block device support
# sd-encrypt  - systemd LUKS decryption
# filesystems - Filesystem modules
# fsck        - Filesystem check

HOOKS=(base systemd autodetect modconf kms keyboard sd-vconsole block sd-encrypt filesystems fsck)

# Compression
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-3)

# ============================================================================
# ALTERNATIVE: Encrypted Root with TPM Auto-Unlock
# ============================================================================
# For TPM-backed LUKS (auto-unlock on trusted hardware):
# HOOKS=(base systemd autodetect modconf kms keyboard sd-vconsole block sd-encrypt filesystems fsck)
# 
# Then configure systemd-cryptenroll:
#   systemd-cryptenroll --tpm2-device=auto /dev/nvme0n1p2
# ============================================================================
