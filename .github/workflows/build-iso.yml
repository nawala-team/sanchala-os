name: Build Sanchala OS ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      codename:
        description: 'Codename'
        required: true
        default: 'Astra'
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'iso/**'
      - 'pkgbuilds/**'
      - '.github/workflows/build-iso.yml'

env:
  ISO_NAME: sanchala
  ISO_VERSION: ${{ github.event.inputs.version || '1.0.0' }}
  ISO_CODENAME: ${{ github.event.inputs.codename || 'Astra' }}

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Arch Linux environment
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso git base-devel python squashfs-tools libisoburn dosfstools mtools edk2-ovmf grub syslinux

      - name: Setup build directory
        run: |
          mkdir -p /tmp/archiso-work /tmp/archiso-out
          cp -r /usr/share/archiso/configs/releng /tmp/sanchala-profile

      - name: Customize profile
        run: |
          PROFILE=/tmp/sanchala-profile
          
          # Create profiledef.sh
          echo '#!/usr/bin/env bash' > $PROFILE/profiledef.sh
          echo 'iso_name="sanchala"' >> $PROFILE/profiledef.sh
          echo 'iso_label="SANCHALA_202608"' >> $PROFILE/profiledef.sh
          echo 'iso_publisher="NAWALA Team"' >> $PROFILE/profiledef.sh
          echo 'iso_application="Sanchala OS Live/Install ISO"' >> $PROFILE/profiledef.sh
          echo 'iso_version="1.0.0"' >> $PROFILE/profiledef.sh
          echo 'install_dir="sanchala"' >> $PROFILE/profiledef.sh
          echo 'buildmodes=("iso")' >> $PROFILE/profiledef.sh
          echo 'bootmodes=("bios.syslinux" "uefi-x64.grub.esp")' >> $PROFILE/profiledef.sh
          echo 'arch="x86_64"' >> $PROFILE/profiledef.sh
          echo 'pacman_conf="/tmp/sanchala-profile/pacman.conf"' >> $PROFILE/profiledef.sh
          echo 'airootfs_image_type="squashfs"' >> $PROFILE/profiledef.sh
          echo 'airootfs_image_tool_options=("-comp" "zstd" "-Xcompression-level" "15" "-b" "1M")' >> $PROFILE/profiledef.sh
          echo 'file_permissions=(["/etc/shadow"]="0:0:400" ["/root"]="0:0:750")' >> $PROFILE/profiledef.sh
          chmod +x $PROFILE/profiledef.sh
          
          # Add packages
          echo -e "plasma-meta\nplasma-workspace\nplasma-desktop\nplasma-nm\nplasma-pa\nplasma-systemmonitor" >> $PROFILE/packages.x86_64
          echo -e "konsole\ndolphin\nkate\nark\nspectacle\ngwenview\nokular" >> $PROFILE/packages.x86_64
          echo -e "sddm\nsddm-kcm\nbreeze\nbreeze-gtk\nkvantum\npapirus-icon-theme" >> $PROFILE/packages.x86_64
          echo -e "noto-fonts\nnoto-fonts-cjk\nnoto-fonts-emoji\nttf-jetbrains-mono\nttf-fira-code" >> $PROFILE/packages.x86_64
          echo -e "firefox\nnetworkmanager\nnetwork-manager-applet\nbluez\nbluez-utils" >> $PROFILE/packages.x86_64
          echo -e "pipewire\npipewire-alsa\npipewire-pulse\npipewire-jack\nwireplumber" >> $PROFILE/packages.x86_64
          echo -e "firewalld\napparmor\nfirejail\nclamav" >> $PROFILE/packages.x86_64
          echo -e "btrfs-progs\nsnapper\ngrub-btrfs\nflatpak" >> $PROFILE/packages.x86_64
          echo -e "git\nwget\ncurl\nvim\nnano\nhtop\nfastfetch\nbase-devel" >> $PROFILE/packages.x86_64

      - name: Configure system
        run: |
          AIROOTFS=/tmp/sanchala-profile/airootfs
          mkdir -p $AIROOTFS/etc/systemd/system/multi-user.target.wants
          mkdir -p $AIROOTFS/etc/systemd/system/graphical.target.wants
          
          ln -sf /usr/lib/systemd/system/NetworkManager.service $AIROOTFS/etc/systemd/system/multi-user.target.wants/
          ln -sf /usr/lib/systemd/system/sddm.service $AIROOTFS/etc/systemd/system/graphical.target.wants/
          ln -sf /usr/lib/systemd/system/bluetooth.service $AIROOTFS/etc/systemd/system/multi-user.target.wants/
          ln -sf /usr/lib/systemd/system/firewalld.service $AIROOTFS/etc/systemd/system/multi-user.target.wants/
          ln -sf /usr/lib/systemd/system/graphical.target $AIROOTFS/etc/systemd/system/default.target

      - name: Create customize script
        run: |
          AIROOTFS=/tmp/sanchala-profile/airootfs
          mkdir -p $AIROOTFS/root
          cat > $AIROOTFS/root/customize_airootfs.sh << 'SCRIPT'
          #!/bin/bash
          set -e
          echo 'NAME="Sanchala OS"' > /etc/os-release
          echo 'PRETTY_NAME="Sanchala OS 1.0.0 (Astra)"' >> /etc/os-release
          echo 'ID=sanchala' >> /etc/os-release
          echo 'ID_LIKE=arch' >> /etc/os-release
          echo 'VERSION="1.0.0"' >> /etc/os-release
          echo 'VERSION_ID="1.0.0"' >> /etc/os-release
          echo 'VERSION_CODENAME=Astra' >> /etc/os-release
          echo 'BUILD_ID=rolling' >> /etc/os-release
          echo 'HOME_URL="https://github.com/nawala-team/sanchala-os"' >> /etc/os-release
          echo 'LOGO=sanchala' >> /etc/os-release
          echo 'DISTRIB_ID=Sanchala' > /etc/lsb-release
          echo 'DISTRIB_RELEASE=1.0.0' >> /etc/lsb-release
          echo 'DISTRIB_CODENAME=Astra' >> /etc/lsb-release
          echo 'DISTRIB_DESCRIPTION="Sanchala OS 1.0.0 (Astra)"' >> /etc/lsb-release
          useradd -m -G wheel,audio,video,network,storage -s /bin/bash sanchala || true
          echo "sanchala:sanchala" | chpasswd
          echo "root:sanchala" | chpasswd
          echo "%wheel ALL=(ALL:ALL) ALL" > /etc/sudoers.d/wheel
          mkdir -p /etc/sddm.conf.d
          echo '[Autologin]' > /etc/sddm.conf.d/autologin.conf
          echo 'User=sanchala' >> /etc/sddm.conf.d/autologin.conf
          echo 'Session=plasma' >> /etc/sddm.conf.d/autologin.conf
          echo "en_US.UTF-8 UTF-8" > /etc/locale.gen
          locale-gen
          echo "LANG=en_US.UTF-8" > /etc/locale.conf
          ln -sf /usr/share/zoneinfo/UTC /etc/localtime
          echo "sanchala" > /etc/hostname
          SCRIPT
          chmod +x $AIROOTFS/root/customize_airootfs.sh

      - name: Build ISO
        run: |
          mkarchiso -v -w /tmp/archiso-work -o /tmp/archiso-out /tmp/sanchala-profile
          cd /tmp/archiso-out
          ISO_FILE=$(ls *.iso 2>/dev/null || echo "")
          if [ -n "$ISO_FILE" ]; then
            FINAL_NAME="sanchala-1.0.0-Astra-x86_64.iso"
            mv "$ISO_FILE" "$FINAL_NAME"
            sha256sum "$FINAL_NAME" > "$FINAL_NAME.sha256"
            md5sum "$FINAL_NAME" > "$FINAL_NAME.md5"
            echo "ISO built: $FINAL_NAME"
            ls -lh
          fi

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: sanchala-os-1.0.0
          path: |
            /tmp/archiso-out/*.iso
            /tmp/archiso-out/*.sha256
            /tmp/archiso-out/*.md5
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            /tmp/archiso-out/*.iso
            /tmp/archiso-out/*.sha256
            /tmp/archiso-out/*.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
